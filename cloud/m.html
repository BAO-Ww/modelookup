<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>型号查询</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { background:#e9edf3; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
  body { display:flex; justify-content:center; }
  #phone { width:100%; max-width:430px; min-height:100vh; background:#f2f4f8; box-shadow:0 0 40px rgba(0,0,0,.18); position:relative; padding-bottom:58px; }

  /* ===== 登录页 ===== */
  #login { position:absolute; inset:0; z-index:50; background:linear-gradient(180deg,#2e6be6,#2760d2 55%,#f2f4f8); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:calc(20px + env(safe-area-inset-top)) 34px calc(20px + env(safe-area-inset-bottom)); }
  #login .lg { color:#fff; font-size:22px; font-weight:700; letter-spacing:2px; margin-bottom:6px; }
  #login .sub { color:rgba(255,255,255,.75); font-size:12px; margin-bottom:30px; }
  #login input { width:100%; border:none; outline:none; border-radius:10px; padding:12px 14px; font-size:15px; margin-bottom:12px; background:#fff; }
  #login button { width:100%; border:none; border-radius:10px; padding:12px; font-size:16px; font-weight:700; background:#1d4fb8; color:#fff; }
  #login .err { color:#ffd2d2; font-size:12px; min-height:18px; margin-top:8px; text-align:center; }

  /* ===== 顶栏 ===== */
  #top { position:sticky; top:0; z-index:20; background:linear-gradient(180deg,#2e6be6,#2760d2); color:#fff; padding:calc(9px + env(safe-area-inset-top)) 12px 8px; }
  #top h1 { font-size:14px; font-weight:600; display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px; }
  #top h1 small { font-size:10px; font-weight:400; opacity:.72; }
  #top h1 .out { color:#cfe0ff; text-decoration:underline; font-size:11px; }
  .searchrow { display:flex; gap:8px; align-items:center; }
  .searchrow button { border:none; border-radius:9px; padding:0 15px; font-size:14px; background:#1d4fb8; color:#fff; font-weight:600; }
  .qwrap { flex:1; position:relative; min-width:0; }
  .qwrap input { width:100%; border:none; outline:none; border-radius:9px; padding:9px 32px 9px 12px; font-size:14px; background:#fff; color:#222; }
  /* 圆圈叉画在搜索框里面：有字才出现 */
  #qclear { position:absolute; right:7px; top:50%; transform:translateY(-50%); width:20px; height:20px; line-height:19px; text-align:center; border-radius:50%; background:#dfe6f2; color:#5a6b85; font-size:13px; cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; }
  #qclear:active { background:#c9d4e8; }
  /* 子页头部返回箭头 */
  .bk { display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; margin:-6px 6px -6px -10px; font-size:22px; line-height:1; cursor:pointer; opacity:.9; -webkit-tap-highlight-color:transparent; }
  .bk:active { opacity:.5; }
  #topbar { font-size:9.5px; opacity:.72; margin-top:3px; display:flex; justify-content:space-between; }

  /* ===== 红条（点整条=只看缺货商品） ===== */
  #neterr { background:#fff7e0; color:#8a6d1a; font-size:12px; padding:8px 14px; display:none; }

  /* ===== 筛选 ===== */
  #filters { position:sticky; top:73px; z-index:19; display:flex; flex-wrap:wrap; gap:6px; padding:8px 12px 6px; background:#f2f4f8; }
  #filters .f { flex:0 0 auto; font-size:12px; padding:5px 12px; border-radius:14px; background:#fff; color:#445; border:1px solid #dfe4ec; }
  #filters .f.on { background:#2e6be6; color:#fff; border-color:#2e6be6; font-weight:600; }
  #filters .f.more.on { background:#1d4fb8; border-color:#1d4fb8; }
  #hint { padding:4px 14px 6px; font-size:11px; color:#7a8496; display:flex; justify-content:space-between; }

  /* ===== 筛选抽屉 ===== */
  #sheet { position:fixed; inset:0; z-index:40; background:rgba(20,30,50,.4); display:none; }
  #sheet.show { display:block; }
  #sheet .box { position:absolute; left:50%; bottom:0; transform:translateX(-50%); width:100%; max-width:430px; max-height:78vh; overflow-y:auto; background:#fff; border-radius:18px 18px 0 0; padding:14px 16px 20px; }
  #sheet h3 { font-size:13px; color:#333; margin:10px 0 8px; }
  #sheet h3:first-child { margin-top:0; }
  #sheet .opts { display:flex; flex-wrap:wrap; gap:7px; }
  #sheet .opts .o { font-size:12px; padding:6px 13px; border-radius:14px; background:#f2f4f8; color:#445; border:1px solid #e3e8f0; }
  #sheet .opts .o.on { background:#2e6be6; color:#fff; border-color:#2e6be6; font-weight:600; }
  #sheet .rng { display:flex; gap:8px; align-items:center; font-size:12px; color:#667; }
  #sheet .rng input { width:100px; border:1px solid #dfe4ec; border-radius:8px; padding:7px 10px; font-size:13px; }
  #sheet .acts { display:flex; gap:10px; margin-top:16px; }
  #sheet .acts button { flex:1; border:none; border-radius:10px; padding:11px; font-size:14px; font-weight:600; }
  #sheet .acts .reset { background:#f2f4f8; color:#667; }
  #sheet .acts .apply { background:#2e6be6; color:#fff; }

  /* ===== 卡片 ===== */
  #list { padding:2px 12px 20px; }
  .card { background:#fff; border-radius:14px; margin-bottom:10px; overflow:hidden; box-shadow:0 1px 4px rgba(30,50,90,.07); }
  .cardrow { display:flex; padding:10px 10px 6px; gap:10px; }
  .pic { flex:0 0 96px; width:96px; height:96px; border-radius:10px; background:linear-gradient(160deg,#f6f8fb,#e9eef5); display:flex; align-items:center; justify-content:center; color:#a8b4c6; font-size:10px; overflow:hidden; }
  .pic img { width:100%; height:100%; object-fit:contain; }
  .info { flex:1; min-width:0; }
  .mo { font-size:14px; font-weight:700; color:#1c2733; letter-spacing:.3px; display:flex; gap:6px; align-items:baseline; flex-wrap:wrap; }
  .mo .kk { font-size:9px; color:#9aa6b8; font-weight:400; flex:0 0 auto; }
  /* 品牌小标（美的/容声型号看不出牌子，跟电脑端 tag b 同款信息） */
  .mo .bb { font-size:9px; font-weight:600; color:#2e6be6; background:#e5edfc; border-radius:4px; padding:1px 5px; flex:0 0 auto; }
  .mo .bb.md { color:#b45309; background:#fdf0dd; }
  .nm { font-size:11px; color:#6b7686; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* 价格格（对齐电脑端 .pr 胶囊格：盒底圆角描边，上标签下数值） */
  .prgrid { margin-top:6px; display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .pr { display:block; background:#fafbfd; border:1px solid #e6ebf2; border-radius:9px; padding:5px 8px; font-size:11px; color:#7a8496; min-width:0; }
  .pr span { display:block; font-size:10px; color:#8a94a6; margin-bottom:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pr b { color:#1c2733; font-size:13.5px; white-space:nowrap; font-variant-numeric:tabular-nums; letter-spacing:.2px; }
  .pr.hot { background:#fdf3f2; border-color:#f5d5d2; }
  .pr.hot b { color:#e0342b; font-size:14.5px; }
  .pr.tax b { color:#d9534f; }
  .pr.rp b { color:#5b6b85; font-weight:600; }
  .pr.bonus b { color:#b06e0a; }
  .pr.prpick { cursor:pointer; }
  .pr.prpick.on { border-color:#0a7d3b; background:#f2fbf6; }
  .pr.prpick.on b { color:#b06e0a; }
  .pr.qty b { color:#1c2733; }
  .pr .orig { font-style:normal; color:#98a2b3; font-size:10px; text-decoration:line-through; font-weight:400; }
  .pr .none { font-style:normal; color:#b42318; font-weight:400; font-size:11px; }
  /* 库存/发货胶囊（对齐电脑端 pill）：整块换行不拆字 */
  .pillrow { margin-top:6px; display:flex; flex-wrap:wrap; gap:4px; font-size:10px; }
  .pill { display:inline-block; border-radius:9px; padding:2px 7px; font-weight:600; line-height:1.5; white-space:nowrap; margin:0 4px 3px 0; }
  .pill.ok  { background:#e2f5e9; color:#0a7d3b; }
  .pill.no  { background:#fdecec; color:#c02626; }
  .pill.hm  { background:#e8ecf5; color:#4a5b78; }
  .pill.wh  { background:#eef4ff; color:#2e5aa8; }
  .pill.wh em { font-style:normal; font-weight:400; opacity:.75; font-size:9px; }
  .pill.wh.sky { background:#e6f3fb; color:#1a6f9e; }
  .pill.wh.bad { background:#fdecec; color:#c02626; }
  .pill.wh.warn { background:#fdf3e0; color:#9a6b0a; }
  .pill.wh.mute { background:#eef0f4; color:#6b7686; }
  .pill.whmore { background:#eef0f4; color:#6b7686; }
  .pill.ship { background:#f0f2f7; color:#4a5b78; font-weight:500; }
  .pill.ship.y { background:#e2f5e9; color:#0a7d3b; }
  .pill.ship.f { background:#e6f3fb; color:#1a6f9e; }
  .pill.src { background:#f0f2f7; color:#6b7686; font-weight:500; }
  .pill.pubed { background:#0a7d3b; color:#fff; }
  .pubbar { display:flex; align-items:center; gap:8px; font-size:10.5px; color:#8a94a6; padding:4px 10px 0; }
  .pubbar .pubed { flex:0 0 auto; }
  /* 计算器（对齐电脑端 .calc） */
  .calc { margin:8px 10px 10px; background:#f6f8fc; border:1px solid #e3e8f0; border-radius:10px; padding:8px 10px; font-size:12px; color:#445; }
  .calc .l1 { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .calc .cl { font-weight:700; color:#1c2733; flex:0 0 auto; }
  .calc input[type=number] { flex:0 0 auto; width:112px; border:1px solid #d5dbe6; border-radius:8px; padding:6px 8px; font-size:14px; font-weight:600; }
  .calc select { flex:1 1 auto; min-width:0; max-width:170px; border:1px solid #d5dbe6; border-radius:8px; padding:6px 4px; font-size:11.5px; background:#fff; color:#1c2733; }
  .calc .cfr { font-size:11px; color:#4a5b78; display:flex; align-items:center; gap:4px; }
  .calc .l2 { display:flex; gap:14px; margin-top:6px; font-size:11.5px; color:#6b7686; }
  .calc .l2 b { color:#1c2733; }
  .calc .l2 .pos { color:#0a7d3b; }
  .calc .l2 .neg { color:#c02626; }
  .cardbtns { display:flex; border-top:1px solid #eef1f6; }
  .cardbtns button { flex:1; border:none; background:#fff; font-size:12.5px; padding:10px 0; color:#2e6be6; font-weight:600; }
  .cardbtns button + button { border-left:1px solid #eef1f6; }
  .cardbtns button.warn { color:#c02626; }
  .cardbtns button[disabled] { color:#c3cad6; }
  .card .crow { display:flex; align-items:flex-start; gap:8px; padding:7px 12px 0; font-size:12px; line-height:1.6; }
  .card .crow label { flex:0 0 52px; color:#8a94a6; }
  .card .crow .vs { flex:1; min-width:0; }
  .card .crow .pill { font-size:10.5px; padding:1px 6px; }
  .card .crow .mono { font-family:Consolas,monospace; color:#1c2733; font-weight:600; letter-spacing:.3px; }
  #dlg { position:fixed; inset:0; background:rgba(15,25,40,.45); display:none; align-items:center; justify-content:center; z-index:60; }
  #dlg.show { display:flex; }
  #dlg .dlgbox { background:#fff; border-radius:14px; width:min(320px,86vw); padding:16px 16px 12px; box-shadow:0 10px 40px rgba(15,25,40,.25); }
  #dlgMsg { font-size:13px; color:#1c2733; line-height:1.7; white-space:pre-wrap; }
  #dlgInp { width:100%; box-sizing:border-box; margin-top:10px; border:1px solid #d9e1ec; border-radius:9px; padding:10px 12px; font-size:15px; }
  #dlg .dlgb { display:flex; gap:10px; margin-top:14px; }
  #dlg .dlgb button { flex:1; border:none; border-radius:9px; padding:11px 0; font-size:14px; font-weight:600; }
  #dlgCancel { background:#f0f3f8; color:#5a6577; }
  #dlgOk { background:#2e6be6; color:#fff; }
  #empty { text-align:center; color:#8a94a6; font-size:13px; padding:60px 0; display:none; }
  #foot { text-align:center; font-size:10.5px; color:#9aa6b8; padding:0 20px 20px; line-height:1.7; }
  #more { text-align:center; font-size:11px; color:#8a94a6; padding:0 0 10px; }

  /* ===== 底部导航 ===== */
  #tabs { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px; background:#fff; border-top:1px solid #e3e8f0; display:flex; z-index:30; padding-bottom:env(safe-area-inset-bottom); }
  #tabs .t { flex:1; text-align:center; font-size:10.5px; color:#8a94a6; padding:7px 0 6px; position:relative; }
  #tabs .t .ic { font-size:19px; line-height:1.2; }
  #tabs .t.on { color:#2e6be6; font-weight:700; }
  #tabs .t .bdg { position:absolute; top:4px; right:calc(50% - 22px); background:#e0342b; color:#fff; font-size:9px; border-radius:9px; padding:0 5px; min-width:16px; line-height:15px; }

  /* ===== 消息 / 我的 ===== */
  .view { display:none; }
  .view.on { display:block; }
  #view-msg .sec { margin:12px 12px 0; }
  #view-msg .sec h2 { font-size:13px; color:#333; margin-bottom:8px; }
  #view-msg .sec h2 #lostAll { float:right; color:#2e6be6; font-weight:600; }
  #view-msg .mrow { background:#fff; border-radius:12px; padding:10px 12px; margin-bottom:8px; font-size:12.5px; box-shadow:0 1px 3px rgba(30,50,90,.06); display:flex; justify-content:space-between; align-items:center; gap:8px; }
  #view-msg .mrow .mo { font-weight:700; color:#1c2733; }
  #view-msg .mrow .sub { font-size:11px; color:#8a94a6; margin-top:2px; }
  #view-msg .mrow .go { flex:0 0 auto; color:#2e6be6; font-weight:600; font-size:12px; }
  #view-msg .mrow.bad .mo { color:#c02626; }
  #view-msg .calm { text-align:center; color:#9aa6b8; font-size:12px; padding:30px 0; }
  #view-me .box { background:#fff; border-radius:14px; margin:12px; padding:14px 16px; font-size:13px; box-shadow:0 1px 4px rgba(30,50,90,.07); }
  #view-me .box .row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed #eef1f6; }
  #view-me .box .row:last-child { border-bottom:none; }
  #view-me .box .row span:first-child { color:#7a8496; }
  #view-me .act { display:flex; align-items:center; gap:9px; padding:11px 2px; border-bottom:1px dashed #eef1f6; cursor:pointer; font-size:13.5px; color:#1c2733; font-weight:600; }
  #view-me .act:last-child { border-bottom:none; }
  #view-me .act:active { background:#f2f6ff; }
  #view-me .act .ai { font-size:15px; width:20px; text-align:center; }
  #view-me .act .an { font-style:normal; margin-left:auto; background:#eef2f8; color:#5b6b85; border-radius:9px; padding:1px 8px; font-size:11px; font-weight:700; }
  #view-me .act .an.warn { background:#fdecec; color:#b42318; }
  #view-me .act .asub { margin-left:auto; font-size:10.5px; color:#98a2b3; font-weight:400; }
  #view-me .act .chev { color:#c3cad6; font-size:15px; margin-left:6px; }
  #view-me .act .asub ~ .chev { margin-left:6px; }
  #view-me .box .row b { color:#1c2733; }
  #view-me .out { display:block; width:calc(100% - 24px); margin:6px 12px 20px; border:none; border-radius:12px; padding:12px; background:#fff; color:#c02626; font-weight:700; font-size:14px; box-shadow:0 1px 4px rgba(30,50,90,.07); }

  #toast { position:fixed; left:50%; bottom:70px; transform:translateX(-50%) translateY(20px); background:rgba(28,39,51,.9); color:#fff; font-size:12.5px; padding:9px 18px; border-radius:18px; opacity:0; transition:.25s; z-index:99; pointer-events:none; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="phone">

  <!-- 登录页 -->
  <div id="login" style="display:none">
    <div class="lg">型号查询</div>
    <div class="sub">手机版 · 登录后使用</div>
    <input id="lu" placeholder="账号" autocomplete="username">
    <input id="lp" type="password" placeholder="密码" autocomplete="current-password">
    <button id="lgo">登 录</button>
    <div class="err" id="lerr"></div>
  </div>

  <!-- 主界面 -->
  <div id="app" style="display:none">

    <!-- ============ 首页 ============ -->
    <div class="view on" id="view-home">
      <div id="top">
        <div class="searchrow">
          <div class="qwrap">
            <input id="q" placeholder="搜型号 / 名称，如 BCD-501" autocomplete="off">
            <span id="qclear" hidden>×</span>
          </div>
          <button id="go">查询</button>
        </div>
        <div id="topbar"><span id="tsStock"></span><span id="tsData"></span><span id="updapp" hidden style="color:#ffd75e;cursor:pointer;white-space:nowrap">⟳ 检查更新</span></div>
      </div>

      <div id="neterr"></div>

      <div id="filters">
        <div class="f on" data-kind="all">全部</div>
        <div class="f" data-kind="z">正品</div>
        <div class="f" data-kind="l">滞销</div>
        <div class="f" data-kind="s">样机</div>
        <div class="f" data-flag="stock">有货</div>
        <div class="f" data-flag="send">发全国</div>
        <div class="f more" id="fbtn">筛选</div>
      </div>
      <div id="hint"><span id="hintL"></span><span id="hintR"></span></div>

      <div id="list"></div>
      <div id="empty">没有匹配的商品</div>
      <div id="more" hidden></div>
      <div id="foot">数据与电脑端同源（云端直读）</div>
    </div>

    <!-- ============ 已发布 ============ -->
    <div class="view" id="view-pub">
      <div style="background:linear-gradient(180deg,#2e6be6,#2760d2);color:#fff;padding:12px 14px;font-size:15px;font-weight:700;display:flex;align-items:center"><span class="bk">‹</span>已发布</div>
      <div id="pubHint" style="font-size:11px;color:#8a94a6;padding:8px 14px 0"></div>
      <div id="pubList" style="padding:2px 12px 20px"></div>
      <div id="pubCalm" style="display:none;padding:44px 20px;text-align:center;color:#9aa6b8;font-size:12.5px;line-height:1.9">还没有发布的型号<br>回首页在卡片上点「标记发布」</div>
    </div>

    <!-- ============ 消息 ============ -->
    <div class="view" id="view-msg">
      <div id="top2" style="background:linear-gradient(180deg,#2e6be6,#2760d2);color:#fff;padding:12px 14px;font-size:15px;font-weight:700;display:flex;align-items:center"><span class="bk">‹</span>消息</div>
      <div class="sec" id="msgLost"><h2>⚠ 已发布 · 没库存 <a id="lostAll">全部列出</a></h2><div id="msgLostList"></div></div>
      <div class="sec" id="msgLoss"><h2>💰 亏钱哨兵 · 定价低于成本</h2><div id="msgLossList"></div></div>
      <div class="sec" id="msgAlert" style="display:none"><h2>🔔 用友告警</h2><div id="msgAlertList"></div></div>
      <div class="calm" id="msgCalm" style="display:none">没有提醒，一切都好</div>
    </div>

    <!-- ============ 我的 ============ -->
    <div class="view" id="view-me">
      <div style="background:linear-gradient(180deg,#2e6be6,#2760d2);color:#fff;padding:18px 16px 22px">
        <div style="font-size:17px;font-weight:700;display:flex;align-items:center"><span class="bk">‹</span><span id="meName">—</span></div>
      </div>
      <div class="box" id="meStats"></div>
      <div class="box" id="meActs"></div>
      <button class="out" id="logout">退出登录</button>
    </div>

  </div>

  <!-- 筛选抽屉 -->
  <div id="sheet">
    <div class="box">
      <h3>状态</h3><div class="opts" id="shState">
        <div class="o" data-v="no">没库存</div>
        <div class="o" data-v="loss">亏钱</div>
      </div>
      <h3>品牌</h3><div class="opts" id="shBrand"></div>
      <h3>品类</h3><div class="opts" id="shCat"></div>
      <h3>价格类型</h3><div class="opts" id="shPtype"></div>
      <h3>价格区间（最低清理价）</h3>
      <div class="rng"><input id="shPmin" type="number" inputmode="numeric" placeholder="最低"> — <input id="shPmax" type="number" inputmode="numeric" placeholder="最高"></div>
      <div class="acts"><button class="reset" id="shReset">重置</button><button class="apply" id="shApply">确定</button></div>
    </div>
  </div>

  <!-- 底部导航 -->
  <div id="tabs" style="display:none">
    <div class="t on" data-v="home"><div class="ic">🏠</div>首页</div>
    <div class="t" data-v="pub"><div class="ic">📌</div>已发布<div class="bdg" id="pubBdg" style="display:none">0</div></div>

<script>
/* ============ 云端地址：worker 里部署时用自身域名，本地预览连正式云 ============ */
var API = (/^https?:/.test(location.protocol) && !/^(localhost|127\.0\.0\.1)/.test(location.host))
  ? location.origin : 'https://auth.baozang.kdns.fr';

/* ============ 状态 ============ */
var AUTH = null;                 // {token,u,role,perm}
var MP = window.__MP__ || null;  // 目录：{meta, rows, imgs}（本地预览内嵌 / 云端 /mpayload）
var STOCK = null;                // {ts, stock, sbc}
var MARKED = {}, PRICES = {};    // 自己的发布记录 / 定价
var MYIMGS = {};                 // 云端补图库（KV myimgs，登录后拉一次，同电脑端 MYIMGS）
var ALL = [], cur = [], shown = 0, BATCH = 30;
var fk = 'all', q = '', curBrand = '', curCat = '', curPtype = '', pminV = null, pmaxV = null;
var fStock = false, fSend = false;   /* 开关型筛选（同电脑端顶栏，可叠加）：有货 / 发全国 */
var fNo = false, fLoss = false, LOSS_KEYS = [];   // 抽屉里的状态筛选：没库存 / 亏钱
var FEE = 0.016;                 // 闲鱼平台费率 1.6%（同电脑端）
var ONLINE = true;               /* 2026-10-13 真软件化：APP 断网时本地快照只许查（改数据一律拦） */

/* ============ 归一化（与电脑端严格一致） ============ */
function half(s){ return String(s==null?'':s).replace(/[\uFF01-\uFF5E]/g,function(c){ return String.fromCharCode(c.charCodeAt(0)-0xFEE0); }).replace(/\u3000/g,' '); }
function norm(s){ return half(s).replace(/\s+/g,'').toUpperCase(); }
function coreOf(s){ var n=norm(s), m=n.match(/[\u4e00-\u9fff]/); if(m&&m.index>=3) return n.slice(0,m.index).replace(/[()\-_/+.,、，]+$/,''); return n; }
function coreOf2(s){ var p=norm(s).split(/[^0-9A-Z\/*\-+.]+/).filter(function(x){return x.length>=3;}); if(!p.length) return ''; p.sort(function(a,b){return b.length-a.length;}); return p[0]; }
var RE_KITCHEN = /油烟|燃气灶|煤气灶|灶具|洗碗|消毒柜|蒸箱|蒸烤|烤箱|小厨宝|电磁灶|电磁炉|微波炉|集成灶|厨房|厨电/;
var RE_SMALL = /电饭煲|压力锅|破壁机|空气炸|电水壶|电火锅|电饼铛|绞肉|料理机|榨汁|豆浆|风扇|吸尘|洗地|生活家电|小家电|除湿|加湿|暖风|电暖|门锁|晾衣|晾晒/;
function catGroup(v){
  var t = norm(v);
  if (!t) return '其他';
  if (t.indexOf('空调')>=0 || t==='风管机' || t==='小风管' || t==='柜嵌' || t.indexOf('热泵')>=0 || t.indexOf('家中机')>=0) return '空调';
  if (t.indexOf('冰箱')>=0) return '冰箱';
  if (t.indexOf('冷柜')>=0 || t.indexOf('冰柜')>=0) return '冷柜';
  if (t.indexOf('洗衣')>=0) return '洗衣机';
  if (t.indexOf('热水')>=0) return '热水器';
  if (t.indexOf('净水')>=0 || t.indexOf('净饮')>=0 || t.indexOf('饮水')>=0) return '净水';
  if (t.indexOf('电视')>=0 || t.indexOf('彩电')>=0) return '电视';
  if (RE_KITCHEN.test(t)) return '厨电';
  if (RE_SMALL.test(t)) return '小家电';
  return '其他';
}
function isNum(v){ return typeof v==='number' && isFinite(v); }
function money(v){ if (v==null) return ''; if (!isNum(v)) return String(v); return '¥' + v.toLocaleString('zh-CN',{maximumFractionDigits:2}); }
function round2(x){ return Math.round(x*100)/100; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function nameOf(it){ return it.n || ''; }

/* ============ 发货 / 全国可发口径（照搬电脑端） ============ */
var NAT_EXTRA = { '可以':'y', '可以发':'y', '报备可发全国':'y', '找品类报备确认':'q', '一单一询是否能发外地':'q',
                  '进货大于3年可以发外区':'s', '进货小于3年不能发外区':'s' };
var NAT_LOCAL = ['不可以','不可发','不能发','不可','否','N','n','0','0.0','不','×','x','不支持'];
var SHIP_EXTRA = {
  '全国，含运费':              { t:'全国 · 含运费', k:'f' },
  '可发全国加运费100':        { t:'可发全国 · 加100运费', k:'y' },
  '报备可发全国加运费100':     { t:'报备可发全国 · 加100运费', k:'y' },
  '询问是否可发全国加运费100':  { t:'加100运费可发全国', k:'q' }
};
/* 「发货区域」写成城市清单（广州/韶关/…/东莞）的解析（2026-10-13 用户口径，照电脑端）：
   深莞惠三城包邮底线（广州也不包邮），清单多出来的城市可发但要加 100 运费 */
function shipCityExtra(ship){
  var s = String(ship==null?'':ship).trim();
  if (s.indexOf('/')<0) return null;
  var base = {'深圳':1,'东莞':1,'惠州':1};
  var out=[], seen={};
  s.split('/').forEach(function(c){
    c = c.replace(/^\s+|\s+$/g,'');
    if (!c || seen[c]) return;
    seen[c]=1;
    if (!base[c]) out.push(c);
  });
  return out;
}
/* 公布版「全国可发」原文覆盖区域解析（照电脑端）：工贸覆盖区域那族 → 城市清单 */
function natRegionCities(raw){
  var s = String(raw==null?'':raw).replace(/\s+/g,' ').trim();
  var m = s.indexOf('工贸覆盖区域');
  if (m<0) return null;
  s = s.slice(m+6);
  var out=[], seen={};
  s.split(/[，,、\/ ]+/).forEach(function(c){
    c = c.replace(/^可发/,'');
    if (!c || seen[c]) return;
    seen[c]=1;
    out.push(c);
  });
  return out.length ? out : null;
}
function canNationwide(it, kind){
  /* 2026-10-13 三改（照电脑端）：所有产品都能发，包邮只有深莞惠，其余可达区域一律+100
     → 除「全国，含运费」族（运费已包）外都出 −100 勾选框 */
  if (kind==='l' || kind==='s'){
    var kk = natkOf(it, kind);
    if (kk!=null) return true;
  }
  var ship = it.ship==null?'':String(it.ship).trim();
  if (ship){
    var m0 = SHIP_EXTRA[ship];
    if (m0) return m0.k==='y' || m0.k==='q';
  }
  return true;
}
/* 口径 → 语义码：优先该口径自己的 natkl/natks，老数据回退卡级 natk */
function natkOf(it, kind){
  if (kind==='s' && it.natks!=null) return it.natks;
  if (kind==='l' && it.natkl!=null) return it.natkl;
  return it.natk;
}
/* 口径标签 → kind：'样机清理价'→s、'滞销清理价'→l、其它→null */
function kindOfBasis(label){
  var s = String(label||'');
  if (s.indexOf('样机')>=0) return 's';
  if (s.indexOf('滞销')>=0) return 'l';
  return null;
}
function canSendNationwide(it){
  /* 2026-10-13 二次定稿（照搬电脑端）：任一口径能发全国就算——
     正品看价格表「发货区域」，滞销/样机各看公布版自己的格 */
  var s = String(it.ship==null?'':it.ship).trim();
  var m = SHIP_EXTRA[s];
  if (s.indexOf('全国')>=0 || (m && (m.k==='y' || m.k==='q' || m.k==='f'))) return true;
  if (it.natkl===1 || it.natkl===2) return true;
  if (it.natks===1 || it.natks===2) return true;
  var _nat = String(it.nat==null?'':it.nat).replace(/^[\s\-—－–]+/,'').trim();
  if (_nat && (_nat.indexOf('不可')===0 || _nat.indexOf('不能')===0 || _nat.indexOf('省内')>=0 || _nat.indexOf('覆盖')>=0)) return false;
  if (it.natk===1 || it.natk===2) return true;
  return false;
}

/* ============ 云端调用 ============ */
function api(path, opt){
  opt = opt || {};
  var h = opt.headers || {};
  if (AUTH && AUTH.token) h['X-Token'] = AUTH.token;
  if (opt.body) h['Content-Type'] = 'application/json';
  return fetch(API + path, { method: opt.method || 'GET', headers: h, body: opt.body ? JSON.stringify(opt.body) : undefined })
    .then(function(r){ return r.json().then(function(j){ if (r.status===401) throw {auth:true,msg:'登录过期'}; if(!r.ok||j.ok===false) throw {msg:j.msg||('HTTP '+r.status)}; return j; }); });
}

/* ============ 在线/离线（2026-10-13 真软件化）============
   断网时 APP 用本地快照照常查，但改数据的操作（标记/取消/定价落库）全拦——
   防止和云端打架。网络失败的判定：api() 里 fetch 层抛的错没有 .msg 字段 */
function setOnline(ok){
  if (ONLINE === ok) return;
  ONLINE = ok;
  var el = document.getElementById('tsData');
  if (el) el.textContent = ok ? '' : '离线 · 只许查';
}
function wentOffline(){ setOnline(false); }
function needOnline(){
  if (ONLINE) return true;
  toast('离线模式：只能查，联网后再操作');
  return false;
}

/* 自绘弹窗：withInput=true 带定价输入框；cb 收 true/false/null/数字
   （prompt/confirm 在部分 webview 沙箱里被静默拦截，不可靠） */
function dlg(msg, withInput, cb){
  var box = document.getElementById('dlg');
  document.getElementById('dlgMsg').textContent = msg;
  var inp = document.getElementById('dlgInp');
  inp.style.display = withInput ? 'block' : 'none';
  inp.value = '';
  box.classList.add('show');
  hPush({ m:1, d:1 });
  if (withInput) setTimeout(function(){ inp.focus(); }, 60);
  function close(v){
    box.classList.remove('show');
    hBack();
    document.getElementById('dlgOk').onclick = null;
    document.getElementById('dlgCancel').onclick = null;
    inp.onkeydown = null;
    cb(v);
  }
  document.getElementById('dlgOk').onclick = function(){
    if (withInput){
      var v = parseFloat(String(inp.value).replace(/[^\d.]/g,''));
      close(isFinite(v) && v>0 ? v : null);
    } else close(true);
  };
  document.getElementById('dlgCancel').onclick = function(){ close(withInput ? null : false); };
  inp.onkeydown = function(e){ if (e.key==='Enter'){ e.preventDefault(); document.getElementById('dlgOk').click(); } };
}

/* ============ 库存口径（编码优先、型号兜底——同电脑端） ============ */
function stockOf(mo, name, code){
  var s = STOCK && STOCK.stock; if (!s) return null;
  if (code){ var bc=STOCK.sbc, ck=norm(code); if (bc&&ck&&bc[ck]) return bc[ck]; }
  var k = norm(mo);
  if (s[k]) return s[k];
  if (!name) return null;
  var n = norm(name), hit = null;
  for (var key in s){
    if (key.length > k.length && key.lastIndexOf(k,0)===0 && n.indexOf(key)>=0){
      if (hit) return null; hit = s[key];
    }
  }
  return hit;
}
function extStockFree(it){
  if (!it) return false;
  if (it._md) return true;
  if (it.b==='美的' || it.b==='容声' || it.b==='科沃斯') return true;
  return String(it.sfrom||'').trim()==='HM夏';
}
function pubLeftOf(mo, kind, name, code){
  for (var i=0;i<ALL.length;i++){ if (ALL[i].mo===mo && extStockFree(ALL[i])) return 1; }
  var live = stockOf(mo, name, code);
  if (live) return isNum(live.a) ? Math.round(live.a) : 0;
  if (STOCK && STOCK.stock && Object.keys(STOCK.stock).length) return 0;
  var it=null; for (var j=0;j<ALL.length;j++){ if (ALL[j].mo===mo){ it=ALL[j]; break; } }
  var qv = it ? (isNum(it.lq)?it.lq:(isNum(it.sq)?it.sq:null)) : null;
  return isNum(qv)?qv:0;
}
/* 三无隐藏（浏览模式）：没库存+没价 → 不列；已发布/豁免恒显 */
function ptypeHas(it){
  return (isNum(it.pt)&&it.pt>0) || (isNum(it.lpz)&&it.lpz>0) || it.lpz==='送'
      || (isNum(it.spz)&&it.spz>0) || it.spz==='送'
      || isNum(it.mh) || isNum(it.m2);
}
function isBlankCard(it){
  if (extStockFree(it) || MARKED[it.c]) return false;
  var live = stockOf(it.mo, nameOf(it));
  if (live && ((live.a||0)>0 || (live.q||0)>0)) return false;
  if (!(STOCK && STOCK.stock && Object.keys(STOCK.stock).length)){
    if ((isNum(it.lav)?it.lav:0)>0 || (isNum(it.sav)?it.sav:0)>0) return false;
  }
  return !ptypeHas(it);
}

/* ============ 权限 ============ */
function pok(k){
  if (!AUTH) return false;
  if (AUTH.role==='admin') return true;
  if (!AUTH.perm || !Object.keys(AUTH.perm).length) return true;   // 没拉到权限先全放（同电脑端兜底）
  return !!AUTH.perm[k];
}

/* ============ 建索引 ============ */
var BRANDS = [], CATS = [];
function buildIndex(){
  ALL = (MP && MP.rows || []).map(function(it){
    it._n = norm(it.mo); it._c = it.c || coreOf(it.mo);
    it._c2 = coreOf2(it.mo); it._h = norm([it.cat, it.b, it.n, it.code, it.st, it.note].join(' '));
    it._md = isNum(it.mh) || isNum(it.m2) || isNum(it.mr);
    it._cg = catGroup(it.cat);
    return it;
  });
  var mb = {}, mc = {};
  ALL.forEach(function(it){
    if (it.b) mb[it.b] = (mb[it.b]||0)+1;
    if (it._cg) mc[it._cg] = (mc[it._cg]||0)+1;
  });
  BRANDS = Object.keys(mb).map(function(k){ return { k:k, n:mb[k] }; }).sort(function(a,b){ return b.n-a.n; });
  var CAT_ORDER = ['冰箱','空调','洗衣机','净水','厨电','电视','热水器','冷柜','其他','小家电'];
  CATS = Object.keys(mc).map(function(k){ return { k:k, n:mc[k] }; }).sort(function(a,b){
    var ia = CAT_ORDER.indexOf(a.k), ib = CAT_ORDER.indexOf(b.k);
    if (ia<0 && ib<0) return b.n-a.n;
    if (ia<0) return 1; if (ib<0) return -1;
    return ia-ib;
  });
}

/* ============ 价格类型（七型，同电脑端 ptypeOf） ============ */
function ptypeOf(it){
  var pt = isNum(it.pt) && it.pt > 0,
      lz = (isNum(it.lpz) && it.lpz > 0) || it.lpz === '送',
      sj = (isNum(it.spz) && it.spz > 0) || it.spz === '送';
  if (pt && !lz && !sj) return 'tax';
  if (pt &&  lz &&  sj) return 'tax_l_s';
  if (pt &&  lz && !sj) return 'tax_l';
  if (pt && !lz &&  sj) return 'tax_s';
  if (!pt && lz && !sj) return 'l';
  if (!pt && sj && !lz) return 's';
  if (!pt && lz &&  sj) return 'l_s';   /* 滞销+样机（2026-10-13 补齐） */
  return '';
}
function lowPrice(it){
  var a = isNum(it.lpz) && it.lpz>0 ? it.lpz : (it.lpz==='送' ? 0 : null),
      b = isNum(it.spz) && it.spz>0 ? it.spz : (it.spz==='送' ? 0 : null);
  if (a!=null && b!=null) return Math.min(a,b);
  var v = (a!=null ? a : b);
  if (v!=null) return v;
  return isNum(it.mh) ? it.mh : null;
}

/* ============ 检索 / 筛选 ============ */
function pass(it){
  if (curBrand && it.b !== curBrand) return false;
  if (curCat && it._cg !== curCat) return false;
  if (curPtype && ptypeOf(it) !== curPtype) return false;
  if (fk==='z'){ if (it.k && (it.k.indexOf('l')>=0 || it.k.indexOf('s')>=0)) return false; }
  else if (fk==='l'||fk==='s'){ if (!it.k || it.k.indexOf(fk)<0) return false; }
  /* 开关型筛选（同电脑端顶栏，可互相叠加）：有货 / 发全国 / 未发布 / 已发布 */
  if (fStock){
    if (extStockFree(it)) {} else {
      var lv = stockOf(it.mo, nameOf(it), it.code);
      var has = lv ? ((lv.a||0)>0 || (lv.q||0)>0)
                   : ((isNum(it.lav)?it.lav:0)>0 || (isNum(it.sav)?it.sav:0)>0);
      if (!has) return false;
    }
  }
  if (fSend && !canSendNationwide(it)) return false;
  /* 抽屉「状态」：没库存 = 已发布且用友清零；亏钱 = 按当前口径净挣为负 */
  if (fNo && PUBWARN_LOST.indexOf(it.c) < 0) return false;
  if (fLoss && LOSS_KEYS.indexOf(it.c) < 0) return false;
  if (pminV!=null || pmaxV!=null){
    var bp = lowPrice(it); if (bp==null) return false;
    if (pminV!=null && bp < pminV) return false;
    if (pmaxV!=null && bp > pmaxV) return false;
  }
  return true;
}
function doSearch(){
  if (fLoss) LOSS_KEYS = lossList().map(function(x){ return x.it.c; });
  var res = [], qn = norm(q), qc = coreOf(q), qc2 = coreOf2(q);
  for (var i=0;i<ALL.length;i++){
    var it = ALL[i];
    if (!pass(it)) continue;
    if (qn){
      var sc = 0;
      if (it._n===qn) sc=6;
      else if (qc && it._c===qc) sc=5;
      else if (qc2 && it._c2===qc2) sc=4;
      else if (qc && it._c.indexOf(qc)===0) sc=3;
      else if (qc && it._c.indexOf(qc)>0) sc=2;
      else if (it._h.indexOf(qn)>=0) sc=1;
      if (!sc) continue;
    } else if (fk==='all' && !fStock && !fSend && !curBrand && !curCat && !curPtype && !fNo && !fLoss && pminV==null && pmaxV==null && isBlankCard(it)) continue;
    res.push(it);
  }
  if (qn) res.sort(function(a,b){ return a._c.length - b._c.length; });
  cur = res; shown = 0;
  listEl.innerHTML = '';
  document.getElementById('empty').style.display = res.length?'none':'block';
  var extra = (curBrand?curBrand+' · ':'') + (curCat?curCat+' · ':'') + (curPtype?'类型·'+PTYPE_TXT[curPtype]+' · ':'')
    + (fk==='z'?'正品 · ':'') + (fk==='l'?'滞销 · ':'') + (fk==='s'?'样机 · ':'')
    + (fStock?'有货 · ':'') + (fSend?'发全国 · ':'')
    + (fNo?'没库存 · ':'') + (fLoss?'亏钱 · ':'');
  hintL.textContent = extra + (res.length ? ('共 ' + res.length + ' 件') : '');
  hintR.textContent = '';
  renderBatch();
}
/* 直接渲染指定卡列表（不走搜索/筛选，不碰搜索框）——缺货商品专用 */
function showItems(items, label){
  cur = items; shown = 0;
  listEl.innerHTML = '';
  document.getElementById('empty').style.display = items.length ? 'none' : 'block';
  hintL.textContent = label; hintR.textContent = '';
  renderBatch();
  switchTab('home');
  window.scrollTo(0,0);
}
var PTYPE_TXT = { tax:'含税', l:'滞销价', s:'样机价', tax_l_s:'含税+滞销+样机', tax_l:'含税+滞销', tax_s:'含税+样机', l_s:'滞销+样机' };

/* ============ 价格格（照电脑端 prCell 样式与顺序） ============ */
function prCell(label, v, cls, pick){
  if (v==null || v==='') return '';
  var on = pick && CALCPICK && CALCPICK.c===CURKEY_DUMMY; /* 占位，实际高亮在渲染时按 calc 状态 */
  var attr = '';
  if (pick==='bonus-lb' || pick==='bonus-sb'){
    attr = ' prpick" data-bonus="' + (pick==='bonus-lb'?'lb':'sb') + '" data-v="' + v + '"';
  } else if (pick){
    attr = ' prpick" data-basis="' + esc(pick) + '" data-v="' + v + '"';
  }

  var feeEl = box.querySelector('.p-fee'), outEl = box.querySelector('.p-out');

    if (canNationwide(it, _kind)){ cfr.closest('.cfr').hidden = false; }
    else { cfr.checked = false; cfr.closest('.cfr').hidden = true; }
  }
  if (!isFinite(price) || price<=0 || !isFinite(cost)){
    feeEl.textContent='—'; outEl.textContent='—'; outEl.className='p-out'; return;
  }
  var bn = (parseFloat(box.getAttribute('data-bnlb'))||0) + (parseFloat(box.getAttribute('data-bnsb'))||0);
  var freight = (cfr && cfr.checked) ? 100 : 0;
  var fee = round2(price*FEE), profit = round2(price - price*FEE - cost + bn - freight);
  var tags = [];
  if (bn>0) tags.push('含奖'+money(bn));
  if (freight) tags.push('已扣运费100');
  feeEl.textContent = money(fee);
  outEl.textContent = (profit>=0?'+':'−') + money(Math.abs(profit)) + (tags.length ? '（'+tags.join(' · ')+'）' : '');
  outEl.className = 'p-out ' + (profit>=0 ? 'pos' : 'neg');
}

/* ============ 缺货名单（已发布且没库存；红条已删，入口在消息页） ============ */
var PUBWARN_LOST = [];
function pubStockWarn(){
  var lost = [];
  Object.keys(MARKED).forEach(function(c){
    var m = MARKED[c]; if (!m) return;
    var it = itemOf(c); if (!it) return;
    if (extStockFree(it)) return;
    var kind = m.k || (it.k==='s'?'s':'l');
    if (pubLeftOf(it.mo, kind, nameOf(it), it.code) <= 0) lost.push(it.c);
  });
  PUBWARN_LOST = lost;
  updateBdg();
}

/* ============ 发布 / 取消 ============ */
function pubOn(it, p, k){
  if (!needOnline()) return;                 // 离线只许查（2026-10-13）
  /* 类型跟成本口径走（2026-10-12 用户拍板）：成本下拉选的是「样机清理价」→ 样机；
     选的不是样机（含没得选），一律定义成新机 */
  k = k || (it.k==='s' ? 's' : 'l');
  api('/pub', { method:'POST', body:{ c: it.c, on: true, k: k, p: p } }).then(function(){
    MARKED[it.c] = { t: Date.now(), k: k };
    if (isNum(p)) PRICES[it.c] = p;
    toast('已标记发布' + (isNum(p)?' ¥'+p:''));
    refreshCard(it.c); pubStockWarn(); renderMsgs(); renderPubView();
  }).catch(function(e){ toast('发布失败：'+(e.msg||e)); });
}
function pubOff(it){
  if (!needOnline()) return;                 // 离线只许查（2026-10-13）
  api('/pub', { method:'POST', body:{ c: it.c, on: false } }).then(function(){
    delete MARKED[it.c]; delete PRICES[it.c];
    toast('已取消发布（定价一并清了）');
    refreshCard(it.c); pubStockWarn(); renderMsgs(); renderPubView();
  }).catch(function(e){ toast('取消失败：'+(e.msg||e)); });
}

/* ============ 消息页 ============ */
function lossList(){
  var out = [];
  for (var i=0;i<ALL.length;i++){
    var it = ALL[i], k = it.c;
    if (!MARKED[k] || !isNum(PRICES[k])) continue;
    var opts = costOptions(it);
    var cs = COSTSEL[k], cost = null, lmiss = false;
    if (opts.length){
      var pick = opts[0];
      if (cs && opts.length>1){
        for (var j=0;j<opts.length;j++){
          if (opts[j].l===cs.l && String(opts[j].v)===String(cs.v)){ pick = opts[j]; break; }
        }
      }
      cost = isNum(pick.v) ? pick.v : null;
      if (cs && !cost) lmiss = true;
    }
    if (lmiss){ out.push({ it:it, miss:true }); continue; }
    /* 净挣口径（2026-10-12 用户实锤 BC-285W 案）：跟卡片计算器同式——
       定价 − 1.6%平台费 − (可发全国默认勾选−100) − 成本 < 0 = 亏钱 */
    if (cost!=null){
      var net = PRICES[k] * (1 - 0.016) - (canNationwide(it, kindOfBasis(cs && cs.l)) ? 100 : 0) - cost;
      if (net < 0) out.push({ it:it, price:PRICES[k], cost:cost, net:net });
    }
  }
  return out;
}

function switchTab(v, noPush){
  Array.prototype.forEach.call(document.querySelectorAll('#tabs .t'), function(t){ t.classList.toggle('on', t.dataset.v===v); });
  Array.prototype.forEach.call(document.querySelectorAll('.view'), function(x){ x.classList.toggle('on', x.id==='view-'+v); });
  if (v==='msg') renderMsgs();
  if (v==='me') renderMe();
  if (v==='pub') renderPubView();
  /* 手机返回键：每个子页压一条历史，返回键走 popstate 回退而不是退出 */
  if (!noPush && v!=='home') hPush({ m:1, t:v });
  else if (v==='home' && !noPush && _hDepth>0) hBack();   /* 直接点「首页」tab：把栈里残留的子页历史收掉 */
  window.scrollTo(0,0);
}
/* 历史栈深度：push 记数、pop 减数，程序关闭弹层时补一次 back，保证返回键不空转 */
var _hDepth = 0;
function hPush(st){ _hDepth++; try { history.pushState(st, '', st && st.t ? '#'+st.t : ''); } catch(e){} }
function hBack(){ if (_hDepth>0){ _hDepth--; try { history.back(); } catch(e){} } }
/* 返回键/返回手势：先关弹窗，再关抽屉，再回首页——不直接退出 */
window.addEventListener('popstate', function(){
  if (_hDepth>0) _hDepth--;
  var d = document.getElementById('dlg');
  if (d && d.classList.contains('show')){ d.classList.remove('show'); return; }
  var s = document.getElementById('sheet');
  if (s && s.classList.contains('show')){ s.classList.remove('show'); return; }
  var on = document.querySelector('#tabs .t.on');
  if (on && on.dataset.v!=='home') switchTab('home', true);
});

  var mn = lostn + lossn;
  document.getElementById('meActs').innerHTML =
    '<div class="act" data-go="pub"><span class="ai">📌</span>我的已发布<i class="an">' + pubn + '</i><span class="chev">›</span></div>'
    + '<div class="act" data-go="msg"><span class="ai">💬</span>消息提醒' + (mn ? '<i class="an warn">' + mn + '</i>' : '') + '<span class="chev">›</span></div>'
    + '<div class="act" data-go="refresh"><span class="ai">↻</span>刷新数据<span class="asub">重新拉云端库存 / 发布 / 定价</span><span class="chev">›</span></div>';
}

/* ============ 启动 ============ */
function boot(){
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('tabs').style.display = 'flex';
  wire();
  loadAll();
}
function loadAll(){
  var jobs = [];
  /* 云端补图库（~18MB）不阻塞首屏，到了就把占位补成真图 */
  api('/myimgs').then(function(j){
    /* worker 端每条已是 {b:图, by:谁} 结构（2026-10-12 权限收口）——拆包取 b 当图用 */
    var o = j.imgs || {}, m2 = {};
    Object.keys(o).forEach(function(k){
      var v = o[k];
      var u = (v && typeof v === 'object') ? (v.b || null) : v;
      if (typeof u === 'string' && u.indexOf('data:image/') === 0) m2[k] = u;
    });
    MYIMGS = m2; refreshImgs();
  }).catch(function(){});
  if (MP){
    /* APP 本地快照秒开首屏；后台拉云端最新，有新就静默换数据（热更新，不用发版） */
    api('/mpayload').then(function(j){
      if (!j || !Array.isArray(j.rows) || !j.rows.length) return;
      var a = JSON.stringify([j.meta || {}, j.rows.length]);
      var b = JSON.stringify([MP.meta || {}, MP.rows.length]);
      if (a === b) return;
      MP = { meta: j.meta || {}, rows: j.rows, imgs: j.imgs || {} };
      buildIndex(); doSearch(); renderMsgs(); renderPubView();
      document.getElementById('tsData').textContent = '数据 ' + ((MP.meta||{}).built||'');
    }).catch(function(){});
  }
  else {
    jobs.push(api('/mpayload').then(function(j){
      MP = { meta: j.meta || {}, rows: j.rows || [], imgs: j.imgs || {} };
      buildIndex();
    }).catch(function(e){
      if (!(e && e.msg)) wentOffline();      // fetch 层挂了 = 网络不通
      document.getElementById('neterr').style.display='block';
      document.getElementById('neterr').textContent = '目录还没上云（等 CI 跑一轮）或拉取失败：' + (e.msg||e);
    }));
  }
  jobs.push(api('/stockcloud').then(function(j){
    STOCK = { ts: j.ts||'', stock: j.stock||{}, sbc: j.sbc||{} };
    document.getElementById('tsStock').textContent = '库存 ' + (j.ts||'');
  }).catch(function(e){
    document.getElementById('tsStock').textContent = '库存未连上';
    document.getElementById('neterr').style.display='block';
    document.getElementById('neterr').textContent = '实时库存没拉到：' + (e.msg||e) + '（价格照常显示）';
  }));
  jobs.push(api('/pub').then(function(j){
    MARKED = j.marks || {}; PRICES = j.prices || {};
  }).catch(function(e){
    MARKED={}; PRICES={};
    if (!(e && e.msg)) wentOffline();        // fetch 层挂了 = 网络不通（APP 离线只许查）
  }));
  /* 手机 APP（Capacitor 壳）专属：手动检查更新（2026-10-13 用户要求加按键）。
     APK 壳里 window.Capacitor 一定存在，浏览器里没有 → 按键只对 APP 显示 */
  if (typeof window.Capacitor !== 'undefined'){
    var _up = document.getElementById('updapp');
    if (_up){
      _up.hidden = false;
      _up.onclick = function(){
        _up.textContent = '检查中…';
        api('/appcheck?plat=apk').then(function(j){
          _up.textContent = '⟳ 检查更新';
          if (!j || !j.ok || !j.ver){ toast('没查到新版本（等发版后再试）'); return; }
          dlg('最新版本 v' + j.ver + '，现在去下载安装吗？\n（可覆盖升级，不用卸载旧的）', false, function(ok){
            if (ok){
            /* APP：WebView 挂了 DownloadListener（CI 注入）→ 走应用内下载+自动拉起安装；
               浏览器：没有监听器，顶层跳转由浏览器自己接管下载 */
            var a = document.createElement('a');
            a.href = API + '/appdl?plat=apk';
            document.body.appendChild(a); a.click(); a.remove();
            toast('已开始下载安装包，下载完会自动弹出安装');
          }
          });
        }).catch(function(e){ _up.textContent = '⟳ 检查更新'; toast('检查失败：' + (e.msg || e)); });
      };
    }
  }
  if (AUTH.role==='admin'){
    jobs.push(api('/yyalert').then(function(j){
      var ts = +j.ts || 0, msg = String(j.msg||'');
      if (msg && ts > Date.now() - 1800*1000 && String(j.by||'') !== AUTH.u){
        document.getElementById('msgAlert').style.display = 'block';
        document.getElementById('msgAlertList').innerHTML = '<div class="mrow bad"><div><div class="mo">' + esc(msg) + '</div><div class="sub">' + esc(j.by||'') + '</div></div></div>';
      }
    }).catch(function(){}));
  }
  Promise.all(jobs.map(function(p){ return p.catch(function(){}); })).then(function(){
    if (MP && !ALL.length) buildIndex();
    document.getElementById('tsData').textContent = MP ? ('数据 ' + ((MP.meta||{}).built||'')) : '';
    pubStockWarn();
    doSearch();
    renderMsgs();
    renderPubView();
  });
}
function tryToken(){
  var t = localStorage.getItem('m_token');
  if (!t) return Promise.reject();
  AUTH = { token: t };
  return api('/perm').then(function(j){
    AUTH.u = j.u; AUTH.role = j.role; AUTH.perm = j.perm || {};
    try { localStorage.setItem('m_auth', JSON.stringify({ u: j.u, role: j.role, perm: j.perm || {} })); } catch(e){}
  }).catch(function(e){
    /* APP 断网但本地有身份缓存 → 离线模式（只许查）；网页版没缓存就必须重新登录 */
    var cached = null;
    try { cached = JSON.parse(localStorage.getItem('m_auth')||'null'); } catch(err){}
    if (typeof window.Capacitor !== 'undefined' && cached && !(e && e.auth)){
      AUTH = { token: t, u: cached.u, role: cached.role, perm: cached.perm || {} };
      setOnline(false);
      return;
    }
    AUTH = null; localStorage.removeItem('m_token');
    throw e;
  });
}
document.getElementById('lgo').onclick = function(){
  var u = document.getElementById('lu').value.trim(), p = document.getElementById('lp').value;
  if (!u || !p){ document.getElementById('lerr').textContent = '账号密码都要填'; return; }
  document.getElementById('lerr').textContent = '';
  api('/login', { method:'POST', body:{ u:u, p:p } }).then(function(j){
    localStorage.setItem('m_token', j.token);
    AUTH = { token: j.token, u: j.u, role: j.role, perm: j.perm || {} };
    try { localStorage.setItem('m_auth', JSON.stringify({ u: j.u, role: j.role, perm: j.perm || {} })); } catch(e){}
    setOnline(true);
    boot();
  }).catch(function(e){ document.getElementById('lerr').textContent = e.msg || '登录失败'; });
};
document.getElementById('lp').addEventListener('keydown', function(e){ if (e.key==='Enter') document.getElementById('lgo').click(); });

tryToken().then(boot).catch(function(){
  document.getElementById('login').style.display = 'flex';
});
</script>
