name: kdocs-cloud-data

# 云端自行更新金山表格（2026-10-09，管理号电脑不用开机）：
# Playwright 真浏览器打开两个金山分享页（公布版 + 价格表，公开分享匿名可读）→
# 同源 XHR 拿直链下载 xlsx（与 app/main.py 同一招）→ 内容哈希没变就跳过 →
# worker /xlsxcloud 上传（所有机器的软件 60 秒内自动跟随重建）。

on:
  workflow_dispatch:
    inputs:
      note:
        description: "备注（可选）"
        required: false
  schedule:
    - cron: "40 0-15 * * *"   # 2026-10-15 用户拍板照旧：UTC 0-15 点每小时（:40）= 北京时间 8:40–23:40 每小时一次；0点-8点不跑

permissions:
  contents: read

jobs:
  pull-kdocs:
    runs-on: [self-hosted, windows]   # 2026-10-17 额度墙：本机自建 runner（不吃 Actions 分钟）
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PY: C:\actions-runner\_work\_tool\Python\3.11.9\x64\python.exe   # 本机预置 Python
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright + Chromium + openpyxl
        run: |
          & "$env:PY" -m pip install playwright==1.48.0 openpyxl
          & "$env:PY" -m playwright install chromium

      - name: Pull KDocs tables and upload
        env:
          CLOUD_TOKEN: ${{ secrets.CLOUD_TOKEN }}
          KX_SECRET: ${{ secrets.KX_SECRET }}
        run: |
          $ok = $false
          foreach ($i in 1..3) {
            & "$env:PY" .github/scripts/kdocs_cloud_pull.py
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "== 第 $i 次失败，60 秒后重试 =="
            Start-Sleep -Seconds 60
          }
          if (-not $ok) { exit 1 }
