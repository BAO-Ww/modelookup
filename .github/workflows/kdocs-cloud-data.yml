name: kdocs-cloud-data

# 云端自行更新金山表格（2026-10-09，管理号电脑不用开机）：
# Playwright 真浏览器打开两个金山分享页（公布版 + 价格表，公开分享匿名可读）→
# 同源 XHR 拿直链下载 xlsx（与 app/main.py 同一招）→ 内容哈希没变就跳过 →
# worker /xlsxcloud 上传（所有机器的软件 60 秒内自动跟随重建）。

on:
  workflow_dispatch:
    inputs:
      note:
        description: "备注（可选）"
        required: false
      mode:
        description: "local=本机runner（默认）/ cloud=GitHub云runner兜底"
        required: false
        default: "local"
  # schedule 已撤（2026-10-30 方案B）：GitHub 自带定时高峰丢班（整点拥挤时整班丢弃不补），
  # 派班搬到 CF Worker Cron（modelookup-auth 的 scheduled，四条 cron 与本表同源）。
  # 转回 GitHub 定时：① python _cf_cron_set.py 把 CRONS 换成 [] 清空云端 cron
  #                   ② 恢复下面这行 schedule：
  # - cron: "40 0-15 * * *"   # UTC 0-15 点每小时（:40）= 北京时间 8:40–23:40 每小时；0点-8点不跑

permissions:
  contents: read

jobs:
  pull-kdocs:
    if: inputs.mode != 'cloud'
    runs-on: [self-hosted, windows]   # 2026-10-17 额度墙：本机自建 runner（不吃 Actions 分钟）
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PY: C:\actions-runner\_work\_tool\Python\3.11.9\x64\python.exe   # 本机预置 Python
      SCRIPTS: C:\actions-runner\_scriptcache\modelookup\.github\scripts   # 脚本本地缓存（不走 checkout）
    timeout-minutes: 25
    steps:
      # 2026-11-14 用户令「怎么稳定怎么改」：本机到 codeload.github.com 频繁 TLS 断连，
      # actions/checkout@v4 一挂整班白跑（#940 实锤，后面步骤全 skipped）。
      # 改为只取本班真正要用的文件，按仓库相对结构落本地缓存（脚本按 __file__ 往上
      # 三层找 app/ 与 mobile/，结构对齐才能让手机端 payload 与手机版页照旧上云）：
      # 三路来源 + 重试，成功即刷新缓存；网络全挂时用缓存副本照常出数据。
      - name: Prepare files (cache + 3 sources + retry)
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\actions-runner\_scriptcache\modelookup'
          $files = @(
            '.github/scripts/kdocs_cloud_pull.py',
            'app/paths.py',
            'app/config.py',
            'mobile/app/www/index.html'
          )
          $missing = @()
          foreach ($rel in $files) {
            $target = Join-Path $root $rel
            New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
            $got = $false

            # ① api.github.com（本机实测最稳的一路）
            for ($i = 1; $i -le 3 -and -not $got; $i++) {
              try {
                $hdr = @{ 'User-Agent' = 'ml-runner' }
                if ($env:GH_TOKEN) { $hdr['Authorization'] = "Bearer $($env:GH_TOKEN)" }
                $u = "https://api.github.com/repos/BAO-Ww/modelookup/contents/$rel" + "?ref=main"
                $j = Invoke-RestMethod -Uri $u -Headers $hdr -TimeoutSec 30
                $b = [Convert]::FromBase64String(($j.content -replace "`n|`r", ""))
                [IO.File]::WriteAllBytes("$target.tmp", $b)
                Move-Item -Force "$target.tmp" $target
                Write-Host "OK  $rel ($($b.Length) B)"
                $got = $true
              } catch {
                Write-Host "api 第 $i 次失败 $rel：$($_.Exception.Message)"
                Start-Sleep -Seconds (3 * $i)
              }
            }

            # ② raw.githubusercontent.com
            for ($i = 1; $i -le 2 -and -not $got; $i++) {
              try {
                Invoke-WebRequest -UseBasicParsing -TimeoutSec 30 `
                  -Uri "https://raw.githubusercontent.com/BAO-Ww/modelookup/main/$rel" `
                  -OutFile "$target.tmp"
                Move-Item -Force "$target.tmp" $target
                Write-Host "OK(raw) $rel"
                $got = $true
              } catch {
                Write-Host "raw 第 $i 次失败 $rel：$($_.Exception.Message)"
                Start-Sleep -Seconds (3 * $i)
              }
            }

            # ③ 本地缓存副本（可能是上一版，但网络全挂时照样有数据）
            if (-not $got) {
              if (Test-Path $target) { Write-Host "网络全失败，用缓存副本 $rel" }
              else { $missing += $rel }
            }
          }
          if ($missing.Count) { throw "拿不到文件：$($missing -join ',')" }
          Write-Host "cache ready -> $root"

      - name: Install Playwright + Chromium + openpyxl
        run: |
          $ok = $false
          foreach ($i in 1..3) {
            & "$env:PY" -m pip install --disable-pip-version-check -q playwright==1.48.0 openpyxl
            & "$env:PY" -m playwright install chromium
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "== 依赖安装第 $i 次失败，30 秒后重试 =="
            Start-Sleep -Seconds 30
          }
          if (-not $ok) { exit 1 }

      - name: Pull KDocs tables and upload
        env:
          CLOUD_TOKEN: ${{ secrets.CLOUD_TOKEN }}
          KX_SECRET: ${{ secrets.KX_SECRET }}
        run: |
          $ok = $false
          foreach ($i in 1..3) {
            & "$env:PY" "$env:SCRIPTS\kdocs_cloud_pull.py"
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "== 第 $i 次失败，60 秒后重试 =="
            Start-Sleep -Seconds 60
          }
          if (-not $ok) { exit 1 }

      # 自建 runner 每跑一班写一对 _diag 诊断日志，只进不出（2026-10-30 实测 280MB/661 个）。
      # 每次抓取清一次：删 3 天前的旧日志（留最近 3 天够排障）+ 清空 runner 临时目录。
      # 数据文件本身不留（脚本临时目录自清）；_work\_tool 里的预置 Python 是 yml 写死的
      # 工具链、_scriptcache 是脚本缓存，这两处绝不能动。失败也照清（always）。
      - name: Cleanup runner residue
        if: always()
        shell: powershell
        run: |
          Get-ChildItem "C:\actions-runner\_diag" -File -ErrorAction SilentlyContinue |
            Where-Object { $_.LastWriteTime -lt (Get-Date).AddDays(-3) } |
            ForEach-Object { Remove-Item -LiteralPath $_.FullName -Force -ErrorAction SilentlyContinue }
          Get-ChildItem "C:\actions-runner\_work\_temp" -ErrorAction SilentlyContinue |
            ForEach-Object { Remove-Item -LiteralPath $_.FullName -Recurse -Force -ErrorAction SilentlyContinue }

  # ---- 云端兜底（2026-10-30 用户令「本机抓取不了了就走 GitHub 抓取，优先走本机」）----
  # CF Worker Cron 兜底派班时发现本机 runner 离线 → dispatch mode=cloud 落到这里：
  # GitHub 云 runner 跑同一套抓取脚本（凭据走 repo secrets），数据照常上云。
  pull-kdocs-cloud:
    if: inputs.mode == 'cloud'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright + Chromium + openpyxl
        run: |
          python -m pip install playwright==1.48.0 openpyxl
          python -m playwright install --with-deps chromium
      - name: Pull KDocs tables and upload
        env:
          CLOUD_TOKEN: ${{ secrets.CLOUD_TOKEN }}
          KX_SECRET: ${{ secrets.KX_SECRET }}
        run: |
          for i in 1 2 3; do
            python .github/scripts/kdocs_cloud_pull.py && exit 0
            echo "== 第 $i 次失败，60 秒后重试 =="
            sleep 60
          done
          exit 1
