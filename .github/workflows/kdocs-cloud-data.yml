name: kdocs-cloud-data

# 云端自行更新金山表格（2026-10-09，管理号电脑不用开机）：
# Playwright 真浏览器打开两个金山分享页（公布版 + 价格表，公开分享匿名可读）→
# 同源 XHR 拿直链下载 xlsx（与 app/main.py 同一招）→ 内容哈希没变就跳过 →
# worker /xlsxcloud 上传（所有机器的软件 60 秒内自动跟随重建）。

on:
  workflow_dispatch:
    inputs:
      note:
        description: "备注（可选）"
        required: false
  schedule:   # 2026-10-15 用户定稿时刻表：与用友同刻（北京 10:30/13:00/15:00/16:00-23:00）；0:00-10:00 不跑
    - cron: "30 2 * * *"     # 北京 10:30
    - cron: "0 5 * * *"      # 北京 13:00
    - cron: "0 7 * * *"      # 北京 15:00
    - cron: "0 8 * * *"      # 北京 16:00
    - cron: "30 8 * * *"     # 北京 16:30
    - cron: "0 9 * * *"      # 北京 17:00
    - cron: "0 10 * * *"     # 北京 18:00
    - cron: "30 10 * * *"    # 北京 18:30
    - cron: "0 11 * * *"     # 北京 19:00
    - cron: "30 11 * * *"    # 北京 19:30
    - cron: "0 12 * * *"     # 北京 20:00
    - cron: "30 12 * * *"    # 北京 20:30
    - cron: "0 13 * * *"     # 北京 21:00
    - cron: "30 13 * * *"    # 北京 21:30
    - cron: "0 14 * * *"     # 北京 22:00
    - cron: "30 14 * * *"    # 北京 22:30
    - cron: "0 15 * * *"     # 北京 23:00

permissions:
  contents: read

jobs:
  pull-kdocs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright + Chromium + openpyxl
        run: |
          pip install playwright==1.48.0 openpyxl
          python -m playwright install --with-deps chromium

      - name: Pull KDocs tables and upload
        env:
          CLOUD_TOKEN: ${{ secrets.CLOUD_TOKEN }}
          KX_SECRET: ${{ secrets.KX_SECRET }}
        run: python .github/scripts/kdocs_cloud_pull.py
