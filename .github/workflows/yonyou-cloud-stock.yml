name: yonyou-cloud-stock

# 云端自行更新用友库存（管理号电脑不用开机）：
# Playwright 真浏览器登录 CAS（纯 HTTP 被指纹 JS + 强制改密 flow 拦，实测定性）→
# 拉 report/list 全量 → 聚合 → worker /stockcloud 上传（子账号自动跟进）。
# 手动触发跑通后可加 schedule。

on:
  workflow_dispatch:
    inputs:
      note:
        description: "备注（可选）"
        required: false
  schedule:   # 2026-10-15 用户定稿时刻表：北京 10:30/13:00/15:00/16:00-23:00（半小时轮）；0:00-10:00 不跑
    - cron: "30 2 * * *"     # 北京 10:30
    - cron: "0 5 * * *"      # 北京 13:00
    - cron: "0 7 * * *"      # 北京 15:00
    - cron: "0 8 * * *"      # 北京 16:00
    - cron: "30 8 * * *"     # 北京 16:30
    - cron: "0 9 * * *"      # 北京 17:00
    - cron: "0 10 * * *"     # 北京 18:00
    - cron: "30 10 * * *"    # 北京 18:30
    - cron: "0 11 * * *"     # 北京 19:00
    - cron: "30 11 * * *"    # 北京 19:30
    - cron: "0 12 * * *"     # 北京 20:00
    - cron: "30 12 * * *"    # 北京 20:30
    - cron: "0 13 * * *"     # 北京 21:00
    - cron: "30 13 * * *"    # 北京 21:30
    - cron: "0 14 * * *"     # 北京 22:00
    - cron: "30 14 * * *"    # 北京 22:30
    - cron: "0 15 * * *"     # 北京 23:00

permissions:
  contents: read

jobs:
  pull-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright + Chromium
        run: |
          pip install playwright==1.48.0 openpyxl==3.1.5
          python -m playwright install --with-deps chromium

      - name: Pull Yonyou stock and upload
        env:
          YY_USER: ${{ secrets.YY_USER }}
          YY_PASS: ${{ secrets.YY_PASS }}
          CLOUD_TOKEN: ${{ secrets.CLOUD_TOKEN }}
        run: python .github/scripts/yy_cloud_pull.py
