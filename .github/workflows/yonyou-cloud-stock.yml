name: yonyou-cloud-stock

# 云端自行更新用友库存（管理号电脑不用开机）：
# Playwright 真浏览器登录 CAS（纯 HTTP 被指纹 JS + 强制改密 flow 拦，实测定性）→
# 拉 report/list 全量 → 聚合 → worker /stockcloud 上传（子账号自动跟进）。
# 手动触发跑通后可加 schedule。

on:
  workflow_dispatch:
    inputs:
      note:
        description: "备注（可选）"
        required: false
  schedule:   # 2026-10-15 用户定稿时刻表：北京 10:30/13:00/15:00/16:00-23:00（半小时轮）；0:00-10:00 不跑
    - cron: "30 2 * * *"     # 北京 10:30
    - cron: "0 5 * * *"      # 北京 13:00
    - cron: "0 7 * * *"      # 北京 15:00
    - cron: "0 8 * * *"      # 北京 16:00
    - cron: "30 8 * * *"     # 北京 16:30
    - cron: "0 9 * * *"      # 北京 17:00
    - cron: "0 10 * * *"     # 北京 18:00
    - cron: "30 10 * * *"    # 北京 18:30
    - cron: "0 11 * * *"     # 北京 19:00
    - cron: "30 11 * * *"    # 北京 19:30
    - cron: "0 12 * * *"     # 北京 20:00
    - cron: "30 12 * * *"    # 北京 20:30
    - cron: "0 13 * * *"     # 北京 21:00
    - cron: "30 13 * * *"    # 北京 21:30
    - cron: "0 14 * * *"     # 北京 22:00
    - cron: "30 14 * * *"    # 北京 22:30
    - cron: "0 15 * * *"     # 北京 23:00

permissions:
  contents: read

jobs:
  pull-stock:
    runs-on: [self-hosted, windows]   # 2026-10-17 额度墙：本机自建 runner（不吃 Actions 分钟）
    env:
      PY: C:\actions-runner\_work\_tool\Python\3.11.9\x64\python.exe   # 本机预置 Python（setup-python 云端下载在本机网络下不稳）
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright + Chromium
        run: |
          "$env:PY" -m pip install playwright==1.48.0 openpyxl==3.1.5
          "$env:PY" -m playwright install chromium

      - name: Pull Yonyou stock and upload
        env:
          YY_USER: ${{ secrets.YY_USER }}
          YY_PASS: ${{ secrets.YY_PASS }}
          CLOUD_TOKEN: ${{ secrets.CLOUD_TOKEN }}
        run: |
          "$env:PY" .github/scripts/yy_cloud_pull.py
