name: yonyou-cloud-stock

# 云端自行更新用友库存（管理号电脑不用开机）：
# Playwright 真浏览器登录 CAS（纯 HTTP 被指纹 JS + 强制改密 flow 拦，实测定性）→
# 拉 report/list 全量 → 聚合 → worker /stockcloud 上传（子账号自动跟进）。
# 手动触发跑通后可加 schedule。

on:
  workflow_dispatch:
    inputs:
      note:
        description: "备注（可选）"
        required: false
      mode:
        description: "local=本机runner（默认）/ cloud=GitHub云runner兜底"
        required: false
        default: "local"
  # schedule 已撤（2026-10-30 方案B）：GitHub 自带定时高峰丢班，派班搬到 CF Worker Cron
  # （modelookup-auth 的 scheduled）。注意 CF 表比本表多一班北京 23:30（与本机触发器同表）。
  # 转回 GitHub 定时：① python _cf_cron_set.py 把 CRONS 换成 [] 清空云端 cron
  #                   ② 恢复下面这段 schedule：
  # - cron: "30 2 * * *"     # 北京 10:30
  # - cron: "0 5 * * *"      # 北京 13:00
  # - cron: "0 7 * * *"      # 北京 15:00
  # - cron: "0 8 * * *"      # 北京 16:00
  # - cron: "30 8 * * *"     # 北京 16:30
  # - cron: "0 9 * * *"      # 北京 17:00
  # - cron: "0 10 * * *"     # 北京 18:00
  # - cron: "30 10 * * *"    # 北京 18:30
  # - cron: "0 11 * * *"     # 北京 19:00
  # - cron: "30 11 * * *"    # 北京 19:30
  # - cron: "0 12 * * *"     # 北京 20:00
  # - cron: "30 12 * * *"    # 北京 20:30
  # - cron: "0 13 * * *"     # 北京 21:00
  # - cron: "30 13 * * *"    # 北京 21:30
  # - cron: "0 14 * * *"     # 北京 22:00
  # - cron: "30 14 * * *"    # 北京 22:30
  # - cron: "0 15 * * *"     # 北京 23:00

permissions:
  contents: read

jobs:
  pull-stock:
    if: inputs.mode != 'cloud'
    runs-on: [self-hosted, windows]   # 2026-10-17 额度墙：本机自建 runner（不吃 Actions 分钟）
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PY: C:\actions-runner\_work\_tool\Python\3.11.9\x64\python.exe   # 本机预置 Python（setup-python 云端下载在本机网络下不稳）
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright + Chromium
        run: |
          & "$env:PY" -m pip install playwright==1.48.0 openpyxl==3.1.5
          & "$env:PY" -m playwright install chromium

      - name: Pull Yonyou stock and upload
        env:
          YY_USER: ${{ secrets.YY_USER }}
          YY_PASS: ${{ secrets.YY_PASS }}
          CLOUD_TOKEN: ${{ secrets.CLOUD_TOKEN }}
        run: |
          $ok = $false
          foreach ($i in 1..3) {
            & "$env:PY" .github/scripts/yy_cloud_pull.py
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "== 第 $i 次失败，60 秒后重试 =="
            Start-Sleep -Seconds 60
          }
          if (-not $ok) { exit 1 }

      # 自建 runner 每跑一班写一对 _diag 诊断日志，只进不出（2026-10-30 实测 280MB/661 个）。
      # 每次抓取清一次：删 3 天前的旧日志（留最近 3 天够排障）+ 清空 runner 临时目录。
      # _work\_tool 里的预置 Python 是 yml 写死的工具链，绝不能动。失败也照清（always）。
      - name: Cleanup runner residue
        if: always()
        shell: powershell
        run: |
          Get-ChildItem "C:\actions-runner\_diag" -File -ErrorAction SilentlyContinue |
            Where-Object { $_.LastWriteTime -lt (Get-Date).AddDays(-3) } |
            ForEach-Object { Remove-Item -LiteralPath $_.FullName -Force -ErrorAction SilentlyContinue }
          Get-ChildItem "C:\actions-runner\_work\_temp" -ErrorAction SilentlyContinue |
            ForEach-Object { Remove-Item -LiteralPath $_.FullName -Recurse -Force -ErrorAction SilentlyContinue }

  # ---- 云端兜底（2026-10-30 用户令「本机抓取不了了就走 GitHub 抓取，优先走本机」）----
  # CF Worker Cron 兜底派班时发现本机 runner 离线 → dispatch mode=cloud 落到这里：
  # GitHub 云 runner 跑同一套抓取脚本（凭据走 repo secrets），数据照常上云。
  pull-stock-cloud:
    if: inputs.mode == 'cloud'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright + Chromium + openpyxl
        run: |
          python -m pip install playwright==1.48.0 openpyxl==3.1.5
          python -m playwright install --with-deps chromium
      - name: Pull Yonyou stock and upload
        env:
          YY_USER: ${{ secrets.YY_USER }}
          YY_PASS: ${{ secrets.YY_PASS }}
          CLOUD_TOKEN: ${{ secrets.CLOUD_TOKEN }}
        run: |
          for i in 1 2 3; do
            python .github/scripts/yy_cloud_pull.py && exit 0
            echo "== 第 $i 次失败，60 秒后重试 =="
            sleep 60
          done
          exit 1
