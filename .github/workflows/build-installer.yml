name: 构建 Windows 安装包

# 三种触发：
#   1. 手动点「Run workflow」，填版本号（例如 v2.1）→ 构建 + 发 Release
#   2. 推 v* 标签 → 构建 + 发 Release
#   3. 推到 main → 只构建并上传 Artifact（不发 Release），用来验证能编过
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 v2.1）。留空则用分支构建，不发 Release'
        required: false
        default: ''
      prerelease:
        description: '标记为预发布（Pre-release）'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    # 版本号只在 Windows job 算一次，经 outputs 传给 mac（2026-10-12 实锤：各 job 独立查 tags 会串号）
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      num: ${{ steps.ver.outputs.num }}
      release: ${{ steps.ver.outputs.release }}

    env:
      # ⚠ runner 控制台默认是 cp1252，Python 往 stdout 打中文会直接 UnicodeEncodeError
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'

    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 装 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          # 必须指到实际文件，否则 setup-python 默认只找 requirements.txt / pyproject.toml
          cache-dependency-path: requirements-build.txt

      - name: 算版本号
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($v)) {
            if ("${{ github.ref }}" -like 'refs/tags/*') {
              $v = "${{ github.ref_name }}"
            } elseif ("${{ github.event_name }}" -eq 'push' -and "${{ github.ref }}" -eq 'refs/heads/main') {
              # 2026-10-12 用户定稿：push 到 main = 自动发版，版本号取最新 v* tag patch+1
              $tags = gh api "repos/${{ github.repository }}/tags?per_page=30" | ConvertFrom-Json
              $latest = $null
              foreach ($t in $tags) { if ($t.name -match '^v[\d.]+$') { $latest = $t.name; break } }
              if (-not $latest) { throw "仓库还没有 v* tag，首次请手动 --dispatch 指定版本" }
              $parts = $latest.Substring(1).Split('.')
              $parts[-1] = [string]([int]$parts[-1] + 1)
              $v = "v" + ($parts -join '.')
              Write-Host "push 自动发版：$latest → $v"
            } else {
              $v = ""          # 其他分支 → 不发 Release
            }
          }
          if (-not [string]::IsNullOrWhiteSpace($v) -and $v -notmatch '^v') { $v = "v$v" }

          if ([string]::IsNullOrWhiteSpace($v)) {
            $num  = '0.0'
            $num4 = '0.0.0.0'
            $rel  = 'false'
          } else {
            $num   = $v.TrimStart('v')
            $parts = $num.Split('.')
            while ($parts.Count -lt 4) { $parts += '0' }
            $num4  = ($parts[0..3] -join '.')
            $rel   = 'true'
          }
          "tag=$v"     >> $env:GITHUB_OUTPUT
          "num=$num"   >> $env:GITHUB_OUTPUT
          "num4=$num4" >> $env:GITHUB_OUTPUT
          "release=$rel" >> $env:GITHUB_OUTPUT
          Write-Host "版本：tag=$v num=$num num4=$num4 release=$rel"

      - name: 装构建依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          # 这行刻意用纯 ASCII：runner 控制台是 cp1252，打中文会 UnicodeEncodeError
          python -c "import openpyxl, webview, clr, PyInstaller; print('deps ok:', openpyxl.__version__, PyInstaller.__version__)"

      - name: 注入版本号（_buildver.py：exe「关于」与 Release tag 同源）
        # 只在发版构建注入（release=true）；分支验证构建不注入，exe 用 config.py 兜底号
        if: steps.ver.outputs.release == 'true'
        working-directory: app
        shell: pwsh
        run: |
          "BUILD_VERSION = '${{ steps.ver.outputs.num }}'" | Out-File -FilePath _buildver.py -Encoding ascii
          Get-Content _buildver.py

      - name: 打包 exe（PyInstaller）
        working-directory: app
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build ModelLookup.spec
          Get-ChildItem dist

      - name: 成品自检（--check）
        # ⚠ 交给 Python 跑：exe 是 GUI 子系统，PowerShell 用 & 调用**不会等它结束**，
        #   会立刻返回然后读不到日志。subprocess 才可靠。
        shell: pwsh
        run: python .github/scripts/check_exe.py app/dist/ModelLookup.exe

      - name: 装 Inno Setup 6.7.3
        id: inno
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\innosetup.exe"
          Start-Process -FilePath "$env:TEMP\innosetup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait
          # 装到哪个目录取决于是不是管理员装的，三个常见位置都探一遍
          $cands = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe',
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $cands | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup 没装上：找不到 ISCC.exe' }
          Write-Host "ISCC = $iscc"
          "iscc=$iscc" >> $env:GITHUB_OUTPUT

      - name: 编译安装包
        working-directory: installer
        shell: pwsh
        run: |
          & "${{ steps.inno.outputs.iscc }}" `
            "/DMyAppVer=${{ steps.ver.outputs.num }}" `
            "/DMyAppVerNum=${{ steps.ver.outputs.num4 }}" modelookup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC 编译失败：$LASTEXITCODE" }
          Get-ChildItem ..\dist_installer

      - name: 整理产物（中文名安装包）
        # ⚠ 交给 Python 做：PowerShell 里写中文文件名在 runner 上会被编码搞坏
        shell: pwsh
        run: python .github/scripts/stage.py "${{ steps.ver.outputs.num }}"

      - name: 上传 Artifact（供检查 / 手动下载）
        uses: actions/upload-artifact@v4
        # 2026-10-09：Artifact 存储配额满会把整个任务拖死，连 Release 都发不出去 ——
        # 产物只是备用下载渠道（Release 资产才是正主），失败就跳过
        continue-on-error: true
        with:
          name: 型号查询-${{ steps.ver.outputs.tag || 'dev' }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

      - name: 发布 Release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: 型号查询 ${{ steps.ver.outputs.tag }}
          body_path: .github/release-notes.md
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          draft: false
          fail_on_unmatched_files: true
          # ⚠ 附件的文件名必须是纯 ASCII：GitHub Releases 会把中文名「消毒」掉
          #   （实测 型号查询-安装包-v2.1.exe → -.-v2.1.exe），所以这里用英文名。
          files: |
            out/ModelLookup-Setup-${{ steps.ver.outputs.num }}.exe

      - name: 汇总
        shell: pwsh
        run: |
          Write-Host "版本：${{ steps.ver.outputs.tag }}"
          Get-ChildItem out | ForEach-Object {
            Write-Host ("  {0,-34} {1,10:N2} MB" -f $_.Name, ($_.Length / 1MB))
          }

  # ---------------------------------------------------------------- Mac 端（2026-10-11）
  # Apple Silicon 专用（arm64）· pywebview + WKWebView · 无签名（Gatekeeper 首次安装需放行）
  # 依赖 Windows job 成功（tag 构建时由它先建 Release，本 job 追加 mac 资产）
  build-mac:
    needs: build
    if: ${{ always() && !cancelled() && needs.build.result == 'success' }}
    runs-on: macos-14

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'

    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 装 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: 版本号（沿用 Windows job outputs，防各查 tags 串号）
        id: ver
        shell: bash
        run: |
          v="${{ needs.build.outputs.tag }}"
          if [ -n "$v" ] && [[ "$v" != v* ]]; then v="v$v"; fi
          if [ -z "$v" ]; then num="0.0"; rel="false"; else num="${v#v}"; rel="true"; fi
          echo "tag=$v"     >> "$GITHUB_OUTPUT"
          echo "num=$num"   >> "$GITHUB_OUTPUT"
          echo "release=$rel" >> "$GITHUB_OUTPUT"
          echo "ver: tag=$v num=$num release=$rel"

      - name: 装 Mac 构建依赖
        # 刻意全 ASCII 输出；pyobjc 由 pywebview 在 macOS 上自动带入，这里显式装一份保险
        run: |
          python -m pip install --upgrade pip
          pip install "pywebview==6.2.1" "openpyxl==3.1.5" "pyinstaller==6.22.2" pyobjc
          python -c "import openpyxl, webview, PyInstaller; print('deps ok:', openpyxl.__version__, PyInstaller.__version__)"

      - name: 生成 icon.icns
        run: |
          mkdir -p app/assets/icns_build/icon.iconset
          cd app/assets
          sips -z 16 16     icon.png --out icns_build/icon.iconset/icon_16x16.png
          sips -z 32 32     icon.png --out icns_build/icon.iconset/icon_16x16@2x.png
          sips -z 32 32     icon.png --out icns_build/icon.iconset/icon_32x32.png
          sips -z 64 64     icon.png --out icns_build/icon.iconset/icon_32x32@2x.png
          sips -z 128 128   icon.png --out icns_build/icon.iconset/icon_128x128.png
          sips -z 256 256   icon.png --out icns_build/icon.iconset/icon_128x128@2x.png
          sips -z 256 256   icon.png --out icns_build/icon.iconset/icon_256x256.png
          sips -z 512 512   icon.png --out icns_build/icon.iconset/icon_256x256@2x.png
          sips -z 512 512   icon.png --out icns_build/icon.iconset/icon_512x512.png
          sips -z 1024 1024 icon.png --out icns_build/icon.iconset/icon_512x512@2x.png
          iconutil -c icns icns_build/icon.iconset -o icon.icns
          ls -la icon.icns

      - name: 注入版本号（_buildver.py：与 Release tag 同源，跟 Windows exe 同一个号）
        if: steps.ver.outputs.release == 'true'
        working-directory: app
        run: echo "BUILD_VERSION = '${{ steps.ver.outputs.num }}'" > _buildver.py

      - name: 打包 .app（PyInstaller）
        working-directory: app
        run: |
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build ModelLookup-mac.spec
          ls -la dist

      - name: 写入真实版本号
        env:
          NUM: ${{ steps.ver.outputs.num }}
        run: |
          PLIST=app/dist/ModelLookup.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $NUM" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NUM" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $NUM" "$PLIST"
          echo "版本已写入 $PLIST"

      - name: 成品自检（--check）
        run: python .github/scripts/check_mac.py app/dist/ModelLookup.app

      - name: Ad-hoc 签名（修 Gatekeeper「已损坏」：无签名+隔离属性=损坏；ad-hoc 后降级为可放行的未公证应用）
        run: |
          codesign --force --deep --sign - app/dist/ModelLookup.app
          codesign --verify --deep app/dist/ModelLookup.app && echo CODESIGN_OK

      - name: 整理产物（DMG + 更新 zip）
        run: python .github/scripts/stage_mac.py "${{ steps.ver.outputs.num }}"

      - name: 上传 Artifact（供检查 / 手动下载）
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ModelLookup-mac-${{ steps.ver.outputs.tag || 'dev' }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

      - name: 发布 Release（追加 Mac 资产到同一 Release）
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          fail_on_unmatched_files: true
          files: |
            out/ModelLookup-mac-${{ steps.ver.outputs.num }}.dmg
            out/ModelLookup-mac-${{ steps.ver.outputs.num }}.zip

  # ---------------------------------------------------------------- 安卓端（2026-10-12 重做）
