name: 构建安卓 APK

# 触发：
#   1. 手动 Run workflow，填版本号（例如 m1.0）→ 构建 + 发 Release（追加到同名 Release）
#   2. 推 m* 标签 → 构建 + 发 Release
#   3. 推 main 不触发（安卓发版跟着手机版节奏走，手动/标签驱动）
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 m1.0）。留空则只出 Artifact 不发 Release'
        required: false
        default: ''
  push:
    tags:
      - 'm*'

permissions:
  contents: write

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest

    env:
      ML_KS_B64: ${{ secrets.MOBILE_KEYSTORE_B64 }}
      ML_KS_PASS: ${{ secrets.MOBILE_KEYSTORE_PASS }}

    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 算版本号
        id: ver
        run: |
          v="${{ github.event.inputs.version }}"
          if [ -z "$(echo "$v" | tr -d '[:space:]')" ]; then
            case "${{ github.ref }}" in
              refs/tags/*) v="${GITHUB_REF_NAME}" ;;
              *) v="" ;;
            esac
          fi
          if [ -n "$v" ] && [[ "$v" != m* ]]; then v="m$v"; fi
          if [ -z "$v" ]; then
            num="0.0"; rel="false"
          else
            num="${v#m}"; rel="true"
          fi
          echo "tag=$v"     >> "$GITHUB_OUTPUT"
          echo "num=$num"   >> "$GITHUB_OUTPUT"
          echo "release=$rel" >> "$GITHUB_OUTPUT"
          echo "ver: tag=$v num=$num release=$rel"

      - name: 构建页面（模板 + 最新数据快照 + 手机增强层）
        # 纯标准库脚本：模板只读，DATA 内联，零 fetch
        run: python3 mobile/_build_mobile.py --payload mobile/data/payload.json --out mobile/app/www/index.html

      - name: 生成 Capacitor 安卓工程
        working-directory: mobile/app
        run: |
          npm install --no-fund --no-audit
          npx cap add android
          npx cap sync android

      - name: 注入 release 签名
        working-directory: mobile/app
        run: python3 ../../.github/scripts/patch_android_gradle.py android

      - name: Gradle 打 APK
        working-directory: mobile/app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 整理产物
        working-directory: mobile/app
        run: python3 ../../.github/scripts/stage_apk.py "${{ steps.ver.outputs.num }}"

      - name: 上传 Artifact（备用下载）
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ModelLookup-Mobile-${{ steps.ver.outputs.tag || 'dev' }}
          path: mobile/app/out/*
          if-no-files-found: error
          retention-days: 7

      - name: 首次签名提醒（无固定 keystore 时上传 jks，记得存成 secret）
        if: env.ML_KS_B64 == ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: generated-keystore-save-as-secret
          path: mobile/app/android/ml.keystore
          if-no-files-found: ignore
          retention-days: 7

      - name: 发布 Release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: 型号查询 手机版 ${{ steps.ver.outputs.tag }}
          prerelease: false
          draft: false
          fail_on_unmatched_files: true
          files: |
            mobile/app/out/ModelLookup-Mobile-${{ steps.ver.outputs.num }}.apk
