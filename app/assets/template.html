<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>型号查询</title>
<style>
:root{
  --bg:#f4f6fa; --card:#fff; --line:#e6eaf2; --line2:#eef1f7;
  --ink:#1b2431; --ink2:#5b6577; --ink3:#98a2b3;
  --brand:#2e6be6; --brand-d:#1b47b8; --brand-l:#eaf1ff;
  --ok:#0f9d58; --ok-l:#e8f6ee; --warn:#c2760a; --warn-l:#fdf3e3;
  --neg:#d64545;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
/* 左侧筛选栏（2026-10 五次改版）：搜索 + 品牌/品类/方式 全部移到左边 */
.side .searchbar{box-shadow:none;padding:0 10px;border-radius:10px}
.side #q{font-size:14px;padding:11px 0}
.side .chips{margin:0}
.side .chips .lbl{display:block;width:100%;margin:0 0 2px}
.side .vsep{display:none}
.side .pricebar-in{width:70px}
.side .updbar{margin:12px 0 0}
/* 子用户发布记录块（侧栏，仅管理号）：占满一行，chip 可换行 */
/* 子用户发布 2026-10-31 晚挪进顶栏 #ptbar（原侧栏 #tools 样式作废） */
/* 库存提醒横幅：已发布的型号对应的仓没货了 → 提醒下架 */
.pubwarn{
  margin:0 0 10px;padding:9px 14px;border-radius:10px;font-size:13.5px;line-height:1.6;
  background:#fdf3e3;border:1px solid #f3ddb0;color:#a16207;
}
.pubwarn b{color:#7c4a03}
.pubwarn a{color:#a16207;text-decoration:underline;cursor:pointer}
/* 2026-10-12：红条型号小牌可点击跳转（对齐黄条 lchip），红底红字保留下架警示色 */
.pubwarn .pubwarn-chip{display:inline-block;margin:2px 4px 2px 0;padding:2px 8px;border-radius:8px;
  background:#fdecec;color:#b42318;font-weight:600;font-size:12px;text-decoration:none}
.pubwarn .pubwarn-chip:hover{background:#fbd5d5}
/* 2026-10-12 方案A：整条红条可点（点任意位置列出全部缺货卡），给手型光标；「知道了」自己有 pointer */
.pubwarn{cursor:pointer}
.pubwarn #pubwarnx{cursor:pointer}
/* 用友登录告警横幅（管理号）：别的机器用友密码不对 → 这里红色亮牌 */
.yyalert{
  margin:0 0 10px;padding:9px 14px;border-radius:10px;font-size:13.5px;line-height:1.6;
  background:#fdecec;border:1px solid #f5c2c2;color:#b42318;
  display:flex;gap:10px;align-items:center;
}
.yyalert b{color:#912018}
.yyalert .close{margin-left:auto;border:0;background:none;color:#b42318;font-size:16px;cursor:pointer;padding:0 4px;line-height:1}
/* 亏钱哨兵（2026-10-10）：已发布型号按选定口径算要亏了 → 黄条提醒 */
.lossalert{background:#fff7e6;border-color:#ffd591;color:#ad6800;flex-wrap:wrap;row-gap:4px}
.lossalert b{color:#874d00;white-space:normal}
.lossalert .lchip{color:#ad6800;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
.lossalert .close{margin-left:auto;border:0;background:none;color:#ad6800;font-size:16px;cursor:pointer;padding:0 4px;line-height:1}
.mains{flex:1;min-width:0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}

/* ---------- 布局（2026-10 六次改版）----------
   页头整个删掉；侧栏 position:fixed 钉死在最左边、自己滚，
   主区留出 280px 边距。 */
.bodywrap{max-width:none;display:block;padding:10px 16px 40px 276px}
.side{
  position:fixed;left:10px;top:10px;bottom:10px;z-index:30;
  width:250px;overflow-y:auto;overflow-x:hidden;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:12px 12px 14px;box-shadow:var(--shadow);
}
.mains{min-width:0}
/* 侧栏底部：更新状态 + 型号数 · 数据时间 */
.sidefoot{margin:14px 0 0;padding-top:10px;border-top:1px dashed var(--line)}
.sidefoot .upnote{font-size:11.5px;color:var(--ink3);display:block;line-height:1.6}
.sidefoot .upnote b{color:var(--ink2)}
.sidefoot .upnote .spin{display:inline-block;width:11px;height:11px;border:2px solid #cfdcf6;
  border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:4px}
.sidecount{font-size:11.5px;color:var(--ink3);margin-top:6px;line-height:1.7}
.sidecount .mt{display:block}
.sideall{display:block;width:100%;margin-top:10px;padding:9px 12px;border:0;border-radius:9px;
  background:var(--brand);color:#fff;font-size:13px;font-weight:600;cursor:pointer;text-align:center}
.sideall:hover{background:var(--brand-d)}
.sideall:disabled{opacity:.55;cursor:default}
.sidecount b{color:var(--ink2);font-weight:600}
/* 清理价区间：标签 + 最低 ~ 最高 一行。⚠ flex:1+min-width:0 ——
   之前 width:100% 叠在标签旁边直接把 fgroup 撑破，侧栏底部被顶出横向滚动条 */
.pricerow{display:flex;gap:6px;align-items:center;flex:1;min-width:0;margin-top:2px}
.pricerow .pricebar-in{flex:1;width:auto;min-width:0}
.pricerow .tilde{color:var(--ink3);font-size:12px;flex:none}

/* ---------- search ---------- */
main{padding:22px 0 60px}
.searchbar{
  display:flex;align-items:center;gap:10px;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:0 14px;
  box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s;
}
.searchbar:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px rgba(46,107,230,.12),var(--shadow)}
.searchbar .ic{flex:none;color:var(--ink3)}
#q{
  flex:1;border:0;outline:0;background:transparent;padding:16px 0;
  font-size:17px;color:var(--ink);font-family:inherit;letter-spacing:.3px;min-width:0;
}
#q::placeholder{color:#b7c0cf;letter-spacing:0;font-size:15px}
.clr{
  border:0;background:#eef1f7;color:var(--ink2);width:26px;height:26px;border-radius:50%;
  cursor:pointer;font-size:15px;line-height:1;flex:none;
}
.clr:hover{background:#e3e8f2}

/* ---------- 筛选条 ----------
   原来是「品牌 / 品类 / 清理方式 / 价格区间」四行 chip，每行还各挂一个蓝色的
   「全部 977」，又长又重复（用户反馈「太乱了」）。现在：
     · 品牌、品类各收成一行，超出 8 个的收进「更多」；
     · 「全部」不再重复挂总数；
     · 价格区间并进「清理方式」那一行；chip 也整体压小了一号。 */
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:0;align-items:center}
.chips+.chips{margin-top:7px}
.chips .lbl{font-size:11.5px;color:var(--ink3);flex:none;margin-right:3px;letter-spacing:.2px}
.chip{
  border:1px solid var(--line);background:#fff;color:var(--ink2);
  padding:3px 10px;border-radius:999px;font-size:12.5px;cursor:pointer;
  transition:.13s;font-family:inherit;line-height:1.55;
}
.chip:hover{border-color:#c9d6ef;color:var(--brand-d)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.chip.g.on{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
.chip.w.on{background:var(--warn);border-color:var(--warn);color:#fff;font-weight:600}
/* 软件更新按钮发现新版本时的高亮（点过/装完就恢复普通样式） */
.chip.hot{background:#fff7e8;border-color:#f0c36d;color:#9a6a00;font-weight:700}
.chip i{font-style:normal;opacity:.6;font-size:10.5px;margin-left:3px}
/* 「更多 ▾」这种次要按钮 */
.chip.mini{padding:4px 9px;font-size:12px;color:var(--ink3);border-style:dashed}
.chip.mini:hover{color:var(--brand-d);border-style:solid}
/* 筛选分组盒（2026-10-08）：品牌/品类/方式各装一盒，组名小字，选中品牌在盒头显示总数 */
.fgroup{background:#f5f6f8;border-radius:10px;padding:10px 12px;margin-top:10px}
.fhead{display:flex;align-items:center;margin:0 0 8px}
.flbl{font-size:12px;color:#7b8494;letter-spacing:.2px}
.fcount{margin-left:auto;font-size:12px;color:var(--brand-d);font-weight:600}
/* 品牌/品类 chip：每行自动铺满对齐（行内均分宽度），不再参差留白 */
#chips .chip,#catchips .chip{flex:1 1 auto;text-align:center;padding:3px 8px}
/* 方式胶囊（全部/滞销清理/样机清理）：三个强制一行放得下 */
.chips.kinds{display:flex;flex-wrap:nowrap}
.chips.kinds .chip{flex:1 1 0;min-width:0;text-align:center;padding:3px 6px;font-size:12px;white-space:nowrap}
/* 方式筛选（2026-10-13 二次定稿）：只把「方式+有现货/发全国/未发布/已发布」放侧栏（用户框选的那截），
   闲鱼号/价格类型留在主区吸顶条不动 */
.kindbar{display:flex;flex-wrap:wrap;align-items:center;gap:5px 4px}
.kindbar .chip{flex:0 1 auto;padding:3px 8px;font-size:12px;white-space:nowrap}
/* 主区吸顶条（闲鱼号/价格类型，2026-10-10 定稿吸顶；chip 换行不再横向滚动） */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:8px 12px}
.topbar[hidden]{display:none}   /* display:flex 会压过 UA 的 [hidden]，必须显式关掉 */
.topbar .chip{flex:none;padding:3px 10px;font-size:12px;white-space:nowrap}
.topbar .tsep{width:1px;height:14px;background:#d7dce6;flex:none;margin:0 3px}
.topbar .tlbl{font-size:12px;color:#7b8494;flex:none}
/* 吸顶头：真固定 position:fixed（sticky 在这页面会被某些滚动场景带跑），
   和左侧栏同款圆角卡片（白底+描边+圆角14+投影），钉死在主区顶部 */
.stickhead{position:fixed;top:10px;left:276px;right:16px;z-index:26;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:10px 12px 8px;box-shadow:var(--shadow)}
#stickspacer{width:100%;pointer-events:none}   /* fixed 脱离文档流，用占位撑住高度（JS 按实际高度同步） */
.topbar .chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.topbar .tsep{width:1px;height:14px;background:#d7dce6;flex:none;margin:0 3px}
.topbar .tlbl{font-size:12px;color:#7b8494;flex:none}
/* 内嵌层开启态：后台/数据按钮点亮（同款蓝色实底） */
#xysjbtn.on{background:var(--brand);border-color:var(--brand);color:#fff}
/* 闲鱼内嵌层（2026-10-17）：固定覆盖主区内容（吸顶条以下、窗口底部以上），
   top 由 JS 按吸顶条实际高度同步；工具条 34px + iframe 占满其余 */
#xyframe{position:fixed;left:276px;right:16px;bottom:16px;z-index:24;
  background:#fff;border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
#xyframe[hidden]{display:none}
#xyframe_bar{height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 10px;border-bottom:1px solid var(--line);background:#f7f9fd}
#xyframe_lbl{font-size:12.5px;font-weight:600;color:#333}
#xyframe_ops{display:flex;gap:6px}
#xyframe_ops button{padding:3px 9px;border:1px solid #d7dce6;border-radius:7px;font-size:11.5px;
  background:#fff;color:#556;cursor:pointer;white-space:nowrap}
#xyframe_ops button:hover{border-color:#9fb6dd;color:var(--brand-d)}
#xyframe_if{flex:1;width:100%;border:0;display:block;background:#fff}
.pill.wh[data-sc],.pill.whmore[data-sc]{cursor:pointer}
/* 开关型筛选（只看有货/能发外区/未发布/已发布）：保留 .chip 类给事件委托，外观做成勾选框 */
.fchkrow{display:grid;grid-template-columns:1fr 1fr;gap:7px 10px;margin-top:9px}
.chip.fchk{display:flex;align-items:center;gap:6px;border:0;background:none;padding:0;border-radius:0;font-size:12.5px;color:var(--ink2);line-height:1.4}
.chip.fchk .box{width:14px;height:14px;border-radius:4px;border:1px solid #c9cfda;background:#fff;flex:none;position:relative;transition:.13s}
.chip.fchk:hover .box{border-color:#9fb6dd}
.chip.fchk:hover{color:var(--brand-d)}
.chip.fchk.on{background:none;border:0;color:var(--brand-d);font-weight:600}
.chip.fchk.on .box{background:var(--brand);border-color:var(--brand)}
.chip.fchk.on .box::after{content:'';position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.vsep{width:1px;height:16px;background:var(--line);flex:none;margin:0 3px}
.pricebar-in{
  width:70px;border:1px solid var(--line);border-radius:8px;padding:3px 7px;font-size:12px;
  font-variant-numeric:tabular-nums;outline:0;font-family:inherit;background:#fff;
}
.pricebar-in:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(46,107,230,.12)}
.pc{border:0;background:transparent;color:var(--brand);font-size:12.5px;cursor:pointer;
  font-family:inherit;padding:2px 4px}
.pc:hover{color:var(--brand-d);text-decoration:underline;text-underline-offset:3px}

.hint{font-size:12.5px;color:var(--ink3);margin:8px 2px 2px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;line-height:1.9}
/* hint 空的时候别占地方（吸顶卡里少一条白缝） */
.hint:empty{display:none}
.hint b{color:var(--ink2)}
.hint .dot{width:4px;height:4px;border-radius:50%;background:#cfd7e4;flex:none}

/* ---------- 一键更新条（仅通过本地服务打开时显示） ---------- */
.updbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 0;
  background:#fff;border:1px solid #dfe9fb;border-radius:12px;padding:8px 12px;
  box-shadow:0 1px 2px rgba(16,24,40,.03);
}
.updbar .upnote{font-size:12.5px;color:var(--ink3)}
.updbar .upnote b{color:var(--ink2);font-weight:600}
.updbar .spin{display:inline-block;width:12px;height:12px;border:2px solid #cfdcf6;
  border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:5px}
@keyframes sp{to{transform:rotate(360deg)}}
/* 软件更新弹窗里的转圈（openAppUpdate，2026-10-09） */
.apspin{display:inline-block;width:12px;height:12px;border:2px solid #cfdcf6;
  border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:5px}
/* 云端更新进度条（2026-10-09）：GPU 合成动画保证丝滑，width 过渡让轮询间隙也平滑 */
.uprog{width:100%;margin-top:4px}
.uprog .bar{height:8px;border-radius:99px;background:#e8eef9;overflow:hidden}
.uprog .fill{height:100%;width:0%;border-radius:99px;
  background:linear-gradient(90deg,#4f8bf7,#2e6be6);
  transition:width 1.2s cubic-bezier(.4,0,.2,1)}
.uprog .fill .glow{height:100%;width:100%;border-radius:99px;
  background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.45) 50%,rgba(255,255,255,0) 100%);
  background-size:200% 100%;animation:uglow 1.6s linear infinite}
@keyframes uglow{from{background-position:100% 0}to{background-position:-100% 0}}
.uprog .meta{display:flex;justify-content:space-between;margin-top:5px;
  font-size:11.5px;color:var(--ink3)}
.uprog .meta b{color:var(--brand);font-variant-numeric:tabular-nums}

/* ---------- cards ---------- */
.list{display:flex;flex-direction:column;gap:12px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px 18px 14px;box-shadow:0 1px 2px rgba(16,24,40,.03);
  transition:border-color .15s,box-shadow .15s;
}
.card:hover{border-color:#d6e0f0;box-shadow:var(--shadow)}
.card.marked{border-color:#bfe3cd;background:#fcfffd}
.chead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.pimg{
  width:74px;height:74px;object-fit:contain;background:#fff;flex:none;
  border:1px solid var(--line2);border-radius:10px;
}
.pimg.ph{
  display:flex;align-items:center;justify-content:center;position:relative;
  color:#c2ccdc;background:#fafbfd;
}
.addimg{
  position:absolute;inset:auto 0 0 0;
  font:600 11px/1 inherit;color:#2e6be6;background:#eef4ff;
  border:0;border-top:1px solid #dbe6fb;border-radius:0 0 9px 9px;
  padding:5px 0;cursor:pointer;width:100%;
}
.addimg:hover{background:#e2ecff}
.kimgdel{
  position:absolute;top:2px;left:66px;z-index:2;   /* 贴在补图右上角（pimg 74px 宽），别再飘到按钮上 */
  width:16px;height:16px;line-height:14px;padding:0;border-radius:50%;
  font:700 11px/14px inherit;text-align:center;cursor:pointer;
  color:#8a93a5;background:rgba(255,255,255,.92);border:1px solid var(--line);
  opacity:0;pointer-events:none;                   /* 平时看不见也**不吃点击**（17:10 实锤：透明钮把下面的按钮点没了） */
  transition:opacity .15s;
}
.chead:hover .kimgdel{opacity:.6;pointer-events:auto}
.kimgdel:hover{opacity:1;color:#fff;background:#d63838;border-color:#d63838}
.kimgre{
  position:absolute;top:2px;left:2px;z-index:2;    /* 换图钮贴图**左上角**（× 在图右侧），绝不盖 margin-left:auto 顶右的按钮排 */
  font:600 10px/1 inherit;cursor:pointer;
  color:#2e6be6;background:rgba(238,244,255,.95);
  border:1px solid #c9d9f8;border-radius:8px;padding:2px 6px;
  opacity:0;pointer-events:none;transition:opacity .15s;
}
.chead:hover .kimgre{opacity:.9;pointer-events:auto}
.kimgre:hover{opacity:1;background:#dde9ff}
.chead-main{flex:1;min-width:200px}
.moline{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.mo{
  font-size:18px;font-weight:650;letter-spacing:.4px;color:var(--ink);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all;
}
.card.marked .mo{color:#0f7a45}
.pub{
  display:inline-block;font-size:11px;font-weight:700;color:#0f7a45;background:var(--ok-l);
  border:1px solid #c9e8d6;border-radius:6px;padding:2px 8px;margin-top:2px;
}
/* 可卖角标（2026-10-31）：跟「已发布」标签并排，绿=能卖 / 黄=缺一头 / 灰=三无 */
.sellbadge{
  display:inline-block;font-size:10.5px;font-weight:700;vertical-align:middle;
  padding:1px 6px;border-radius:5px;line-height:1.6;margin-top:2px;letter-spacing:.3px;
}
.sellbadge.s-ok{color:#0f7a45;background:#e8f6ee;border:1px solid #b9e2cb}
.sellbadge.s-no-price{color:#8a5a00;background:#fdf3e2;border:1px solid #f0d8a8}
.sellbadge.s-no-stock{color:#8a5a00;background:#fdf3e2;border:1px solid #f0d8a8}
.sellbadge.s-none{color:#6b7280;background:#f1f2f4;border:1px solid #dcdee2}
/* 发布卡片小字「闲鱼定价 ¥x · 发布于 x-x x:x」：管理号默认显示（头部「定价/时间」可关），
   子账号默认不给，管理号在「账号管理」勾 pubmeta 才显示（2026-10-09） */
.pubmeta{
  display:inline-block;font-size:11.5px;color:#8a93a3;margin:2px 0 0 8px;vertical-align:middle;
  white-space:nowrap;
}
.acts{margin-left:auto;display:flex;gap:8px;flex:none}
.markbtn,.copy{
  border:1px solid var(--line);background:#fff;color:var(--ink2);
  border-radius:9px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;
  transition:.13s;white-space:nowrap;flex:none;
}
a.markbtn{text-decoration:none}
a.markbtn.web{color:var(--brand);border-color:#d5e2ff;background:var(--brand-l)}
a.markbtn.web:hover{border-color:var(--brand);background:#dde9ff}
.copy:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-l)}
.copy.done{border-color:#bfe3cd;color:var(--ok);background:var(--ok-l)}
.markbtn:hover{border-color:var(--ok);color:var(--ok);background:var(--ok-l)}
.card.marked .markbtn:not(.web){border-color:#c9e8d6;color:#0f7a45;background:var(--ok-l)}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
.tag{
  font-size:11.5px;padding:2px 9px;border-radius:6px;background:#f2f5fa;color:var(--ink2);border:1px solid var(--line2);
}
.tag.b{background:var(--brand-l);color:var(--brand-d);border-color:#d9e4ff;font-weight:600}
.tag.s{background:#f6f1ff;color:#6b46c1;border-color:#e8defc}
.tag.h{background:#fff5ec;color:#b45309;border-color:#fbe0c4;font-weight:600}
.tag.d{background:#f5f6f9;color:#8b95a6;border-color:#e9edf4}
.nm{font-size:13px;color:var(--ink2);margin:7px 0 0;line-height:1.5}

/* 发往范围（原「全国可发」列）——
   · loc   = 深圳/惠州/广州/东莞，**所有型号都能发**，所以它永远在
   · nat-y = 报备后可发全国 / 可发全国（要看地址）
   · nat-q = 要问过才知道（找品类报备确认 / 一单一询是否能发外地）
   · nat-s = 仍是本地口径，但表里写了进货年限之类的门槛备注 */
.pill.loc{background:var(--ok-l);color:#0f7d45;border-color:#c9e8d6}
.pill.nat-y{background:var(--brand-l);color:var(--brand-d);border-color:#d9e4ff}
.pill.nat-q{background:var(--warn-l);color:#a16207;border-color:#f0dcbb}
.pill.nat-s{background:#f5f6f9;color:#7c8698;border-color:#e9edf4}

/* 价格格 */
.prices{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;margin-top:13px}
.pr{background:#fafbfd;border:1px solid var(--line2);border-radius:10px;padding:8px 11px}
.pr span{display:block;font-size:11.5px;color:var(--ink3);margin-bottom:2px}
.pr b{font-size:15.5px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.2px}
.pr.hot{background:var(--brand-l);border-color:#d9e4ff}
.pr.hot b{color:var(--brand-d);font-size:17px}
/* 零售指导价只是「参考原价」，压低一档即可 —— ⚠ 不要加删除线，用户明确要求正常显示 */
.pr.rp{background:#fbfbfc}
.pr.rp b{color:var(--ink2);font-size:15px;font-weight:600}
.pr b i.orig{font-style:normal;font-size:11.5px;font-weight:400;color:var(--ink3);margin-left:3px;text-decoration:line-through}
.pr.bonus b{color:#b45309;font-size:15px}
.pr.qty b{font-size:15px}

.row{display:flex;gap:9px;align-items:baseline;margin-top:9px;font-size:13px;flex-wrap:wrap}
.row>label{flex:none;width:66px;color:var(--ink3);font-size:12px;letter-spacing:.2px}
.row .v{color:var(--ink);font-variant-numeric:tabular-nums}
.pill{
  display:inline-block;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;
  background:#f2f5fa;color:var(--ink2);border:1px solid var(--line2);font-variant-numeric:tabular-nums;
}
.pill.ok{background:var(--ok-l);color:var(--ok);border-color:#c9e8d6}
.pill.no{background:#f5f6f9;color:var(--ink3)}
.pill.mute{background:#f5f6f9;color:var(--ink3)}
.pill.sum{background:#eef4ff;color:#1d4fb8;font-weight:600}
.lnk{
  border:0;background:transparent;color:var(--brand);font-size:12.5px;cursor:pointer;
  padding:2px 4px;font-family:inherit;text-decoration:underline;text-underline-offset:3px;
  text-decoration-color:#bcd0f7;
}
.lnk:hover{color:var(--brand-d)}
/* 仓库明细（现存量10.6）—— 回答「这几台在哪个仓」。
   颜色按仓库类型分：正品仓绿 / 样机仓蓝 / 次品仓红 / 特价·待送橙 / 机壳·虚拟灰。
   仓多了只列前 4 个，鼠标停上去出完整列表（title 里有全部）。 */
.pill.wh{background:#f4f7fc;color:var(--ink2);border-color:#e2e9f4;font-weight:500;font-size:12px;padding:2px 9px}
.pill.wh em{font-style:normal;font-size:10.5px;color:var(--ink3);margin-left:4px}
.pill.wh b{margin-left:5px;font-weight:700;color:var(--ink)}
.pill.wh.ok{background:var(--ok-l);border-color:#c9e8d6}
.pill.wh.ok b{color:#0f7d45}
.pill.wh.sky{background:var(--brand-l);border-color:#d9e4ff}
.pill.wh.sky b{color:var(--brand-d)}
.pill.wh.bad{background:#fef2f2;border-color:#fbd5d5}
.pill.wh.bad b{color:#b42318}
.pill.wh.warn{background:var(--warn-l);border-color:#f0dcbb}
.pill.wh.warn b{color:#a16207}
.pill.wh.mute{background:#f5f6f9;border-color:#e9edf4;color:var(--ink3)}
.pill.whmore{background:#fff;border-style:dashed;color:var(--ink3);font-weight:500;font-size:12px}

/* ---------- 闲鱼定价计算器 ---------- */
.calc{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin-top:12px;background:#f7faff;border:1px solid #dfe9fb;border-radius:10px;padding:9px 12px;
}
.calc .cl{font-size:12px;color:var(--ink3);flex:none}
/* 反推定价（2026-10-31 晚改版）：我要挣 → 输入即算直填定价框 */
.calc .cgoal{display:flex;align-items:center;gap:6px;flex:none;padding-left:10px;border-left:1px dashed #cbd8ee}
.calc .cgoal input{width:100px;appearance:textfield;-moz-appearance:textfield}
.calc .cgoal input::-webkit-outer-spin-button,.calc .cgoal input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.calc .cgoal .guna{font-size:12px;border:1px solid var(--line);border-radius:7px;padding:5px 3px;background:#fff;color:#1b2431;outline:0;font-family:inherit}
.calc .gcalc{display:inline-block;background:#2e6be6;color:#fff;border-radius:7px;padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.calc .gcalc:hover{background:#1b53c8}
.calc .gpanel{flex-basis:100%;font-size:12.5px;color:#4b5563;line-height:1.95;padding-top:2px}
.calc .gpanel .ginfo b{color:#1b2431}
.calc .gpick{display:inline-block;margin:0 6px 0 0;padding:2px 11px;border:1px solid #b9cdf3;border-radius:999px;background:#eef4ff;color:#1b4fbf;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.calc .gpick:hover{background:#2e6be6;color:#fff;border-color:#2e6be6}
.calc .gok{color:#15803d;font-weight:600}
.calc .gwr{color:#b42318;font-weight:600}
.calc .gbad{color:#b42318}
/* 搜索打字候选（2026-10-31 晚改版自绘，对齐搜索框） */
#qcand{position:fixed;z-index:1200;background:#fff;border:1px solid #c9d6ec;border-radius:10px;
       box-shadow:0 10px 28px rgba(23,43,77,.16);padding:5px;max-height:320px;overflow:auto}
#qcand .qci{padding:7px 11px;border-radius:7px;font-size:13px;color:#333;cursor:pointer;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#qcand .qci:hover{background:#eaf1ff;color:#1b47b8}
.calc input{
  width:128px;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:14px;
  font-variant-numeric:tabular-nums;outline:0;font-family:inherit;background:#fff;
}
.calc input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(46,107,230,.12)}
/* 多货源口径名长（价格含税（隆阳电器）¥889）：260px 保住整句不截字，窄卡再缩 */
.calc select{
  border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;
  font-family:inherit;background:#fff;color:var(--ink2);outline:0;max-width:min(260px,100%);
}
.calc .ci{font-size:12px;color:var(--ink3)}
.calc .ci b{color:var(--ink2);font-weight:600;font-variant-numeric:tabular-nums}
.calc .cfr{font-size:11.5px;color:var(--ink3);display:inline-flex;align-items:center;gap:4px;cursor:pointer;flex:none;white-space:nowrap}
.calc .cfr:hover{color:var(--ink2)}
.calc .cfr input{width:auto;margin:0;accent-color:var(--brand);cursor:pointer}
.calc .p-out{font-size:14.5px}
.calc .p-out.pos{color:var(--ok)}
.calc .p-out.neg{color:var(--neg)}

.empty{text-align:center;padding:56px 20px;color:var(--ink3)}
.empty svg{opacity:.35;margin-bottom:12px}
.empty h3{margin:0 0 6px;color:var(--ink2);font-size:15px;font-weight:600}
.empty p{margin:0;font-size:13px;line-height:2.1}
.empty code{
  background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px 7px;
  font-size:12.5px;color:var(--brand-d);cursor:pointer;font-family:inherit;
}
.empty code:hover{border-color:var(--brand);background:var(--brand-l)}
.more{text-align:center;padding:22px;color:var(--ink3);font-size:13px}
footer{
  border-top:1px solid var(--line);margin-top:28px;padding:18px 0 0;
  font-size:12px;color:var(--ink3);line-height:1.8;
}
footer a{color:var(--brand);text-decoration:none}
footer a:hover{text-decoration:underline}
@media (max-width:560px){
  .top .wrap{height:auto;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
  .top .meta{margin-left:0;text-align:left;width:100%}
  .mo{font-size:16px}
  .pimg{width:58px;height:58px}
  .kimgdel{left:50px}
  .prices{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
  .row>label{width:58px}
  .acts{margin-left:0;width:100%}
}
/* ---- 启动骨架（exe 版先出这个，数据到了再换成界面） ---- */
.boot{text-align:center;padding:72px 20px;color:var(--ink3);font-size:13px}
.boot .spin{width:26px;height:26px;margin:0 auto 14px;border:2.5px solid #e6eaf2;border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty .dim{color:var(--ink3);font-size:12.5px;margin-top:8px}
.empty.idle{padding:64px 20px}
/* ---- 全新机报价那一排（和清理价区分开） ---- */
.prices.newp{margin-top:9px}
.prices.newp .pr{background:#f7faff;border-color:#e3ecfb}
.pr.hot2 b{color:#1d4ed8}
.pr.tax b{font-size:15.5px}
/* 可点击价格格（点=填定价/算奖励）：悬浮描边 + 右上角小圆点提示可点 */
.pr.prpick{cursor:pointer;position:relative;transition:border-color .12s,box-shadow .12s}
.pr.prpick::after{content:'';position:absolute;top:7px;right:7px;width:5px;height:5px;border-radius:50%;
  background:#c3cddd;transition:.12s}
.pr.prpick:hover{border-color:var(--brand);box-shadow:0 0 0 2px rgba(46,107,230,.12)}
.pr.prpick:hover::after{background:var(--brand)}
.pr.prpick.on{border-color:var(--ok);background:#f2fbf6;box-shadow:inset 0 0 0 1px var(--ok)}
.pr.prpick.on::after{background:var(--ok)}
.pr.prpick.on b{color:#15803d}
/* 看子用户发布（只读）：价格格整体变摆设——无指针、无悬停、无「点击填价」暗示 */
.card.svro .pr.prpick{cursor:default;pointer-events:none}
.card.svro .pr.prpick::after{display:none}
.card.svro .pr.prpick:hover{border-color:inherit;box-shadow:none}
.tag.np{background:#eef6ff;color:#1d4ed8;border-color:#d8e7fd;font-weight:600}
/* ---- 新字段的标签 ---- */
.row .vs{display:flex;flex-wrap:wrap;gap:6px}
.pill.ship{background:#f0fbf4;color:#1c7a45;border-color:#cdeedb;font-weight:600}
/* 「外区加100运费」的两种口径 */
.pill.ship-y{background:var(--brand-l);color:var(--brand-d);border-color:#d9e4ff}
.pill.ship-q{background:var(--warn-l);color:#a16207;border-color:#f0dcbb}
.pill.ship-f{background:#e7f7ec;color:#0f7a45;border-color:#bfe6cd;font-weight:700}
.pill.src{background:#f7f8fb;color:var(--ink2)}
.pill.s69{background:#fff8ec;color:#a16207;border-color:#f6e3bd}
.pill.sub{background:#fff3f3;color:#c2410c;border-color:#fbd9cf}
.pill.mono{font-variant-numeric:tabular-nums}
/* ---------- 2026-10-31 增强层（用户令「剩下的全改」） ---------- */
mark.hlm{background:#fff3bf;color:inherit;padding:0 1px;border-radius:3px}
.extags{margin-top:3px}
.extag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:#eef4ff;color:#2e6be6;
  border:1px solid #d5e2ff;margin:2px 3px 0 0;cursor:pointer;line-height:1.6}
.extag b{font-weight:400;margin-left:3px;color:#8aa4d8}
.extag:hover{background:#fdecec;border-color:#f5c2c2;color:#b42318}
.extag:hover b{color:#b42318}
.exbar{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;padding-top:7px;border-top:1px dashed var(--line2)}
.exmini{font-size:11.5px;line-height:1.5;padding:2px 8px;border:1px solid var(--line);border-radius:99px;
  background:#fff;color:var(--ink2);cursor:pointer;font-family:inherit}
.exmini:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-l)}
.exrow{margin-top:3px}
.sideall2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.sidebtn{padding:7px 8px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink2);
  font-size:12px;cursor:pointer;text-align:left;font-family:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebtn:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-l)}
#exmask{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:9998;display:flex;align-items:center;justify-content:center;padding:22px}
.exmodal{width:min(560px,94vw);max-height:86vh;display:flex;flex-direction:column;background:#fff;border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.28);overflow:hidden}
.exmodal.wide{width:min(960px,96vw)}
.exmh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.exmh b{flex:1;font-size:15px}
.exmb{padding:14px 16px 18px;overflow:auto;font-size:13px;line-height:1.65;color:var(--ink)}
.exmb table{width:100%;border-collapse:collapse;font-size:12.5px}
.exmb th,.exmb td{border-bottom:1px solid var(--line2);padding:5px 6px;text-align:left;vertical-align:top}
.exmb th{color:var(--ink3);font-weight:600;background:#fafbfd}
.exmb .ok{color:#0f7a45}.exmb .bad{color:#b42318}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.exgrid a{display:block;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fafbfd;text-decoration:none}
.exgrid img{width:100%;height:146px;object-fit:contain;background:#f2f5fa;display:block}
.exgrid span{display:block;font-size:11px;color:var(--ink3);padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exgrid a.on{border-color:var(--brand);box-shadow:0 0 0 2px rgba(46,107,230,.16)}
.exgrid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:760px){.exgrid2{grid-template-columns:1fr}}
.extblwrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.extblbar{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:12.5px;color:var(--ink2);
  background:#fafbfd;border-bottom:1px solid var(--line)}
.extbl{width:100%;border-collapse:collapse;font-size:12.5px}
.extbl th,.extbl td{border-bottom:1px solid var(--line2);padding:7px 9px;text-align:left;white-space:nowrap}
.extbl th{background:#f7f9fc;color:var(--ink2);font-weight:600;position:sticky;top:0}
.extbl tbody tr:hover{background:#f6f9ff;cursor:pointer}
.extbl .ok{color:#0f7a45;font-weight:600}
</style>
</head>
<body>

<main>
  <div class="wrap bodywrap">
    <aside class="side" id="side">
      <div class="searchbar">
        <svg class="ic" width="17" height="17" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/>
          <path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <input id="q" placeholder="型号 / 品类：BCD-501… / 冰箱" autocomplete="off" spellcheck="false">
        <button class="clr" id="clr" hidden title="清空">×</button>
      </div>
      <div class="fgroup" id="brandbox">
        <div class="fhead"><span class="flbl">品牌</span><span class="fcount" id="brandcount"></span></div>
        <div class="chips" id="chips"></div>
      </div>
      <div class="fgroup" id="catbox">
        <div class="fhead"><span class="flbl">品类</span><span class="fcount" id="catcount"></span></div>
        <div class="chips" id="catchips"></div>
      </div>
      <!-- 方式筛选（2026-10-13 三改）：侧栏只留方式，四个开关挪回主区吸顶条 -->
      <div class="fgroup" id="kindbox">
        <div class="fhead"><span class="flbl">方式</span></div>
        <div class="kindbar" id="topbar">
        <button class="chip" data-kind="">全部</button>
        <button class="chip" data-kind="z" title="非滞销/样机的全新机型号（和卡片「全新机」标签同口径）">正品</button>
        <button class="chip" data-kind="l" title="滞销清理型号">滞销</button>
        <button class="chip" data-kind="s" title="样机清理型号">样机</button>
        </div>
      </div>
      <!-- 闲鱼号格子（2026-10-30 用户令「挪到左边栏里面去新增个格子」）：看发布横幅 + 号筛选 + 管理/数据。
           平时收起；进「已发布/看发布」视图时出现——横幅显示正在看谁的发布，
           号筛选/管理/数据仍只在自看时亮（2026-10-23 定稿不变） -->
      <!-- 子用户发布（2026-10-31 晚用户令：放侧栏状态栏「闲鱼号」块上面）：管理号选一个子用户，整个界面切到看 TA 的发布 -->
      <div class="fgroup" id="subrec" hidden>
        <div class="fhead"><span class="flbl" id="subreclbl">子用户</span></div>
        <select id="subrecsel" style="width:100%;box-sizing:border-box;padding:5px 8px;border:1px solid #d7dce6;border-radius:8px;font-size:12.5px;background:#fff;outline:0;color:#333;cursor:pointer"></select>
      </div>
      <div class="fgroup" id="xybox" hidden>
        <div class="fhead"><span class="flbl">闲鱼号</span></div>
        <div id="xyboxbanner" hidden style="display:none;font-size:12.5px;font-weight:500;color:#475467;line-height:1.55;word-break:break-all;margin:1px 0 7px"></div>
        <div id="xyseg" style="display:none;flex-direction:column;align-items:stretch;gap:6px">
          <select id="xysel" title="只看标记到这个闲鱼号名下的型号（全部=不按号筛）"
                  style="width:100%;box-sizing:border-box;padding:5px 8px;border:1px solid #d7dce6;border-radius:8px;font-size:12.5px;background:#fff;outline:0;color:#333">
            <option value="">全部</option>
          </select>
          <div style="display:flex;gap:6px">
            <!-- 状态栏「管理」键（2026-10-14）：不用进发布弹窗，这里直达「管理我的闲鱼号」 -->
            <button id="xymgrbtn" title="管理我的闲鱼号：改名（同步所有发布记录）/ 修复旧号名 / 一键全部取消标记发布"

<script>
(function(){
"use strict";
/* 数据怎么来，有两种：
   ① 离线单文件版：数据直接烤死在 <script id="payload"> 里（DATA 有值），双击即用；
   ② exe 版：页面自己只有几十 KB —— 先秒开窗口显示骨架，再去 /api/data 取数据。
      图片也不塞进页面，改成按需向 /img/<型号> 要（真正懒加载，用得着才解码）。
   DATA / CFG 都是构建时注入的。 */
var DATA = /*__DATA__*/null;
/* CFG 不用注入，按「数据有没有内联」自己判断：
   内联 = 离线单文件版（图片也是 dataURL）；
   没内联 = exe 版，数据和图片都走本地 HTTP（页面才几十 KB，窗口秒开）。 */
var CFG  = DATA
  ? { fetch: false, imgBase: '',      dataUrl: '' }
  : { fetch: true,  imgBase: '/img/', dataUrl: '/api/data' };
var META = {}, ALL = [], IMGS = {}, IMGHAS = null;
var WEB = null;                  /* 型号 → 官网产品详情页直链（catalog 命中的才有；没有就退回官网搜索页） */
var FEE  = 0.016;                // 闲鱼平台费率 1.6%
/* exe 版后台更新状态：price_at/stock_at = 最近一次金山/用友更新时间（侧栏显示）；
   rev = 后端数据版本号，变了就静默重拉数据，界面无感跟上 */
var UPSTATE = { price_at: "", stock_at: "", rev: null, fetching: false, alert_ts: null, cdp_on: true, autostart_on: true, data_alert: "" };
/* 用友告警横幅：/api/state 里 alert_ts 变了就亮牌（管理号才显示） */
function showYyAlert(msg){
  var el = document.getElementById('yyalert');
  if (!el || !msg) return;
  el.innerHTML = '<b>🔔 用友告警</b><span>' + esc(msg) + '</span>'
    + '<button class="close" title="知道了">×</button>';
  el.hidden = false;
  el.querySelector('.close').addEventListener('click', function(){ el.hidden = true; });
}
/* 实时库存（exe 版从用友 YonSuite 拉的现存量，点「更新实时库存」刷新）：
   STOCK = { 型号norm: { q:现存量, a:可用量, wt:{仓库类型:可用量} } }，键与 norm() 同一套归一 */
var STOCKDATA = null;
/* 库存匹配（2026-10-10 深夜终稿「**编码优先、型号兜底**」）：
   ① 卡片有 YS物料编码（约 6 成的行）→ 先走编码一对一硬核对——编码是 SKU 唯一码
     （用友 productsku_cCode = 表里的 YS物料编码，同一套），对得上就是对得上，
     没有任何启发式和解释空间，型号误绑/系列尾缀歧义在这 6 成里根本不会发生；
   ② 没编码、编码表还没拉到、或编码没命中 → 退回型号匹配（一字不差 + 系列尾缀
     唯一例外，2026-10-10 全量验过零误伤）。
   （归一只归写法：全半角/空格/大小写；内容多一个字少一个字都不算） */
function stockOf(mo, name, code){
  var s = STOCKDATA && STOCKDATA.stock;
  if (!s) return null;
  if (code){
    var bc = STOCKDATA.sbc, ck = norm(code);
    if (bc && ck && bc[ck]) return bc[ck];      // 编码硬核对命中（a=0 也照回：真没货）
  }
  var k = norm(mo);
  if (s[k]) return s[k];                      // 一字不差精确
  if (!name) return null;
  var n = norm(name), hit = null;
  for (var key in s){
    if (key.length > k.length && key.lastIndexOf(k, 0) === 0 && n.indexOf(key) >= 0){
      if (hit) return null;                   // 两台都像 → 保守不认
      hit = s[key];
    }
  }
  return hit;
}
/* 库存豁免名单（2026-10-10 用户定稿；2026-10-24 单源化）：这些货不走用友库存——
   · 货源 HM夏（外供货源，用友里本来就没有）
   · 美的 / 容声（LYDF 表那套报价）、科沃斯（外品牌）
   名单从 payload.meta.stock_rules 读（assets/stock_rules.json 单源，重建数据即全端生效），
   数据没带 rules 时用内置兜底。用友里有没有都当「有货」：清理数量不报「已无库存」、
   库存行不空、不被三无隐藏、已发布不进「没库存」提醒/筛选 */
var EXT_FREE_DEF = { ext_free_brands: ['美的', '容声', '科沃斯'], ext_free_source: 'HM夏' };
function extStockFree(it){
  if (!it) return false;
  var r = META.stock_rules || EXT_FREE_DEF;
  if (it._md) return true;                               // 美的 / 容声（LYDF 那套）
  if ((r.ext_free_brands || []).indexOf(it.b) >= 0) return true;
  return String(it.sfrom || '').trim() === (r.ext_free_source || 'HM夏');   // 货源 HM夏
}
/* 已发布型号按发布类型的剩余可售（2026-10-09 从 pubStockWarn 抽出来，筛选「没库存」也要用）：
   正品发布看非样机/非次品仓的可用量，样机发布看样机仓；库存里查不到返回 -1（也当没库存提醒） */
function pubLeftOf(mo, kind, name, code){
  /* 豁免名单（货源 HM夏 / 美的 / 容声 / 科沃斯）恒有货——用友里查不到不算数 */
  for (var _xi = 0; _xi < ALL.length; _xi++){
    if (ALL[_xi].mo === mo && extStockFree(ALL[_xi])) return 1;
  }
  /* 2026-10-09 晚再定稿（用户：库存对不对是重中之重）：用友实时库存是唯一准绳——
     · 用友能查到这台 → 用可用量（0 就是真的没货，要报）；
     · 用友现存量报表里连这一行都没有 → 就是没有现存 = 没货（之前回退清理数量 1，
       导致卖光/清完的型号永远「有货」不报警，CXW-358-C3Q90FGUD 实锤）；
     · 只有实时库存还没拉过时才回退金山表清理数量兜底（此时横幅整体隐藏，仅筛选用）。
     （更早的误报反例 JSQ25：型号在用友有货但躺在别的仓——那会儿只数非样机非次品仓
       才漏的，现在直接用全仓可用量，不会重蹈） */
  var live = stockOf(mo, name, code);
  if (live) return isNum(live.a) ? Math.round(live.a) : 0;
  if (STOCKDATA && STOCKDATA.stock && Object.keys(STOCKDATA.stock).length) return 0;
  var it = null;
  for (var i = 0; i < ALL.length; i++){ if (ALL[i].mo === mo){ it = ALL[i]; break; } }
  var q = it ? (isNum(it.lq) ? it.lq : (isNum(it.sq) ? it.sq : null)) : null;
  return isNum(q) ? q : 0;
}
/* 按卡片键找型号条目（告警/筛选要用 it.mo 查库存——发布记录的键可能是变体码，
   直接拿去查库存会把有货的误报成「查不到」，2026-10-09 实锤 JSQ22 就是这么误报的） */
function itemOf(c){
  for (var i = 0; i < ALL.length; i++){ if (ALL[i].c === c) return ALL[i]; }
  return null;
}

/* 库存溯源（2026-10-10 深夜「编码优先」配套）：点卡片库存 pill 弹「编码 → 用友原始行明细」，
   自助查证 10 秒一单：走的编码直连还是型号匹配、每个仓多少、可用/现存合计、数据拉取时间。 */
function openStockTrace(code, mo){
  var it = null;
  for (var i = 0; i < ALL.length; i++){ if (ALL[i].mo === mo){ it = ALL[i]; break; } }
  var live = it ? stockOf(it.mo, nameOf(it), it.code) : null;
  if (!live) return;
  var viaCode = !!(code && STOCKDATA.sbc && norm(code) && STOCKDATA.sbc[norm(code)]);
  var rows = (live.whs || []).map(function(x){
    return '<tr><td style="padding:2px 4px 2px 0">' + esc(x.w) + '</td><td style="padding:2px 6px;color:#7b8494">' + esc(x.t || '') + '</td><td style="text-align:right"><b>' + Math.round(x.n) + '</b></td></tr>';
  }).join('');
  var ov = document.createElement('div');
  ov.id = 'stktrace';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:9999;display:flex;align-items:center;justify-content:center';
  ov.innerHTML = '<div style="background:#fff;border-radius:12px;min-width:320px;max-width:430px;max-height:70vh;overflow:auto;padding:16px 18px;font-size:13px;box-shadow:0 12px 40px rgba(0,0,0,.25)">'
    + '<div style="font-weight:700;margin-bottom:4px">' + (code ? '编码 ' + esc(code) : '型号 ' + esc(mo || '')) + '</div>'
    + '<div style="color:#7b8494;margin-bottom:10px">' + esc(mo || '') + (viaCode ? ' · <span style="color:#178a50;font-weight:600">编码直连</span>' : ' · 型号匹配') + '</div>'
    + '<table style="width:100%;border-collapse:collapse">'
    + '<tr style="color:#98a1b0"><td style="padding-bottom:4px">仓库</td><td></td><td style="text-align:right;padding-bottom:4px">可用</td></tr>' + rows + '</table>'
    + '<div style="margin-top:10px;padding-top:8px;border-top:1px solid #e5e8ef">可用合计 <b>' + Math.round(live.a || 0) + '</b> · 现存合计 <b>' + Math.round(live.q || 0) + '</b></div>'
    + '<div style="color:#98a1b0;font-size:11.5px;margin-top:6px">用友实时数据 · 拉取于 ' + esc((STOCKDATA && STOCKDATA.ts) || '') + ' · 点空白处关闭</div>'
    + '</div>';
  ov.addEventListener('click', function(e){ if (e.target === ov) ov.remove(); });
  document.body.appendChild(ov);
}
document.addEventListener('click', function(e){
  var p = e.target.closest ? e.target.closest('span.pill.wh[data-sc], span.pill.whmore[data-sc]') : null;
  if (p) openStockTrace(p.getAttribute('data-sc'), p.getAttribute('data-mo'));
});

/* ================= 本地存储 ================= */
/* 发布缓存按账号隔离（2026-10-09 修「已发布串号」）：旧版 xy2-* 键不分账号，
   同一台电脑换账号登录后，上一个账号的发布记录会残留给下一个账号看，
   甚至被 /pubsync 整包推上别人的云端。检测「上次账号 ≠ 本次账号」
   → 旧全局键按无主残留清掉（不迁移，避免把别人的搬进来），reload 一次吃干净状态 */
(function(){
  var lu = null; try { lu = localStorage.getItem('ml_lastuser'); } catch(e){}
  var au = ''; try { var a = JSON.parse(localStorage.getItem('ml_auth') || 'null'); au = (a && a.u) || ''; } catch(e){}
  window.__ML_U = au;   /* 本机当前账号：MARK/PRICE/IMG 本地键按账号分家（2026-10-23 串号根治） */
  if (lu !== au){
    try {
      ['xy2-published', 'xy2-prices', 'xy2-imgs', 'xy-published-v1', 'xy-prices-v1', 'xy-imgs-v1']
        .forEach(function(k){ localStorage.removeItem(k); });
      localStorage.setItem('ml_lastuser', au);
    } catch(e){ return; }              // 写不进（隐私模式等）就不 reload，防死循环
    if (lu !== null) location.reload(); // 首次部署只写标记不刷；真换了账号才刷
  }
})();
/* 2026-10-23 串号根治：发布/价格/补图三个本地键按账号分家（配合登录成功整页刷新）。

  /* 2026-10-10 修「串号阴魂不散」：登录合并原来是本地整包推 + 云端按时间戳只增不删，
     串号时代推进 pub_B 的 TB 记录躺在本地 MARK_KEY 里，每次登录都会被原样推回去，
     云端清了也白清。改定：**云端为准**——登录只上推定价（全量收价不变），
     发布标记一律以云端返回覆盖本地（标记/取消本来就是即时单条推 /pub，本地只是缓存） */
  authFetch('/pubsync', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                          body: JSON.stringify({ prices: PRICES, xyp: buildXyp() }) }, true)
    .then(function(j){
      if (j && j.ok && j.marks){
        var changed = JSON.stringify(MARKED) !== JSON.stringify(j.marks);
        MARKED = j.marks; normMarksLocal(); saveMarks();
        /* 口径 cs / 奖励 bn / 勾选 nat 都在 j.marks 里——云端唯一源，本地零记忆（2026-10-13 定稿） */
        /* 2026-10-13 修「换电脑价格全变」：原来只补空位（c 不在 PRICES 才收），
           老电脑 localStorage 里的旧价把云端价整个遮住——换台机就集体回退。
           改定：登录同步时**云端为准**（此刻本会话还没编辑过，不存在覆盖用户输入），
           已发布的型号云端有价就盖本地；云端没价的（理论少见）保留本地不动。
           本会话之后的改价照旧全量推 /pubsync，不影响正常编辑。 */
        var pr = j.prices || {}, filled = false;
        Object.keys(pr).forEach(function(c){
          if (MARKED[c] && isFinite(+pr[c]) && PRICES[c] !== +pr[c]){ PRICES[c] = +pr[c]; filled = true; }
        });
        var pruned = prunePrices();
        if (filled || pruned) savePrices();
        if (changed || filled || pruned){ run(); pubStockWarn(); }
      }
    });
}

/* ================= 补图 ================= */
function pickImage(core){
  var fi = document.getElementById('imgfile');
  fi.value = '';
  fi.onchange = function(){
    var f = fi.files && fi.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function(){
      var im = new Image();
      im.onload = function(){
        var w = im.width, h = im.height, s = Math.min(1, 240 / Math.max(w, h));
        var cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(w * s)); cv.height = Math.max(1, Math.round(h * s));
        var cx = cv.getContext('2d');
        cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);   // 透明图补白底
        cx.drawImage(im, 0, 0, cv.width, cv.height);
        MYIMGS[core] = cv.toDataURL('image/jpeg', 0.72);
        saveMyImgs();
        run();
        imgCloudPush(core);              // 上云：所有子账号登录都能看到这张图
      };
      im.onerror = function(){ alert('这张图读不出来，换一张试试'); };
      im.src = fr.result;
    };
    fr.readAsDataURL(f);
  };
  fi.click();
}

/* ================= 归一化（与 build.py 严格一致） ================= */
function half(s){
  return String(s == null ? '' : s)
    .replace(/[\uFF01-\uFF5E]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
    .replace(/\u3000/g, ' ');
}
function norm(s){ return half(s).replace(/\s+/g, '').toUpperCase(); }
function coreOf(s){
  var n = norm(s);
  var m = n.match(/[\u4e00-\u9fff]/);
  if (m && m.index >= 3) return n.slice(0, m.index).replace(/[()\-_/+.,、，]+$/, '');
  return n;
}
function coreOf2(s){
  var parts = norm(s).split(/[^0-9A-Z\/*\-+.]+/).filter(function(x){ return x.length >= 3; });
  if (!parts.length) return '';
  parts.sort(function(a,b){ return b.length - a.length; });
  return parts[0];
}

/* ================= 品类归一化 ================= */
var RE_KITCHEN = /油烟|燃气灶|煤气灶|灶具|洗碗|消毒柜|蒸箱|蒸烤|烤箱|小厨宝|电磁灶|电磁炉|微波炉|集成灶|厨房|厨电/;
var RE_SMALL = /电饭煲|压力锅|破壁机|空气炸|电水壶|电火锅|电饼铛|绞肉|料理机|榨汁|豆浆|风扇|吸尘|洗地|生活家电|小家电|除湿|加湿|暖风|电暖|门锁|晾衣|晾晒/;
function catGroup(v){
  var t = norm(v);
  if (!t) return '其他';
  if (t.indexOf('空调') >= 0 || t === '风管机' || t === '小风管' || t === '柜嵌' || t.indexOf('热泵') >= 0 || t.indexOf('家中机') >= 0) return '空调';
  if (t.indexOf('冰箱') >= 0) return '冰箱';
  if (t.indexOf('冷柜') >= 0 || t.indexOf('冰柜') >= 0) return '冷柜';
  if (t.indexOf('洗衣') >= 0) return '洗衣机';
  if (t.indexOf('热水') >= 0) return '热水器';
  if (t.indexOf('净水') >= 0 || t.indexOf('净饮') >= 0 || t.indexOf('饮水') >= 0) return '净水';
  if (t.indexOf('电视') >= 0 || t.indexOf('彩电') >= 0) return '电视';
  if (RE_KITCHEN.test(t)) return '厨电';
  if (RE_SMALL.test(t)) return '小家电';
  return '其他';
}

/* ================= 建索引（数据到位后才跑） ================= */
var UID = {}, BRANDS = [], CATS = [];
function buildIndex(){
  var i, r;
  UID = {};
  for (i = 0; i < ALL.length; i++){
    r = ALL[i];
    r._n  = norm(r.mo);
    r._c2 = coreOf2(r.mo);
    r._cg = catGroup(r.cat);
    r._h  = norm([r.cat, r.b, r.n, r.code, r.st, r.note].join(' '));
    // 美的 / 容声那张表是另一套报价（拿货价·慧买卖 / 给二批 / 价格取整），
    // 卡片和计算器要跟着换口径 —— 用这三个字段当标记
    r._md = isNum(r.mh) || isNum(r.m2) || isNum(r.mr);
    r._uid = i;
    UID[i] = r;
  }
  var mb = {}, mc = {};
  ALL.forEach(function(it){
    if (it.b) mb[it.b] = (mb[it.b] || 0) + 1;
    if (it._cg) mc[it._cg] = (mc[it._cg] || 0) + 1;
  });
  BRANDS = Object.keys(mb).map(function(k){ return { k: k, n: mb[k] }; })
    .sort(function(a,b){ return b.n - a.n; });
  /* 品类顺序用户拍板（2026-10-08）：固定业务排序，不按数量排；
     表里冒出来的新品类排在最后（数量降序） */
  var CAT_ORDER = ['冰箱','空调','洗衣机','净水','厨电','电视','热水器','冷柜','其他','小家电'];
  CATS = Object.keys(mc).map(function(k){ return { k: k, n: mc[k] }; })
    .sort(function(a,b){
      var ia = CAT_ORDER.indexOf(a.k), ib = CAT_ORDER.indexOf(b.k);
      if (ia < 0 && ib < 0) return b.n - a.n;
      if (ia < 0) return 1;
      if (ib < 0) return -1;
      return ia - ib;
    });
}

function isNum(v){ return typeof v === 'number' && isFinite(v); }

}
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* 价格格。pick 参数（2026-10-08 新增）让它可点：

  }
  return '<div class="pr' + (cls ? ' ' + cls : '') + attr + '"><span>' + label + '</span><b>' + esc(money(v)) + '</b></div>';

/* 该型号全部「拿货侧」价格（2026-10-30 用户定稿，用于清理价区间筛选）：
   价格含税 / 滞销清理价 / 样机清理价（多货源每个货源的含税价也算）；
   美的 / 容声系没有清理价，按 拿货价·慧买卖 / 给二批 / 价格取整 算。
   ⚠ 零售指导价不算 —— 那是卖价参考，不是拿货价（用户拍板）。
   「送」= 白送，按 0 元参与（2026-10-10）；0/空 = 没填，不当真数字 */
function takePrices(it){
  var P = [];
  function _add(v){
    if (v === '送'){ P.push(0); return; }
    if (isNum(v) && v > 0) P.push(v);
  }
  _add(it.pt);
  if (it.srcs && it.srcs.length > 1) it.srcs.forEach(function(sc){ _add(sc.pt); });
  _add(it.lpz);
  _add(it.spz);
  _add(it.mh); _add(it.m2); _add(it.mr);   /* 美的/容声系报价（其他表没这几列，天然跳过） */
  return P;
}

/* ================= 闲鱼定价计算器 =================
   成本下拉逐项受权限控制（p_lpz/p_spz/p_pt/p_mh/p_m2/p_mr）—— 管理号决定子账号能拿哪个价当成本
   注：p_np/p_ny（滞销价格/样机价格）2026-10-10 起已撤出界面，worker 侧键 2026-10-30 同步删除 */
function costOptions(it){
  var o = [];
  // 美的 / 容声那张表是另一套报价：没有清理价，只有拿货价 / 给二批 / 取整
  if (it._md){
    if (pok('p_mh') && isNum(it.mh)) o.push({ v: it.mh, l: '拿货价·慧买卖' });
    if (pok('p_m2') && isNum(it.m2)) o.push({ v: it.m2, l: '给二批价' });
    if (pok('p_mr') && isNum(it.mr)) o.push({ v: it.mr, l: '价格取整' });
    return o;
  }
  // 成本口径：表里同一个型号可能有好几个价，按「清理价 → 全新机价」排，
  // 清理价排前面当默认（卖家多半是按清理价拿的货）。
  // 出库奖励（2026-10-08 二次改版）：**只由点击「出库奖励格」决定** —— 用户拍板
  // 「点了才算，没点不算」，选滞销/样机清理价口径不再自动把奖励算进去。
  if (pok('p_lpz') && ((isNum(it.lpz) && it.lpz > 0) || it.lpz === '送')) o.push({ v: isNum(it.lpz) ? it.lpz : 0, l: '滞销清理价' + (it.lpz === '送' ? '（送）' : '') });
  if (pok('p_spz') && ((isNum(it.spz) && it.spz > 0) || it.spz === '送')) o.push({ v: isNum(it.spz) ? it.spz : 0, l: '样机清理价' + (it.spz === '送' ? '（送）' : '') });
  /* 2026-10-10 用户拍板：价格表（LYDF）只读「价格含税」；滞销价格/样机价格
     两项删掉——滞销/样机一律只认公布版清理价（上面 lpz/spz）。0 元不算价 */
  /* 多货源合并卡：每个货源的含税价各一个成本口径 */
  if (it.srcs && it.srcs.length > 1){
    it.srcs.forEach(function(sc){
      if (pok('p_pt') && isNum(sc.pt) && sc.pt > 0) o.push({ v: sc.pt, l: '价格含税（' + (sc.sfrom || '未标货源') + '）' });
    });
  } else if (pok('p_pt') && isNum(it.pt) && it.pt > 0) o.push({ v: it.pt, l: '价格含税' });
  return o;
}
function calcHTML(it){
  // ⚠ 这一行**每个型号都要有**（用户要求）：一个成本价都没有时也照渲染，

/* 「我的显示开关」chips 渲染（账号管理面板和独立小窗共用）：点一下立即生效并存云端 */
function renderSelfChips(box){
  function draw(){
    var groups = [];
    PERM_DEFS.forEach(function(p){
      if (!groups.length || groups[groups.length - 1].g !== p[2]) groups.push({ g: p[2], items: [] });
      groups[groups.length - 1].items.push(p);
    });
    var h = '';
    groups.forEach(function(gr){
      h += '<div class="pgbox"><h5>' + esc(gr.g) + '</h5><div class="pks">';
      gr.items.forEach(function(p){
        var on = !ADMIN_HIDE[p[0]];
        h += '<span class="pk' + (on ? ' on' : '') + '" data-k="' + p[0]
           + '" title="' + esc(p[3] || '管我自己要不要显示这个（点亮=显示、点灰=隐藏）') + '">' + p[1] + '</span>';
      });
      h += '</div></div>';
    });
    box.innerHTML = h;
    box.querySelectorAll('.pk').forEach(function(c){
      c.addEventListener('click', function(){
        var k = c.dataset.k;
        if (ADMIN_HIDE[k]) delete ADMIN_HIDE[k]; else ADMIN_HIDE[k] = true;
        adminHideSave();
        c.classList.toggle('on');
        applyPermBar();
        run();          // 卡片/侧栏立即重排
      });
    });
  }
  draw();
  return draw;
}

/* 改名同步发布记录（2026-10-14 用户实锤「默认改了名，胶囊还挂着默认」）：
   记录键 = 号名|口径（更老的记录是裸号名），本地 MARKED.xys / ACTXY 一起重映射；
   云端按「写新键 + 删旧键」各推一条 /pub（单条写，记录内容原样搬家——不动价、不动口径、不动ID）。
   目标键撞车时留时间戳新的那条。改完 run() 让胶囊/发布行立刻跟上。 */
function xyRenameSync(oldn, nn){
  if (!oldn || !nn || oldn === nn) return;
  function nk(key){
    if (key === oldn) return nn;
    if (String(key).indexOf(oldn + '|') === 0) return nn + String(key).slice(oldn.length);
    return null;
  }
  var touched = [];                 // [卡, 新键, 旧键]
  Object.keys(MARKED).forEach(function(c){
    var cur = MARKED[c];
    if (!cur) return;
    if (!cur.xys){
      /* 老格式（顶层 {t,k} 无 xys，markXys 合成叫「默认」）：改名的是默认才搬，顺手升成 xys 结构。
         老格式卡只有顶层这一条记录（没有 xys），cur.xys={} 不会覆盖任何已有键，迁移复用安全 */
      if (oldn === '默认' && (cur.k === 'l' || cur.k === 's')){
        cur.xys = {};
        cur.xys[nn] = { t: +cur.t || 0, k: cur.k === 's' ? 's' : 'l', p: (isNum(PRICES[c]) ? PRICES[c] : null) };
        touched.push([c, nn, '默认']);
      }
      return;
    }
    var moved = false;
    Object.keys(cur.xys).forEach(function(key){
      var to = nk(key);
      if (!to || to === key) return;
      if (cur.xys[to] && (+cur.xys[to].t || 0) >= (+cur.xys[key].t || 0)){
        delete cur.xys[key];        // 撞键且已有的更新：旧键直接删
      } else {
        cur.xys[to] = cur.xys[key];
        delete cur.xys[key];
      }
      moved = true;
      touched.push([c, to, key]);
    });
    if (moved && ACTXY[c]){
      var na = nk(ACTXY[c]);
      if (na) ACTXY[c] = na; else delete ACTXY[c];
    }
  });
  if (!touched.length) return;
  saveMarks();
  try { if (localStorage.getItem('ml_lastxy') === oldn) localStorage.setItem('ml_lastxy', nn); } catch(e){}
  /* 展平成单队列：所有「写新键+删旧键」排队走，一次只有一个请求在飞 */
  var _qt = [];
  touched.forEach(function(t){ _qt.push({ c: t[0], on: true, xy: t[1] }, { c: t[0], on: false, xy: t[2] }); });
  pubQueue(_qt);
  refreshXySel();                        // 孤儿条目/旧名条数当场跟上（筛选下拉）
  run();
  updateLossBanner();
}

/* 孤儿号名检测：发布记录里挂着「号列表里没有」的名字（2026-10-14 之前改的名都不同步，
   存量记录全留旧名——比如把「默认」改成了新名，胶囊还挂着默认）。返回 {旧名: 条数} */
function xyOrphans(){
  var names = {};
  xyOptions().forEach(function(x){ names[x] = 1; });
  var cnt = {};
  Object.keys(MARKED).forEach(function(c){
    var cur = MARKED[c];
    if (!cur) return;
    if (!cur.xys){
      if ((cur.k === 'l' || cur.k === 's') && !names['默认']) cnt['默认'] = (cnt['默认'] || 0) + 1;
      return;
    }
    Object.keys(cur.xys).forEach(function(key){
      var nm = String(key).split('|')[0] || String(key);
      if (!names[nm]) cnt[nm] = (cnt[nm] || 0) + 1;
    });
  });
  return cnt;
}

/* 迁移来源统计（2026-10-14 用户「没有迁移功能嘛」）：每个号名（含孤儿名）名下有几条发布记录。
   跟 xyOrphans 不同：不筛「在不在号列表」，列表里的号之间也能互相搬。返回 {名: 条数} */
function xySources(){
  var cnt = {};
  Object.keys(MARKED).forEach(function(c){
    var cur = MARKED[c];
    if (!cur) return;
    if (!cur.xys){
      if (cur.k === 'l' || cur.k === 's') cnt['默认'] = (cnt['默认'] || 0) + 1;
      return;
    }
    Object.keys(cur.xys).forEach(function(key){
      var nm = String(key).split('|')[0] || String(key);
      if (nm) cnt[nm] = (cnt[nm] || 0) + 1;
    });
  });
  return cnt;
}

/* 一键全部取消标记发布（2026-10-14 用户要求）：清空当前登录账号的整份 MARKED，
   定价、闲鱼ID一起没，云端 pub_/pubp_ 逐条整删（worker on=false 连镜像一起清）。
   破坏性大 → 必须输当前账号的登录密码，走 /login 真验证，过了才动第一条。 */
function openUnmarkAll(){
  if (!AUTH || !AUTH.u){ alert('先登录再操作'); return; }
  var cards = Object.keys(MARKED);
  if (!cards.length){ alert('现在没有任何发布记录，不用清'); return; }
  /* 2026-10-14 用户定稿：清空要能按号来，不是只能整个账号清——弹窗里选范围（全部/某个号）。
     号选项带各自条数（xySources），选号后下面统计跟着变 */
  var _src = xySources();
  var _names = Object.keys(_src);
  function countOf(scope){        // scope ''=全部，否则号名
    if (!scope) { var n0 = 0; cards.forEach(function(c){ n0 += markXys(c).length; }); return [cards.length, n0]; }
    var nc = 0, nr = 0;
    cards.forEach(function(c){
      var cur = MARKED[c]; if (!cur) return;
      var hit = 0;
      if (!cur.xys){ if (cur.k === 'l' || cur.k === 's') hit = 1; }
      else Object.keys(cur.xys).forEach(function(key){ if ((String(key).split('|')[0] || key) === scope) hit++; });
      if (hit){ nc++; nr += hit; }
    });
    return [nc, nr];
  }
  var oldm = document.getElementById('unallmask'); if (oldm) oldm.remove();
  var m = document.createElement('div'); m.id = 'unallmask';
  m.style.cssText = 'position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:63;display:flex;align-items:center;justify-content:center';
  m.innerHTML = '<div style="background:#fff;border-radius:12px;padding:18px 20px;box-shadow:var(--shadow);font-size:14px;min-width:380px;max-width:470px">'
    + '<div style="font-weight:700;color:#d92d20;margin-bottom:8px">取消标记发布</div>'
    + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">'
    + '<span style="font-size:13px;color:#5a6478;flex:none">清空哪个号的发布？</span>'
    + '<select id="unallscope" style="flex:1;min-width:0;padding:7px 10px;border:1px solid #d7dce6;border-radius:8px;font-size:13px;background:#fff;outline:0;color:#333">'
    + '<option value="">全部（整个账号）</option>'
    + _names.map(function(n){ return '<option value="' + esc(n) + '">' + esc(n) + '（' + _src[n] + ' 条）</option>'; }).join('')
    + '</select></div>'
    + '<div id="unallstat" style="font-size:13px;color:#5a6478;line-height:1.8;margin-bottom:12px"></div>'
    + '<div style="font-size:13px;color:#b45309;margin-bottom:12px">所选范围的发布记录（含闲鱼ID、定价）会清掉，<b>云端同步删除，不可恢复</b>。确认请输入 <b>' + esc(AUTH.u) + '</b> 的登录密码：</div>'
    + '<input id="unallpw" type="password" placeholder="登录密码" style="width:100%;box-sizing:border-box;border:1px solid #d7dce6;border-radius:8px;padding:8px 10px;font-size:13.5px;margin-bottom:6px">'
    + '<div id="unallerr" style="font-size:12.5px;color:#d92d20;min-height:18px"></div>'
    + '<div style="display:flex;gap:8px;justify-content:flex-end">'
    + '<button class="achip" id="unallno">算了</button>'
    + '<button class="achip" id="unallgo" style="background:#d92d20;border-color:#d92d20;color:#fff">确认取消</button></div></div>';
  document.body.appendChild(m);
  setTimeout(function(){ var _p = m.querySelector('#unallpw'); if (_p) _p.focus(); }, 60);
  function stat(){
    var sc = m.querySelector('#unallscope').value || '';
    var r = countOf(sc);
    m.querySelector('#unallstat').innerHTML = '将清掉 <b>' + r[0] + '</b> 个型号、<b>' + r[1] + '</b> 条发布记录' + (sc ? ('（「' + esc(sc) + '」名下）') : '（整个账号全部）');
  }
  stat();
  m.querySelector('#unallscope').addEventListener('change', stat);
  var busy = false;
  function close(){ m.remove(); }
  m.querySelector('#unallno').addEventListener('click', close);
  function go(){
    if (busy) return;
    var pw = m.querySelector('#unallpw').value;
    if (!pw){ m.querySelector('#unallerr').textContent = '先输入登录密码'; return; }
    busy = true;
    var gob = m.querySelector('#unallgo'); gob.textContent = '验证中…';
    m.querySelector('#unallerr').textContent = '';
    /* ⚠ 显式 Content-Type：WebView2 里 POST 缺它实际请求会静默丢（踩坑实录） */
    authFetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                          body: JSON.stringify({ u: AUTH.u, p: pw }) }, false)
      .then(function(j){
        if (!j || !j.ok){
          busy = false; gob.textContent = '确认取消';
          m.querySelector('#unallerr').textContent = (j && j.msg) || '密码不对，再试试';
          return;
        }
        gob.textContent = '正在清除…';
        /* 密码验证过才到这里：本地逐条清 + 云端逐键删。
           按记录键删（不整条）——老格式裸键「默认」和新键「号名|口径」可能同卡混存，
           整条删会被 worker 的「多条只删一条」分支留尾巴；逐键删最后一条自动整删+清镜像。
           2026-10-14 两改：①按所选号过滤（只删那个号名下的键）；②批量删走 pubQueue
           串行单队列——forEach 并发全是「读旧写新」互相覆盖，迁移丢 16 条的同款病。 */
        var scope = m.querySelector('#unallscope').value || '';
        var _tasks = [], nDel = 0, nCard = 0;
        cards.forEach(function(c){
          var cur = MARKED[c]; if (!cur) return;
          var killAll = !scope;
          var keys = (cur.xys) ? Object.keys(cur.xys) : null;
          if (scope && keys && keys.length){
            /* 选了号：删该号名下的键；删空了整卡清 */
            var mine = keys.filter(function(kk){ return (String(kk).split('|')[0] || kk) === scope; });
            if (!mine.length) return;
            mine.forEach(function(kk){ delete cur.xys[kk]; _tasks.push({ c: c, on: false, xy: kk }); nDel++; });
            if (!Object.keys(cur.xys).length) killAll = true;
            else { nCard++; if (ACTXY[c] && mine.indexOf(ACTXY[c]) >= 0) delete ACTXY[c]; return; }
          }
          if (killAll){
            if (keys && keys.length) keys.forEach(function(kk){ _tasks.push({ c: c, on: false, xy: kk }); nDel++; });
            else _tasks.push({ c: c, on: false, xy: null }), nDel++;
            delete MARKED[c]; delete PRICES[c]; delete ACTXY[c]; nCard++;
          }
        });
        saveMarks(); savePrices();
        pubQueue(_tasks);
        try { localStorage.setItem('ml_lastxy', '默认'); } catch(e){}
        close();
        run(); pubStockWarn(); updateLossBanner();
        netToast('已取消标记发布：' + nCard + ' 个型号 ' + nDel + ' 条记录' + (scope ? ('（「' + scope + '」）') : '') + '——云端逐条排队删除中');
      })
      .catch(function(e){
        busy = false; gob.textContent = '确认取消';
        m.querySelector('#unallerr').textContent = '网络问题：' + e + '（密码没验证过，一条都没动）';
      });
  }
  m.querySelector('#unallgo').addEventListener('click', go);
  m.querySelector('#unallpw').addEventListener('keydown', function(e){ if (e.key === 'Enter') go(); });
}

/* 通用后台任务轮询（2026-10-25）：Mac WKWebView fetch ~60s 超时，长任务一律
   「bg=1 起任务 → 轮询 /api/jobget → done 取 res」。Windows 同步路径保留不受影响。 */
function pollJob(key, onDone, onErr, tick){
  var t0 = Date.now();
  var timer = setInterval(function(){
    fetch('/api/jobget?key=' + encodeURIComponent(key))
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (tick) tick(Math.round((Date.now() - t0) / 1000), j);
        if (!j) return;
        if (j.phase === 'done'){ clearInterval(timer); onDone(j.res || {}); }
        else if (j.phase === 'failed'){ clearInterval(timer); onErr(new Error((j.res && j.res.msg) || j.err || '任务失败')); }
        else if (j.phase === 'idle'){ clearInterval(timer); onErr(new Error('任务不存在（服务端可能重启过）')); }
      })
      .catch(function(){ /* 网络抖动，继续轮询 */ });
  }, 1500);
  return timer;
}

    +   '<button id="sv_force" title="重新生成这 6 张" style="border:1px solid #4a4d55;background:none;color:#c9cdd4;border-radius:6px;padding:3px 10px;font-size:11.5px;cursor:pointer">重新生成</button>'
    +   '<button id="sv_close" style="border:1px solid #4a4d55;background:none;color:#c9cdd4;border-radius:6px;padding:3px 10px;font-size:11.5px;font-weight:600;cursor:pointer">关闭</button>'

    + '<div style="flex:1;overflow:hidden;padding:12px 16px;display:flex"><div id="sv_body" style="max-width:1280px;margin:0 auto;width:100%;display:flex"></div></div>';

    fetch('/api/pubopen', {method: 'POST', headers: {'Content-Type': 'application/json'},

  });
  var LAB = {'1_首图': '首图', '2_机器图': '机器展示', '4_核心参数': '机器参数', '5_尺寸图': '尺寸图'};
  var FILES = [], cur = 0, D = null, genning = false;
  function src(f){
    return '/pubimg/' + encodeURIComponent(k) + '/' + encodeURIComponent('聚光') + '/' + encodeURIComponent(f);
  }
  function lab(f){
    var key = String(f).replace(/\.(jpg|jpeg|png)$/i, '');
    return LAB[key] || key;
  }
  function render(){
    var body = wrap.querySelector('#sv_body');
    var NUMS = ['①', '②', '③', '④'];
    if (cur < 0 || cur >= FILES.length) cur = 0;
    /* 切图重渲染只重建左栏——右栏嵌着的整个写文案页节点（#sv_copy）必须保住，
       砸了就白屏（2026-10-28 用户实锤「一点图右边就变白」） */
    var _cp = body.querySelector('#sv_copy');

      '<div style="flex:0 0 430px;display:flex;flex-direction:column;background:#fff;border-radius:14px;border:1px solid #e8e8e4;overflow:hidden;height:100%">'

          j.groups.forEach(function(g){

                if (f && LAB[String(f).replace(/\.(jpg|jpeg|png)$/i, '')]) FILES.push(f);

    var t = setInterval(function(){

        clearInterval(t);

    }, 900);
  }
  function gen(){
    if (genning){ msg('已在生成中…'); return; }

        if (j.started){

        .then(function(r){ return r.json(); })
        .then(function(j){
          if (!j || !j.ok){ throw new Error((j && j.msg) || '启动失败'); }

            genning = false;
            if (jb.ok){

              msg('生成完成 · AI 后台复检中'); loadLib();

              fetch('/api/pubopen', {method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({model: k, sub: '聚光'})});
            }
            else { msg(''); alert('聚光图生成失败：' + (jb.err || '未知错误')); }
          });
        })
        .catch(function(e){ genning = false; msg(''); alert('聚光图生成失败：' + (e.message || e)); });
    }
  }
  wrap.querySelector('#sv_force').addEventListener('click', function(){ gen(); });
  loadLib(function(){
    if (!FILES.length) gen();

    /* 右栏 = 整个写文案页（顶栏+文案/卖点/自检 tabs），同引擎同接口（2026-10-28 用户令） */

  });
}

/* ---------- 点击价格格：填定价 + 切成本口径 / 开关奖励（2026-10-08 用户方案） ----------
   · 点「滞销价格 / 样机价格 / 价格含税 / 滞销清理价 / 样机清理价 / 拿货价·慧买卖…」：
     闲鱼定价框自动填这个价，成本下拉切到同口径 —— 之后手改定价框，挣仍按这个口径算；
   · 点「滞销/样机出库奖励」：把这笔奖励算进「挣」，再点一次取消（不填定价）；
   · 成本口径已经是「xx清理价」时（奖励已含在 data-bn 里），对应奖励格点了不重复加。 */
function normBasis(s){ return String(s || '').replace(/[\s·]/g, ''); }
function pickCell(cell){
  var card = cell.closest('.card');
  var box = card && card.querySelector('.calc');
  if (!box) return;
  var sel = box.querySelector('.costsel');
  var inp = box.querySelector('input[type=number]:not(.gnum)');
  /* --- 奖励格：只切「算不算这笔奖励」，不动定价框。点了才算，没点不算；
         再点一次取消。任何口径下都可点（不再有「口径已含」限制）。 --- */
  if (cell.dataset.bonus){
    var isLb = cell.dataset.bonus === 'lb';
    var k = isLb ? 'data-bnlb' : 'data-bnsb';
    var _on = !box.getAttribute(k);
    if (!_on){ box.removeAttribute(k); cell.classList.remove('on'); }
    else { box.setAttribute(k, cell.dataset.v || '0'); cell.classList.add('on'); }
    saveBonusSel(box.dataset.key, isLb, cell.dataset.v, _on);   /* 已发布的跟记录走（2026-10-13） */
    calcUpdate(box);
    return;
  }
  /* --- 价格格：成本切到同口径 + 定价框填这个价 --- */
  if (sel){
    var want = normBasis(cell.dataset.basis);
    for (var i = 0; i < sel.options.length; i++){
      if (normBasis(sel.options[i].getAttribute('data-l')) === want){
        sel.selectedIndex = i;
        /* 点格切口径同样要记进口径记忆，别让发布一刷新又跳回去 */
        if (box.dataset.key)
          saveCostSel(box.dataset.key, { l: cell.dataset.basis, v: sel.value });
        break;
      }
    }
  }
  if (inp && isFinite(parseFloat(cell.dataset.v))) inp.value = cell.dataset.v;
  /* 走一遍 input 事件：calcUpdate（挣/平台费草稿预览）挂在那儿，别抄第二份。
     2026-10-14 定稿两段式后点格填的也是草稿——不动记录/胶囊/云端 */
  var _gv = box.dataset.key ? GVALS[box.dataset.key] : null;
  if (inp) inp.dispatchEvent(new Event('input', { bubbles: true }));
  /* dispatch 的 input 会清 GVALS（手改价=放弃挣目标）——点格切口径不算手改，恢复后按挣 X 重算直填 */
  if (_gv != null && box.dataset.key) GVALS[box.dataset.key] = _gv;
  if (_gv != null && parseFloat(_gv) > 0) goalPrice(box);
}

  /* ---- 后台状态轮询（30 秒）----

/* 数据新鲜度（2026-10-31 用户令）：价格/库存时间超过 3 小时标橙 + 「偏旧」，
   免得拉着旧数据按旧价卖（营业时间 8:40~23:40，3 小时足够判定）
   接受 "YYYY-MM-DD HH:MM" 与 "HH:MM" 两种格式 */
function _ageHours(s){
  var t = String(s || '').trim();
  if (!t) return -1;
  var d = null;
  var m = t.match(/(\d{4})-(\d{1,2})-(\d{1,2})\s+(\d{1,2}):(\d{2})/);
  if (m) d = new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]);
  else {
    var m2 = t.match(/(\d{1,2}):(\d{2})/);
    if (m2){
      var now = new Date();
      d = new Date(now.getFullYear(), now.getMonth(), now.getDate(), +m2[1], +m2[2]);
      if (d > now) d.setDate(d.getDate() - 1);
    }
  }
  if (!d || isNaN(d.getTime())) return -1;
  return (Date.now() - d.getTime()) / 3600000;
}

  if (!v) return '<span class="mt">' + label + '：—</span>';
  var h = _ageHours(v), old = h > 3;
  return '<span class="mt">' + label + '：<b' + (old ? ' style="color:#b45309"' : '') + '>' + esc(v) + '</b>'
       + (old ? '<span style="color:#b45309"> 偏旧</span>' : '') + '</span>';

/* ---------- 单条发布记录核账（2026-10-16 连根修）：黄条 lossList 与亏钱筛选 lossSetView
   共用这一套，杜绝口径漂移。按记录自己的价/口径算：样机记录找样机清理价、
   正品/滞销记录找非样机口径（记录里存的 cs 优先，不匹配再按种类取，最后兜底第一项）；
   出库奖励跟口径走（样机算 sb、正品/滞销算 lb）；运费按口径规则 + nat 勾（0=不扣）。
   返回 {cost, cl, bon, fr, net, miss}：net=数字可判亏盈；cost=null 且记过口径 → miss=true（口径没了也提醒） */
function recNet(it, cs, bn, nat, rk, p){
  var opts = it ? costOptions(it) : [];
  var cost = null, cl = '';
  if (rk === 's'){
    for (var j = 0; j < opts.length; j++){
      if (kindOfBasis(opts[j].l) === 's'){ cost = opts[j].v; cl = opts[j].l; break; }
    }
    if (cost == null && cs){
      for (var j2 = 0; j2 < opts.length; j2++){ if (opts[j2].l === cs.l){ cost = opts[j2].v; cl = cs.l; break; } }
    }
  } else {
    if (cs && kindOfBasis(cs.l) !== 's'){
      for (var j3 = 0; j3 < opts.length; j3++){ if (opts[j3].l === cs.l){ cost = opts[j3].v; cl = cs.l; break; } }
    }
    if (cost == null){
      for (var j4 = 0; j4 < opts.length; j4++){ if (kindOfBasis(opts[j4].l) !== 's'){ cost = opts[j4].v; cl = opts[j4].l; break; } }
    }
  }
  if (cost == null && opts.length){ cost = opts[0].v; cl = opts[0].l; }
  var bon = bn ? (rk === 's' ? (+bn.sb || 0) : (+bn.lb || 0)) : 0;
  var _frk = rk === 's' ? 's' : (cs && kindOfBasis(cs.l) === 'l' ? 'l' : null);
  var fr = (it && canNationwide(it, _frk) && nat !== 0) ? 100 : 0;
  var net = (cost != null && isNum(p)) ? p * (1 - 0.016) - fr - cost + bon : null;
  return { cost: cost, cl: cl, bon: bon, fr: fr, net: net, miss: (cost == null && !!cs) };
}
/* ---------- 亏钱哨兵（2026-10-10 用户要求）：发布后表格价格变了要通知我改价 ----------
   口径 = 发布记录 MARKED[k].cs（云端唯一源，2026-10-13 定稿；没记过的老发布按默认第一项核对）。
   每次数据同步/列表渲染都核对一遍：闲鱼定价 < 口径现价 → 顶部黄条；
   选的口径在新表里没了（比如价格含税整列取消）也提醒。点型号跳过去改价。
   2026-10-16（连根修）：核账逻辑抽到 recNet() 与亏钱筛选完全同款，一条不差 */
function lossList(){
  var out = [];
  if (!ALL) return out;
  for (var i = 0; i < ALL.length; i++){
    var it = ALL[i], k = it.c;
    if (!MARKED[k]) continue;
    var cs = MARKED[k].cs;
    var _bn = MARKED[k].bn, _nat = MARKED[k].nat;
    var xs = markXys(k), missPushed = false;
    for (var x = 0; x < xs.length; x++){
      var p = xs[x].p, rk = xs[x].k;           // 这条记录自己的口径（正品l/样机s）
      if (!isNum(p)) continue;
      var r = recNet(it, cs, _bn, _nat, rk, p);
      if (r.net != null){
        /* 保本价（C）：net=0 倒推 p = (运费+成本−奖励)/0.984，向上取整保证不亏 */
        if (r.net < 0) out.push({ c: k, mo: it.mo || k, xy: xs[x].xy, key: xs[x].key, price: p, cost: r.cost, net: r.net, l: r.cl,
                                  be: Math.ceil((r.fr + r.cost - r.bon) / (1 - 0.016)) });
      } else if (r.miss && !missPushed){
        out.push({ c: k, mo: it.mo || k, xy: xs[x].xy, key: xs[x].key, price: p, cost: null, l: r.cl });
        missPushed = true;
      }
    }
  }
  return out;
}

/* 「亏钱」筛选用的判定集（2026-10-10）：看发布记录（自己或别人）时逐条记录核账。
   2026-10-16（B 连根修）：价取**发布记录自己的价**（xs 各号各价，跟黄条 lossList 同源），
   不再看定价表价——定价表跟记录价脱节时（LC-172/CWY16 误报案）筛选跟着记录走；
   核账公式 = recNet()（与黄条一条不差：算出库奖励、按 nat 勾扣运费、口径没了也提醒） */
function lossSetView(){

    }
  }
  return out;
}

/* ---------------- 号价对比 ---------------- */
function openCmpPanel(c){
  /* 管理号且整包还没拉过：先拉 /puball（所有用户+子用户的发布）再画（2026-10-31 用户令：对比的是所有用户的）
     2026-10-31 晚：点下去必须立刻有反应——之前干等 4～18 秒弹窗都不出，用户以为没点上连点好几次。
     现在先秒开一个「正在拉…」的弹窗（有缓存就不弹，直接画），数据回来原地重绘。 */
  if (AUTH && AUTH.role === 'admin' && !(window._SUBPUB && window._SUBPUB.all)){
    if (!pubAllCacheGet()){
      exModal('号价对比 · ' + c, '<div style="padding:16px 0;color:#5b6474">正在拉取所有闲鱼号的发布数据…'
        + '<div style="margin-top:6px;color:#98a2b3;font-size:12px">第一次要几秒；之后 10 分钟内直接秒开。</div></div>');
    }
    fetchPubAll().then(function(){ openCmpDraw(c); });
    return;
  }
  openCmpDraw(c);
}
function openCmpDraw(c){
  var it = exItemOf(c) || {};
  var mk = MARKED[c] || null;
  var rows = [], seen = {};
  function addRows(xys, who){
    if (!xys) return;
    for (var k in xys){
      var e = xys[k] || {};
      var key = String(k) + '|' + (isNum(e.p) ? e.p : '');
      if (seen[key]) continue;
      seen[key] = 1;
      rows.push({ xy: String(k).split('|')[0], kind: (e.k === 's' ? '样机' : '正品'),
                  p: isNum(e.p) ? +e.p : null, t: e.t, xid: e.xid || '', who: who });
    }
  }
  if (mk && mk.xys) addRows(mk.xys, (AUTH && AUTH.u) || '我');
  var _all = (window._SUBPUB && window._SUBPUB.all) || {};
  Object.keys(_all).forEach(function(u){
    var _m = (_all[u] || {})[c];
    if (_m && _m.xys) addRows(_m.xys, u);
  });
  var _sp = (window._SELF_PUB && window._SELF_PUB.all && window._SELF_PUB.all['0']) || {};
  if (_sp[c] && _sp[c].xys) addRows(_sp[c].xys, (AUTH && AUTH.u) || '我');
  if (!rows.length && isNum(PRICES[c])) rows.push({ xy: '默认', kind: '-', p: PRICES[c], t: null });
  var opts = costOptions(it);
  var cost = opts.length ? opts[0].v : null;
  var html = '<div style="color:#8a93a3;font-size:12.5px;margin-bottom:8px">同型号在你 + 全部子用户所有闲鱼号上的定价。成本口径：'
    + (cost != null ? esc(opts[0].l) + ' ' + exMoney(cost) : '没有成本价') + '</div>';
  if (!rows.length){
    html += '<div class="empty" style="padding:16px 0">还没在任何一个号上发布过，没有可比的价格。</div>';
  } else {
    var ps = rows.map(function(r){ return r.p; }).filter(isNum);
    var lo = ps.length ? Math.min.apply(null, ps) : null, hi = ps.length ? Math.max.apply(null, ps) : null;
    html += '<table><tr><th>闲鱼号</th><th>账号</th><th>口径</th><th>定价</th><th>比成本</th><th>差最高</th></tr>';
    rows.sort(function(a, b){ return (a.p || 0) - (b.p || 0); });
    rows.forEach(function(r){
      var g = (isNum(r.p) && isNum(cost)) ? r.p - cost : null;
      html += '<tr><td>' + esc(r.xy || '默认') + '</td><td style="color:#667085;font-size:12px">' + esc(r.who || '—') + '</td><td>' + esc(r.kind) + '</td><td><b>' + exMoney(r.p) + '</b></td>'
        + '<td class="' + (g > 0 ? 'ok' : g < 0 ? 'bad' : '') + '">' + (g == null ? '—' : (g > 0 ? '挣 ' : '亏 ') + money(Math.abs(g))) + '</td>'
        + '<td>' + (isNum(hi) && isNum(r.p) && hi > r.p ? '低 ' + money(hi - r.p) : '—') + '</td></tr>';
    });
    html += '</table>';
    if (isNum(lo) && isNum(hi) && hi > lo){
      html += '<div style="margin-top:10px;font-size:12.5px;color:#c2760a">同型号最高 ' + exMoney(hi) + ' / 最低 ' + exMoney(lo)
        + '，差 ' + money(hi - lo) + ' 元' + ((hi - lo) / lo > 0.15 ? '（超过 15%，买家比价时会看出来）' : '') + '。</div>';
    }
  }
  exModal('号价对比 · ' + c, html);
}

/* ---------------- 打字候选（2026-10-31 晚改版：自绘下拉，对齐搜索框） ----------------
   原生 datalist 弹层宽度跟输入框对不上、样式也管不了——自绘：宽度=输入框，
   正下方弹出，点击填入直接触发搜索。 */
function exDatalist(){
  var inp = document.getElementById('q');
  if (!inp || document.getElementById('qcand')) return;
  var seen = {}, pool = [];
  function add(v){
    if (v && typeof v === "object") v = v.k || v.n || "";   /* BRANDS/CATS 是 {k:名, n:数量}，取名字 */
    v = String(v || "").trim();
    if (!v || v.length > 26 || seen[v]) return;
    seen[v] = 1; pool.push(v);
  }
  (BRANDS || []).forEach(add);
  (CATS || []).forEach(add);
  (ALL || []).slice(0, 400).forEach(function(it){ add(it.mo); });
  var box = document.createElement('div');
  box.id = 'qcand';
  box.hidden = true;
  document.body.appendChild(box);
  var t = null;
  function show(){
    /* 对齐搜索容器（.searchbar 含放大镜图标和 × 按钮，input 本身比容器窄） */
    var anchor = inp.parentElement || inp;
    var r = anchor.getBoundingClientRect();
    box.style.left = r.left + 'px';
    box.style.top = (r.bottom + 5) + 'px';
    box.style.width = r.width + 'px';
    var v = inp.value.trim();
    var list;
    if (!v){
      list = pool.slice(0, 10);                       /* 空着给常用：品牌/品类 */
    } else {
      var vu = v.toUpperCase();
      list = [];
      for (var i = 0; i < pool.length && list.length < 12; i++){
        if (pool[i].toUpperCase().indexOf(vu) >= 0) list.push(pool[i]);
      }
    }
    if (!list.length){ box.hidden = true; return; }
    box.innerHTML = list.map(function(x){
      return '<div class="qci" data-v="' + esc(x) + '">' + esc(x) + '</div>';
    }).join('');
    box.hidden = false;
  }
  function pick(v){
    inp.value = v;
    box.hidden = true;
    inp.dispatchEvent(new Event('input', { bubbles: true }));
    try { inp.dispatchEvent(new Event('change', { bubbles: true })); } catch (e) {}
  }
  inp.removeAttribute('list');                        /* 原生 datalist 下线 */
  inp.addEventListener('input', function(){ clearTimeout(t); t = setTimeout(show, 120); });
  /* 2026-10-31 23:02 用户令：候选列表不许开软件就弹出来（启动时输入框有焦点+残留上次搜索词，
     旧版 focus 即 show → 一开窗就是一坨候选）。现在只有「真的打字」才出，点进去/带着旧词都不弹。 */
  inp.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){ box.hidden = true; return; }
    if (e.key === 'ArrowDown' && !box.hidden){
      var first = box.querySelector('.qci');
      if (first){ e.preventDefault(); pick(first.getAttribute('data-v')); }
    }
  });
  box.addEventListener('mousedown', function(e){
    var it = e.target.closest ? e.target.closest('.qci') : null;
    if (it){ e.preventDefault(); pick(it.getAttribute('data-v')); }
  });
  document.addEventListener('click', function(e){
    if (!box.hidden && e.target !== inp && !(e.target.closest && e.target.closest('#qcand'))) box.hidden = true;
  });
}

  }
  if ((el = q('data-exsetmain'))){
    e.preventDefault();
    var pr = el.getAttribute('data-exsetmain').split('|');
    exPost({ act: 'setmain', m: pr[0], rel: pr.slice(1).join('|') }).then(function(j){
      if (j && j.ok){ toastMsg(j.msg || '主图换了'); openCands(pr[0]); }
      else alert((j && j.msg) || '换不了');
    });
    return;
  }
  if ((el = q('data-extagdel'))){
    e.preventDefault();
    var pp = el.getAttribute('data-extagdel').split('|');
    exPost({ act: 'untag', m: pp[0], tag: pp[1] }).then(function(){ run(); });
    return;
  }
  if ((el = q('data-exundo'))){
    e.preventDefault();
    var uu = el.getAttribute('data-exundo').split('|');
    exUndo(uu[0], uu[1], uu[2]);
    return;
  }
  if ((el = q('data-extsort'))){
    e.preventDefault();
    var kk = el.getAttribute('data-extsort');
    if (TBL.k === kk) TBL.d = -TBL.d; else { TBL.k = kk; TBL.d = 1; }
    exTableRender();
    return;
  }
  if ((el = q('data-exvercopy'))){
    e.preventDefault();
    var vv = el.getAttribute('data-exvercopy').split('|');
    exGet('copylist', '?model=' + encodeURIComponent(vv[1])).then(function(j){
      var lst = (j && j.list) || [];
      for (var i = 0; i < lst.length; i++){
        if (String(lst[i].t) === vv[0]){
          doCopy((lst[i].ti ? lst[i].ti + '\n' : '') + (lst[i].bd || ''), el);
          return;
        }
      }
    });
    return;
  }
  if ((el = q('data-exverdel'))){
    e.preventDefault();
    var dd = el.getAttribute('data-exverdel').split('|');
    exPost({ act: 'copydel', m: dd[1], t: dd[0] }).then(function(){ openVersPanel(dd[1]); });
    return;
  }
  if (e.target && e.target.id === 'extblx'){ TBL = null; run(); return; }
  if ((el = q('data-exrow'))){
    var rc = el.getAttribute('data-exrow');
    TBL = null; run();
    setTimeout(function(){
      var card = document.querySelector('.card[data-key="' + String(rc).replace(/"/g, '\\"') + '"]');
      if (card) card.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }, 120);
    return;
  }
});
document.addEventListener('keydown', function(e){
  /* 应用内快捷键：Ctrl+K 搜型号（随手就敲）、Ctrl+W 托盘（原生层已接）
     2026-10-31 22:03 用户令：表格视图下线，Ctrl+G 一并撤 */
  if (e.ctrlKey && !e.altKey && (e.key === 'k' || e.key === 'K')){
    e.preventDefault(); input.focus(); input.select(); return;
  }
});
function toastMsg(s){
  try {
    var d = document.createElement('div');
    d.textContent = s;
    d.style.cssText = 'position:fixed;left:50%;bottom:42px;transform:translateX(-50%);background:#1b2431;color:#fff;'
      + 'padding:9px 16px;border-radius:10px;font-size:13px;z-index:10000;box-shadow:0 8px 24px rgba(0,0,0,.25)';
    document.body.appendChild(d);
    setTimeout(function(){ d.remove(); }, 1800);
  } catch (e) {}
}

ensureAuth().then(function(){
if (DATA){
  start(DATA);                      // 离线单文件版：数据本来就烤在页面里
} else {
  /* exe 版：页面秒开，数据随后到（实时库存一起取，接口在本地，秒回） */
  /* 2026-10-31 晚实锤：服务端数据是懒加载，开窗瞬间的第一拉可能拿到 rows:0
     （用户截图：型号 0 个、品牌品类全空）——空了隔 2.5 秒重拉，最多 6 次。 */
  function grabData(){
    return fetch(CFG.dataUrl || '/api/data', { cache: 'no-store' })
      .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }
  function grabDataWait(n){
    return grabData().then(function(d){
      if ((!d.rows || !d.rows.length) && n > 0)
        return new Promise(function(res){ setTimeout(res, 2500); })
          .then(function(){ return grabDataWait(n - 1); });
      return d;
    });
  }
  var pStock = fetch('/api/stock', { cache: 'no-store' })
    .then(function(r){ return r.ok ? r.json() : null; })
    .catch(function(){ return null; });
  grabDataWait(6).then(function(d){
    return pStock.then(function(s){
      if (s && s.stock && Object.keys(s.stock).length) STOCKDATA = s;
      start(d);
    });
  }).catch(function(e){
    var el = document.getElementById('list');
    if (el) el.innerHTML = '<div class="empty"><h3>数据没加载上来</h3><p>'
      + esc(String((e && e.message) || e)) + '</p>'
      + '<p>点菜单「数据 → 重新加载」，或者重启软件试试。</p></div>';
  });
}
});
})();
</script>
