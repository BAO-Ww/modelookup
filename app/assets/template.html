<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>型号查询</title>
<style>
:root{
  --bg:#f4f6fa; --card:#fff; --line:#e6eaf2; --line2:#eef1f7;
  --ink:#1b2431; --ink2:#5b6577; --ink3:#98a2b3;
  --brand:#2e6be6; --brand-d:#1b47b8; --brand-l:#eaf1ff;
  --ok:#0f9d58; --ok-l:#e8f6ee; --warn:#c2760a; --warn-l:#fdf3e3;
  --neg:#d64545;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
/* 左侧筛选栏（2026-10 五次改版）：搜索 + 品牌/品类/方式 全部移到左边 */
.side .searchbar{box-shadow:none;padding:0 10px;border-radius:10px}
.side #q{font-size:14px;padding:11px 0}
.side .chips{margin:12px 0 0}
.side .chips .lbl{display:block;width:100%;margin:0 0 2px}
.side .vsep{display:none}
.side .pricebar-in{width:70px}
.side .updbar{margin:12px 0 0}
.mains{flex:1;min-width:0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}

/* ---------- 布局（2026-10 六次改版）----------
   页头整个删掉；侧栏 position:fixed 钉死在最左边、自己滚，
   主区留出 280px 边距。 */
.bodywrap{max-width:none;display:block;padding:10px 16px 40px 276px}
.side{
  position:fixed;left:10px;top:10px;bottom:10px;z-index:30;
  width:250px;overflow-y:auto;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:12px 12px 14px;box-shadow:var(--shadow);
}
.mains{min-width:0}
/* 侧栏底部：更新状态 + 型号数 · 数据时间 */
.sidefoot{margin:14px 0 0;padding-top:10px;border-top:1px dashed var(--line)}
.sidefoot .upnote{font-size:11.5px;color:var(--ink3);display:block;line-height:1.6}
.sidefoot .upnote b{color:var(--ink2)}
.sidefoot .upnote .spin{display:inline-block;width:11px;height:11px;border:2px solid #cfdcf6;
  border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:4px}
.sidecount{font-size:11.5px;color:var(--ink3);margin-top:6px;line-height:1.6}
.sidecount b{color:var(--ink2);font-weight:600}
/* 清理价区间：最低 ~ 最高 横排一行 */
.pricerow{display:flex;gap:6px;align-items:center;width:100%;margin-top:2px}
.pricerow .pricebar-in{flex:1;width:auto;min-width:0}
.pricerow .tilde{color:var(--ink3);font-size:12px;flex:none}

/* ---------- search ---------- */
main{padding:22px 0 60px}
.searchbar{
  display:flex;align-items:center;gap:10px;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:0 14px;
  box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s;
}
.searchbar:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px rgba(46,107,230,.12),var(--shadow)}
.searchbar .ic{flex:none;color:var(--ink3)}
#q{
  flex:1;border:0;outline:0;background:transparent;padding:16px 0;
  font-size:17px;color:var(--ink);font-family:inherit;letter-spacing:.3px;min-width:0;
}
#q::placeholder{color:#b7c0cf;letter-spacing:0;font-size:15px}
.clr{
  border:0;background:#eef1f7;color:var(--ink2);width:26px;height:26px;border-radius:50%;
  cursor:pointer;font-size:15px;line-height:1;flex:none;
}
.clr:hover{background:#e3e8f2}

/* ---------- 筛选条 ----------
   原来是「品牌 / 品类 / 清理方式 / 价格区间」四行 chip，每行还各挂一个蓝色的
   「全部 977」，又长又重复（用户反馈「太乱了」）。现在：
     · 品牌、品类各收成一行，超出 8 个的收进「更多」；
     · 「全部」不再重复挂总数；
     · 价格区间并进「清理方式」那一行；chip 也整体压小了一号。 */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:11px 0 0;align-items:center}
.chips+.chips{margin-top:7px}
.chips .lbl{font-size:11.5px;color:var(--ink3);flex:none;margin-right:3px;letter-spacing:.2px}
.chip{
  border:1px solid var(--line);background:#fff;color:var(--ink2);
  padding:4px 11px;border-radius:999px;font-size:12.5px;cursor:pointer;
  transition:.13s;font-family:inherit;line-height:1.55;
}
.chip:hover{border-color:#c9d6ef;color:var(--brand-d)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.chip.g.on{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
.chip.w.on{background:var(--warn);border-color:var(--warn);color:#fff;font-weight:600}
.chip i{font-style:normal;opacity:.6;font-size:10.5px;margin-left:3px}
/* 「更多 ▾」这种次要按钮 */
.chip.mini{padding:4px 9px;font-size:12px;color:var(--ink3);border-style:dashed}
.chip.mini:hover{color:var(--brand-d);border-style:solid}
.vsep{width:1px;height:16px;background:var(--line);flex:none;margin:0 3px}
.pricebar-in{
  width:84px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12.5px;
  font-variant-numeric:tabular-nums;outline:0;font-family:inherit;background:#fff;
}
.pricebar-in:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(46,107,230,.12)}
.pc{border:0;background:transparent;color:var(--brand);font-size:12.5px;cursor:pointer;
  font-family:inherit;padding:2px 4px}
.pc:hover{color:var(--brand-d);text-decoration:underline;text-underline-offset:3px}

.hint{font-size:12.5px;color:var(--ink3);margin:12px 2px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;line-height:1.9}
.hint b{color:var(--ink2)}
.hint .dot{width:4px;height:4px;border-radius:50%;background:#cfd7e4;flex:none}

/* ---------- 一键更新条（仅通过本地服务打开时显示） ---------- */
.updbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 0;
  background:#fff;border:1px solid #dfe9fb;border-radius:12px;padding:8px 12px;
  box-shadow:0 1px 2px rgba(16,24,40,.03);
}
.updbar .upnote{font-size:12.5px;color:var(--ink3)}
.updbar .upnote b{color:var(--ink2);font-weight:600}
.updbar .spin{display:inline-block;width:12px;height:12px;border:2px solid #cfdcf6;
  border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:5px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- cards ---------- */
.list{display:flex;flex-direction:column;gap:12px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px 18px 14px;box-shadow:0 1px 2px rgba(16,24,40,.03);
  transition:border-color .15s,box-shadow .15s;
}
.card:hover{border-color:#d6e0f0;box-shadow:var(--shadow)}
.card.marked{border-color:#bfe3cd;background:#fcfffd}
.chead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.pimg{
  width:74px;height:74px;object-fit:contain;background:#fff;flex:none;
  border:1px solid var(--line2);border-radius:10px;
}
.pimg.ph{
  display:flex;align-items:center;justify-content:center;position:relative;
  color:#c2ccdc;background:#fafbfd;
}
.addimg{
  position:absolute;inset:auto 0 0 0;
  font:600 11px/1 inherit;color:#2e6be6;background:#eef4ff;
  border:0;border-top:1px solid #dbe6fb;border-radius:0 0 9px 9px;
  padding:5px 0;cursor:pointer;width:100%;
}
.addimg:hover{background:#e2ecff}
.kimgdel{
  position:absolute;top:-6px;right:74px;z-index:2;
  width:17px;height:17px;line-height:15px;padding:0;border-radius:50%;
  font:700 12px/15px inherit;text-align:center;cursor:pointer;
  color:#fff;background:#ef4b4b;border:0;
}
.kimgdel:hover{background:#d63838}
.chead-main{flex:1;min-width:200px}
.moline{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.mo{
  font-size:18px;font-weight:650;letter-spacing:.4px;color:var(--ink);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all;
}
.card.marked .mo{color:#0f7a45}
.pub{
  display:inline-block;font-size:11px;font-weight:700;color:#0f7a45;background:var(--ok-l);
  border:1px solid #c9e8d6;border-radius:6px;padding:2px 8px;margin-top:2px;
}
.acts{margin-left:auto;display:flex;gap:8px;flex:none}
.markbtn,.copy{
  border:1px solid var(--line);background:#fff;color:var(--ink2);
  border-radius:9px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;
  transition:.13s;white-space:nowrap;flex:none;
}
a.markbtn{text-decoration:none}
a.markbtn.web{color:var(--brand);border-color:#d5e2ff;background:var(--brand-l)}
a.markbtn.web:hover{border-color:var(--brand);background:#dde9ff}
.copy:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-l)}
.copy.done{border-color:#bfe3cd;color:var(--ok);background:var(--ok-l)}
.markbtn:hover{border-color:var(--ok);color:var(--ok);background:var(--ok-l)}
.card.marked .markbtn:not(.web){border-color:#c9e8d6;color:#0f7a45;background:var(--ok-l)}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
.tag{
  font-size:11.5px;padding:2px 9px;border-radius:6px;background:#f2f5fa;color:var(--ink2);border:1px solid var(--line2);
}
.tag.b{background:var(--brand-l);color:var(--brand-d);border-color:#d9e4ff;font-weight:600}
.tag.s{background:#f6f1ff;color:#6b46c1;border-color:#e8defc}
.tag.h{background:#fff5ec;color:#b45309;border-color:#fbe0c4;font-weight:600}
.tag.d{background:#f5f6f9;color:#8b95a6;border-color:#e9edf4}
.nm{font-size:13px;color:var(--ink2);margin:7px 0 0;line-height:1.5}

/* 发往范围（原「全国可发」列）——
   · loc   = 深圳/惠州/广州/东莞，**所有型号都能发**，所以它永远在
   · nat-y = 报备后可发全国 / 可发全国（要看地址）
   · nat-q = 要问过才知道（找品类报备确认 / 一单一询是否能发外地）
   · nat-s = 仍是本地口径，但表里写了进货年限之类的门槛备注 */
.pill.loc{background:var(--ok-l);color:#0f7d45;border-color:#c9e8d6}
.pill.nat-y{background:var(--brand-l);color:var(--brand-d);border-color:#d9e4ff}
.pill.nat-q{background:var(--warn-l);color:#a16207;border-color:#f0dcbb}
.pill.nat-s{background:#f5f6f9;color:#7c8698;border-color:#e9edf4}

/* 价格格 */
.prices{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;margin-top:13px}
.pr{background:#fafbfd;border:1px solid var(--line2);border-radius:10px;padding:8px 11px}
.pr span{display:block;font-size:11.5px;color:var(--ink3);margin-bottom:2px}
.pr b{font-size:15.5px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.2px}
.pr.hot{background:var(--brand-l);border-color:#d9e4ff}
.pr.hot b{color:var(--brand-d);font-size:17px}
/* 零售指导价只是「参考原价」，压低一档即可 —— ⚠ 不要加删除线，用户明确要求正常显示 */
.pr.rp{background:#fbfbfc}
.pr.rp b{color:var(--ink2);font-size:15px;font-weight:600}
.pr b i.orig{font-style:normal;font-size:11.5px;font-weight:400;color:var(--ink3);margin-left:3px;text-decoration:line-through}
.pr.bonus b{color:#b45309;font-size:15px}
.pr.qty b{font-size:15px}

.row{display:flex;gap:9px;align-items:baseline;margin-top:9px;font-size:13px;flex-wrap:wrap}
.row>label{flex:none;width:66px;color:var(--ink3);font-size:12px;letter-spacing:.2px}
.row .v{color:var(--ink);font-variant-numeric:tabular-nums}
.pill{
  display:inline-block;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;
  background:#f2f5fa;color:var(--ink2);border:1px solid var(--line2);font-variant-numeric:tabular-nums;
}
.pill.ok{background:var(--ok-l);color:var(--ok);border-color:#c9e8d6}
.pill.no{background:#f5f6f9;color:var(--ink3)}
.pill.mute{background:#f5f6f9;color:var(--ink3)}
.pill.sum{background:#eef4ff;color:#1d4fb8;font-weight:600}
.lnk{
  border:0;background:transparent;color:var(--brand);font-size:12.5px;cursor:pointer;
  padding:2px 4px;font-family:inherit;text-decoration:underline;text-underline-offset:3px;
  text-decoration-color:#bcd0f7;
}
.lnk:hover{color:var(--brand-d)}
/* 仓库明细（现存量10.6）—— 回答「这几台在哪个仓」。
   颜色按仓库类型分：正品仓绿 / 样机仓蓝 / 次品仓红 / 特价·待送橙 / 机壳·虚拟灰。
   仓多了只列前 4 个，鼠标停上去出完整列表（title 里有全部）。 */
.pill.wh{background:#f4f7fc;color:var(--ink2);border-color:#e2e9f4;font-weight:500;font-size:12px;padding:2px 9px}
.pill.wh em{font-style:normal;font-size:10.5px;color:var(--ink3);margin-left:4px}
.pill.wh b{margin-left:5px;font-weight:700;color:var(--ink)}
.pill.wh.ok{background:var(--ok-l);border-color:#c9e8d6}
.pill.wh.ok b{color:#0f7d45}
.pill.wh.sky{background:var(--brand-l);border-color:#d9e4ff}
.pill.wh.sky b{color:var(--brand-d)}
.pill.wh.bad{background:#fef2f2;border-color:#fbd5d5}
.pill.wh.bad b{color:#b42318}
.pill.wh.warn{background:var(--warn-l);border-color:#f0dcbb}
.pill.wh.warn b{color:#a16207}
.pill.wh.mute{background:#f5f6f9;border-color:#e9edf4;color:var(--ink3)}
.pill.whmore{background:#fff;border-style:dashed;color:var(--ink3);font-weight:500;font-size:12px}

/* ---------- 闲鱼定价计算器 ---------- */
.calc{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin-top:12px;background:#f7faff;border:1px solid #dfe9fb;border-radius:10px;padding:9px 12px;
}
.calc .cl{font-size:12px;color:var(--ink3);flex:none}
.calc input{
  width:128px;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:14px;
  font-variant-numeric:tabular-nums;outline:0;font-family:inherit;background:#fff;
}
.calc input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(46,107,230,.12)}
.calc select{
  border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;
  font-family:inherit;background:#fff;color:var(--ink2);outline:0;max-width:190px;
}
.calc .ci{font-size:12px;color:var(--ink3)}
.calc .ci b{color:var(--ink2);font-weight:600;font-variant-numeric:tabular-nums}
.calc .p-out{font-size:14.5px}
.calc .p-out.pos{color:var(--ok)}
.calc .p-out.neg{color:var(--neg)}

.empty{text-align:center;padding:56px 20px;color:var(--ink3)}
.empty svg{opacity:.35;margin-bottom:12px}
.empty h3{margin:0 0 6px;color:var(--ink2);font-size:15px;font-weight:600}
.empty p{margin:0;font-size:13px;line-height:2.1}
.empty code{
  background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px 7px;
  font-size:12.5px;color:var(--brand-d);cursor:pointer;font-family:inherit;
}
.empty code:hover{border-color:var(--brand);background:var(--brand-l)}
.more{text-align:center;padding:22px;color:var(--ink3);font-size:13px}
footer{
  border-top:1px solid var(--line);margin-top:28px;padding:18px 0 0;
  font-size:12px;color:var(--ink3);line-height:1.8;
}
footer a{color:var(--brand);text-decoration:none}
footer a:hover{text-decoration:underline}
@media (max-width:560px){
  .top .wrap{height:auto;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
  .top .meta{margin-left:0;text-align:left;width:100%}
  .mo{font-size:16px}
  .pimg{width:58px;height:58px}
  .prices{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
  .row>label{width:58px}
  .acts{margin-left:0;width:100%}
}
/* ---- 启动骨架（exe 版先出这个，数据到了再换成界面） ---- */
.boot{text-align:center;padding:72px 20px;color:var(--ink3);font-size:13px}
.boot .spin{width:26px;height:26px;margin:0 auto 14px;border:2.5px solid #e6eaf2;border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty .dim{color:var(--ink3);font-size:12.5px;margin-top:8px}
.empty.idle{padding:64px 20px}
/* ---- 全新机报价那一排（和清理价区分开） ---- */
.prices.newp{margin-top:9px}
.prices.newp .pr{background:#f7faff;border-color:#e3ecfb}
.pr.hot2 b{color:#1d4ed8}
.pr.tax b{font-size:15.5px}
.tag.np{background:#eef6ff;color:#1d4ed8;border-color:#d8e7fd;font-weight:600}
/* ---- 新字段的标签 ---- */
.row .vs{display:flex;flex-wrap:wrap;gap:6px}
.pill.ship{background:#f0fbf4;color:#1c7a45;border-color:#cdeedb;font-weight:600}
/* 「外区加100运费」的两种口径 */
.pill.ship-y{background:var(--brand-l);color:var(--brand-d);border-color:#d9e4ff}
.pill.ship-q{background:var(--warn-l);color:#a16207;border-color:#f0dcbb}
.pill.src{background:#f7f8fb;color:var(--ink2)}
.pill.s69{background:#fff8ec;color:#a16207;border-color:#f6e3bd}
.pill.sub{background:#fff3f3;color:#c2410c;border-color:#fbd9cf}
.pill.mono{font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<main>
  <div class="wrap bodywrap">
    <aside class="side" id="side">
      <div class="searchbar">
        <svg class="ic" width="17" height="17" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/>
          <path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <input id="q" placeholder="型号 / 品类：BCD-501… / 冰箱" autocomplete="off" spellcheck="false">
        <button class="clr" id="clr" hidden title="清空">×</button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="chips" id="catchips"></div>
      <div class="chips" id="tools">
        <span class="lbl">方式</span>
        <button class="chip" data-kind="">全部</button>
        <button class="chip" data-kind="l">滞销清理<i id="kc-l">0</i></button>
        <button class="chip" data-kind="s">样机清理<i id="kc-s">0</i></button>
        <span class="vsep"></span>
        <button class="chip g" data-flag="stock">只看有货</button>
        <button class="chip w" data-flag="send">只看能发外区</button>
        <button class="chip g" data-flag="hide">只看未发布</button>
        <span class="vsep"></span>
        <span class="lbl" title="按该型号最低清理价（美的系按拿货价）筛选">清理价</span>
        <div class="pricerow">
          <input class="pricebar-in" id="pmin" type="number" min="0" step="1" inputmode="decimal" placeholder="最低">
          <span class="tilde">~</span>
          <input class="pricebar-in" id="pmax" type="number" min="0" step="1" inputmode="decimal" placeholder="最高">
          <button class="pc" id="pclear" hidden>清除</button>
        </div>
      </div>
      <div class="updbar" id="updbar" hidden style="display:none">
        <!-- 四个操作按钮已移到窗口顶部菜单栏（帮助前）；这里只留隐藏按钮给菜单触发用 -->
        <button class="chip" id="updbtn">↻ 从金山文档更新数据</button>
        <button class="chip" id="stkbtn" title="从用友 YonSuite 拉实时现存量（登录一次，之后一键更新）">⟳ 更新实时库存（用友）</button>
        <button class="chip" id="expimg" title="把你自己补的图导出成一个 json 文件（发给我，下次重建直接烤进页面）">导出我补的图</button>
        <button class="chip" id="impimg" title="导入之前导出的 补图.json">导入补图</button>
      </div>
      <input type="file" id="imgfile" accept="image/*" style="display:none">
      <input type="file" id="jsonfile" accept=".json,application/json" style="display:none">
      <div class="sidefoot">
        <span class="upnote" id="updmsg"></span>
        <div class="sidecount" id="meta"></div>
      </div>
    </aside>

    <div class="mains">
      <div class="hint" id="hint"></div>
      <div class="boot" id="boot" hidden><div class="spin"></div><p>正在读取数据…</p></div>
      <div class="list" id="list"></div>

    </div>
  </div>
</main>

<script>
(function(){
"use strict";
/* 数据怎么来，有两种：
   ① 离线单文件版：数据直接烤死在 <script id="payload"> 里（DATA 有值），双击即用；
   ② exe 版：页面自己只有几十 KB —— 先秒开窗口显示骨架，再去 /api/data 取数据。
      图片也不塞进页面，改成按需向 /img/<型号> 要（真正懒加载，用得着才解码）。
   DATA / CFG 都是构建时注入的。 */
var DATA = /*__DATA__*/null;
/* CFG 不用注入，按「数据有没有内联」自己判断：
   内联 = 离线单文件版（图片也是 dataURL）；
   没内联 = exe 版，数据和图片都走本地 HTTP（页面才几十 KB，窗口秒开）。 */
var CFG  = DATA
  ? { fetch: false, imgBase: '',      dataUrl: '' }
  : { fetch: true,  imgBase: '/img/', dataUrl: '/api/data' };
var META = {}, ALL = [], IMGS = {}, IMGHAS = null;
var FEE  = 0.016;                // 闲鱼平台费率 1.6%
/* 实时库存（exe 版从用友 YonSuite 拉的现存量，点「更新实时库存」刷新）：
   STOCK = { 型号norm: { q:现存量, a:可用量, wt:{仓库类型:可用量} } }，键与 norm() 同一套归一 */
var STOCKDATA = null;
function stockOf(mo){
  var s = STOCKDATA && STOCKDATA.stock;
  return s ? (s[norm(mo)] || null) : null;
}

/* ================= 本地存储 ================= */
var MARK_KEY = 'xy2-published';
var HIDE_KEY = 'xy2-hidemarked';
var PRICE_KEY = 'xy2-prices';
var IMG_KEY = 'xy2-imgs';
function load(k, d){ try { var v = JSON.parse(localStorage.getItem(k)); return v && typeof v === 'object' ? v : d; } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
var MARKED = load(MARK_KEY, {});
var PRICES = load(PRICE_KEY, {});
var MYIMGS = load(IMG_KEY, {});
/* 换数据源（本地价格表 → 金山文档在线表）之前的旧记录也认：新版 key 还空着就搬过来 */
(function(){
  var pairs = [[MARK_KEY, 'xy-published-v1', function(v){ MARKED = v; save(MARK_KEY, v); }],
               [PRICE_KEY, 'xy-prices-v1',    function(v){ PRICES = v; save(PRICE_KEY, v); }],
               [IMG_KEY,   'xy-imgs-v1',      function(v){ MYIMGS = v; save(IMG_KEY, v); }]];
  for (var i = 0; i < pairs.length; i++){
    var cur = load(pairs[i][0], {});
    if (Object.keys(cur).length) continue;
    var old = load(pairs[i][1], {});
    if (Object.keys(old).length) pairs[i][2](old);
  }
})();
function saveMarks(){ save(MARK_KEY, MARKED); }
/* ---------- 发布记录云端化（跟账号走，换电脑登录也在） ----------
   KV 存 pub_<账号>；登录后整包合并一次，之后每标记/取消一条即时推一条。 */
function pubPush(c, on){
  if (!AUTH || !AUTH.token) return;
  /* ⚠ 必须显式带 Content-Type: application/json —— WebView2 里 string body 缺它时
     预检 OPTIONS 发得出去、实际 POST 却不跟，记录就静默丢了（实测踩坑） */
  authFetch('/pub', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({ c: c, on: on }) }, true);
}
function syncMarks(){
  if (!AUTH || !AUTH.token) return;
  authFetch('/pubsync', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                          body: JSON.stringify({ marks: MARKED }) }, true)
    .then(function(j){
      if (j && j.ok && j.marks){
        var changed = JSON.stringify(MARKED) !== JSON.stringify(j.marks);
        MARKED = j.marks; saveMarks();
        if (changed) run();
      }
    });
}
function savePrices(){ save(PRICE_KEY, PRICES); }
function saveMyImgs(){ save(IMG_KEY, MYIMGS); }
var hideMarked = false;
try { hideMarked = localStorage.getItem(HIDE_KEY) === '1'; } catch(e){}

function imgOf(core){
  if (MYIMGS[core]) return MYIMGS[core];            // 自己补的图优先
  if (IMGS[core]) return IMGS[core];                // 内联的 dataURL（离线版）
  // exe 版：图片不内联，交给浏览器按需取，看得见才解码
  if (CFG.imgBase && IMGHAS && IMGHAS[core]) return CFG.imgBase + encodeURIComponent(core);
  return null;
}
function missCount(){
  var seen = {}, n = 0;
  for (var i = 0; i < ALL.length; i++){
    var c = ALL[i].c;
    if (seen[c]) continue;
    seen[c] = 1;
    if (!imgOf(c)) n++;
  }
  return n;
}

/* ================= 补图 ================= */
function pickImage(core){
  var fi = document.getElementById('imgfile');
  fi.value = '';
  fi.onchange = function(){
    var f = fi.files && fi.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function(){
      var im = new Image();
      im.onload = function(){
        var w = im.width, h = im.height, s = Math.min(1, 240 / Math.max(w, h));
        var cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(w * s)); cv.height = Math.max(1, Math.round(h * s));
        var cx = cv.getContext('2d');
        cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);   // 透明图补白底
        cx.drawImage(im, 0, 0, cv.width, cv.height);
        MYIMGS[core] = cv.toDataURL('image/jpeg', 0.72);
        saveMyImgs();
        run();
      };
      im.onerror = function(){ alert('这张图读不出来，换一张试试'); };
      im.src = fr.result;
    };
    fr.readAsDataURL(f);
  };
  fi.click();
}
function exportMyImgs(){
  var keys = Object.keys(MYIMGS);
  if (!keys.length){ alert('你还没有补过图。在缺图的卡片上点「＋ 补图」先补几张吧。'); return; }
  var blob = new Blob([JSON.stringify(MYIMGS)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '补图.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
}
function importMyImgs(){
  var fi = document.getElementById('jsonfile');
  fi.value = '';
  fi.onchange = function(){
    var f = fi.files && fi.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function(){
      var n = 0;
      try {
        var o = JSON.parse(fr.result);
        for (var k in o) if (typeof o[k] === 'string' && o[k].indexOf('data:image/') === 0){ MYIMGS[k] = o[k]; n++; }
      } catch(e){ alert('这个文件不是有效的补图.json'); return; }
      saveMyImgs(); run();
      alert('导入成功：' + n + ' 张');
    };
    fr.readAsText(f);
  };
  fi.click();
}

/* ================= 归一化（与 build.py 严格一致） ================= */
function half(s){
  return String(s == null ? '' : s)
    .replace(/[\uFF01-\uFF5E]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
    .replace(/\u3000/g, ' ');
}
function norm(s){ return half(s).replace(/\s+/g, '').toUpperCase(); }
function coreOf(s){
  var n = norm(s);
  var m = n.match(/[\u4e00-\u9fff]/);
  if (m && m.index >= 3) return n.slice(0, m.index).replace(/[()\-_/+.,、，]+$/, '');
  return n;
}
function coreOf2(s){
  var parts = norm(s).split(/[^0-9A-Z\/*\-+.]+/).filter(function(x){ return x.length >= 3; });
  if (!parts.length) return '';
  parts.sort(function(a,b){ return b.length - a.length; });
  return parts[0];
}

/* ================= 品类归一化 ================= */
var RE_KITCHEN = /油烟|燃气灶|煤气灶|灶具|洗碗|消毒柜|蒸箱|蒸烤|烤箱|小厨宝|电磁灶|电磁炉|微波炉|集成灶|厨房|厨电/;
var RE_SMALL = /电饭煲|压力锅|破壁机|空气炸|电水壶|电火锅|电饼铛|绞肉|料理机|榨汁|豆浆|风扇|吸尘|洗地|生活家电|小家电|除湿|加湿|暖风|电暖|门锁|晾衣|晾晒/;
function catGroup(v){
  var t = norm(v);
  if (!t) return '其他';
  if (t.indexOf('空调') >= 0 || t === '风管机' || t === '小风管' || t === '柜嵌' || t.indexOf('热泵') >= 0 || t.indexOf('家中机') >= 0) return '空调';
  if (t.indexOf('冰箱') >= 0) return '冰箱';
  if (t.indexOf('冷柜') >= 0 || t.indexOf('冰柜') >= 0) return '冷柜';
  if (t.indexOf('洗衣') >= 0) return '洗衣机';
  if (t.indexOf('热水') >= 0) return '热水器';
  if (t.indexOf('净水') >= 0 || t.indexOf('净饮') >= 0 || t.indexOf('饮水') >= 0) return '净水';
  if (t.indexOf('电视') >= 0 || t.indexOf('彩电') >= 0) return '电视';
  if (RE_KITCHEN.test(t)) return '厨电';
  if (RE_SMALL.test(t)) return '小家电';
  return '其他';
}

/* ================= 建索引（数据到位后才跑） ================= */
var UID = {}, BRANDS = [], CATS = [];
function buildIndex(){
  var i, r;
  UID = {};
  for (i = 0; i < ALL.length; i++){
    r = ALL[i];
    r._n  = norm(r.mo);
    r._c2 = coreOf2(r.mo);
    r._cg = catGroup(r.cat);
    r._h  = norm([r.cat, r.b, r.n, r.code, r.st, r.note].join(' '));
    // 美的 / 容声那张表是另一套报价（拿货价·慧买卖 / 给二批 / 价格取整），
    // 卡片和计算器要跟着换口径 —— 用这三个字段当标记
    r._md = isNum(r.mh) || isNum(r.m2) || isNum(r.mr);
    r._uid = i;
    UID[i] = r;
  }
  var mb = {}, mc = {};
  ALL.forEach(function(it){
    if (it.b) mb[it.b] = (mb[it.b] || 0) + 1;
    if (it._cg) mc[it._cg] = (mc[it._cg] || 0) + 1;
  });
  BRANDS = Object.keys(mb).map(function(k){ return { k: k, n: mb[k] }; })
    .sort(function(a,b){ return b.n - a.n; });
  CATS = Object.keys(mc).map(function(k){ return { k: k, n: mc[k] }; })
    .sort(function(a,b){ return b.n - a.n; });
}

function brandOf(it){ return it.b || ''; }
function nameOf(it){ return it.n || ''; }

var curBrand = '', curCat = '', curKind = '', flagStock = false, flagSend = false;

/* ================= 格式化 ================= */
function isNum(v){ return typeof v === 'number' && isFinite(v); }
function money(v){
  if (v == null) return '';
  if (!isNum(v)) return String(v);
  return '¥' + v.toLocaleString('zh-CN', { maximumFractionDigits: 2 });
}
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function round2(x){ return Math.round(x * 100) / 100; }
function prCell(label, v, cls){
  if (v == null || v === '') return '';
  return '<div class="pr' + (cls ? ' ' + cls : '') + '"><span>' + label + '</span><b>' + esc(money(v)) + '</b></div>';
}

/* 该型号最低清理价（用于价格区间筛选与计算器默认成本）
   美的 / 容声没有「清理价」，用「拿货价 · 慧买卖」当基准，别让它们被价格区间筛掉 */
function lowPrice(it){
  var a = isNum(it.lpz) ? it.lpz : null, b = isNum(it.spz) ? it.spz : null;
  if (a != null && b != null) return Math.min(a, b);
  var v = (a != null ? a : b);
  if (v != null) return v;
  return isNum(it.mh) ? it.mh : null;
}

/* ================= 闲鱼定价计算器 =================
   成本下拉逐项受权限控制（p_lpz/p_spz/p_np/p_ny/p_pt）—— 管理号决定子账号能拿哪个价当成本 */
function costOptions(it){
  var o = [];
  // 美的 / 容声那张表是另一套报价：没有清理价，只有拿货价 / 给二批 / 取整
  if (it._md){
    if (pok('p_mh') && isNum(it.mh)) o.push({ v: it.mh, l: '拿货价·慧买卖' });
    if (pok('p_m2') && isNum(it.m2)) o.push({ v: it.m2, l: '给二批价' });
    if (pok('p_mr') && isNum(it.mr)) o.push({ v: it.mr, l: '价格取整' });
    return o;
  }
  // 成本口径：表里同一个型号可能有好几个价，按「清理价 → 全新机价」排，
  // 清理价排前面当默认（卖家多半是按清理价拿的货）
  if (pok('p_lpz') && isNum(it.lpz)) o.push({ v: it.lpz, l: '滞销清理价' });
  if (pok('p_spz') && isNum(it.spz)) o.push({ v: it.spz, l: '样机清理价' });
  if (pok('p_np')  && isNum(it.npz)) o.push({ v: it.npz, l: '滞销价格' });
  if (pok('p_ny')  && isNum(it.nyz)) o.push({ v: it.nyz, l: '样机价格' });
  if (pok('p_pt')  && isNum(it.pt))  o.push({ v: it.pt,  l: '价格含税' });
  return o;
}
function calcHTML(it){
  // ⚠ 这一行**每个型号都要有**（用户要求）：一个成本价都没有时也照渲染，
  //    只是成本那栏写「无成本价」，输定价进去「挣」显示 —（总比整行不见了强）
  var opts = costOptions(it);
  var saved = PRICES[it.c];
  var pick = opts.length ? opts[0] : { v: '', l: '无成本价' };
  var sel;
  if (opts.length > 1){
    sel = '<select class="costsel">' + opts.map(function(o){
      return '<option value="' + o.v + '" data-l="' + esc(o.l) + '"' + (o.v === pick.v ? ' selected' : '') + '>' + esc(o.l) + ' ' + esc(money(o.v)) + '</option>';
    }).join('') + '</select>';
  } else if (opts.length === 1){
    sel = '<select class="costsel" style="pointer-events:none;border-color:transparent;background:transparent;padding-left:0;font-weight:600;color:#1b2431"><option value="' + pick.v + '" data-l="' + esc(pick.l) + '">' + esc(pick.l) + ' ' + esc(money(pick.v)) + '</option></select>';
  } else {
    sel = '<select class="costsel" style="pointer-events:none;border-color:transparent;background:transparent;padding-left:0;color:#98a2b3"><option value="" data-l="无成本价">表里没有成本价</option></select>';
  }
  return '<div class="calc" data-key="' + esc(it.c) + '">'
    + '<span class="cl">闲鱼定价</span>'
    + '<input type="number" min="0" step="1" inputmode="decimal" placeholder="输入你的定价"'
    + (isNum(saved) ? ' value="' + saved + '"' : '') + '>'
    + sel
    + '<span class="ci">平台费1.6% <b class="p-fee">—</b></span>'
    + '<span class="ci">挣 <b class="p-out">—</b></span>'
    + '</div>';
}
function calcUpdate(box){
  var inp = box.querySelector('input');
  var sel = box.querySelector('.costsel');
  var cost = parseFloat(sel.value);
  var price = parseFloat(inp.value);
  var feeEl = box.querySelector('.p-fee'), outEl = box.querySelector('.p-out');
  if (!isFinite(price) || price <= 0 || !isFinite(cost)){
    feeEl.textContent = '—'; outEl.textContent = '—'; outEl.className = 'p-out'; return;
  }
  var fee = round2(price * FEE), profit = round2(price - price * FEE - cost);
  feeEl.textContent = money(fee);
  outEl.textContent = (profit >= 0 ? '+' : '−') + money(Math.abs(profit));
  outEl.className = 'p-out ' + (profit >= 0 ? 'pos' : 'neg');
}

/* ================= 账号权限（云端 · Cloudflare Worker） =================
   管理号 + 子账号。启动时校验 token（30 天有效），按权限隐藏内容。
   权限由管理号在「账号管理」里逐项勾选。 */
var AUTH = null;
try { AUTH = JSON.parse(localStorage.getItem('ml_auth') || 'null'); } catch(e){ AUTH = null; }
/* workers.dev 在国内被墙，必须 kdns 在前 —— 否则登录/启动都要干等它超时 */
var AUTH_HOSTS = ['https://auth.baozang.kdns.fr',
                  'https://modelookup-auth.bao3053.workers.dev'];
/* 权限逐项化（2026-10 五次改版）：价格格 / 计算器成本下拉 / 按钮 全部拆开，
   管理号在「账号管理」里逐个勾。第三列是分组（管理面板里分组显示）。 */
var PERM_DEFS = [
  ['live',        '库存明细行（各仓）',        '基础'],
  ['sum',         '汇总行（正品/样机/次品仓）', '基础'],
  ['subsidy',     '补贴栏',                  '基础'],
  ['xianyu',      '闲鱼行（ID/价/利润）',      '基础'],
  ['calc',        '闲鱼定价 / 已发布 / 复制',  '基础'],
  ['supplier',    '发货 / 货源',              '基础'],
  ['nat',         '发往（可发区域）',          '基础'],
  ['code',        '物料编码行',              '基础'],
  ['p_mh',        '拿货价·慧买卖',            '价格格'],
  ['p_m2',        '给二批价',                 '价格格'],
  ['p_mr',        '价格取整',                 '价格格'],
  ['p_pt',        '价格含税',                '价格格'],
  ['p_np',        '滞销价格',                '价格格'],
  ['p_ny',        '样机价格',                '价格格'],
  ['p_lpz',       '滞销清理价',              '价格格'],
  ['p_spz',       '样机清理价',              '价格格'],
  ['p_lp',        '零售指导价',              '价格格'],
  ['p_mp',        '官网价',                  '价格格'],
  ['p_jd',        '京东价 / 国补后',          '价格格'],
  ['p_lb',        '滞销出库奖励',            '价格格'],
  ['p_sb',        '样机出库奖励',            '价格格'],
  ['p_qty',       '清理数量',                '价格格'],
  ['upd_kdocs',   '按钮：金山更新',           '按钮'],
  ['upd_yy',      '按钮：用友更新',           '按钮'],
  ['addimg',      '补图 / 导出比价图',        '按钮'],
];
function authSave(){ try { localStorage.setItem('ml_auth', JSON.stringify(AUTH)); } catch(e){} }
function pok(k){
  if (!AUTH) return false;
  if (AUTH.role === 'admin') return true;
  return !!AUTH.perm[k];
}
/* 带 X-Token 的云端请求；网络不通时 _st=0，会自动换备用域名试一轮 */
function authFetch(path, opts, withRetry){
  opts = opts || {};
  opts.headers = opts.headers || {};
  if (AUTH && AUTH.token) opts.headers['X-Token'] = AUTH.token;
  var hosts = [localStorage.getItem('ml_auth_host') || AUTH_HOSTS[0]];
  if (withRetry !== false) AUTH_HOSTS.forEach(function(h){ if (hosts.indexOf(h) < 0) hosts.push(h); });
  function tryOne(i){
    if (i >= hosts.length){
      return Promise.resolve({ ok: false, _st: 0, msg: '网络不通' });
    }
    return fetch(hosts[i] + path, opts).then(function(r){
      localStorage.setItem('ml_auth_host', hosts[i]);
      return r.json().then(function(j){ j._st = r.status; return j; });
    }).catch(function(){ return tryOne(i + 1); });
  }
  return tryOne(0);
}

function ensureStyles(){
  if (document.getElementById('authcss')) return;
  var st = document.createElement('style'); st.id = 'authcss'; st.textContent = AUTH_CSS;
  document.head.appendChild(st);
}
function ensureAuth(){
  ensureStyles();
  return new Promise(function(resolve){
    function finish(){ resolve(); }
    function showLogin(){
      var old = document.getElementById('authmask'); if (old) old.remove();
      var m = document.createElement('div'); m.id = 'authmask';
      var rem = null; try { rem = JSON.parse(localStorage.getItem('ml_remember') || 'null'); } catch(e){ rem = null; }
      m.innerHTML = '<div class="acard"><h3>型号查询 · 登录</h3>'
        + '<div class="sub">没有账号请联系管理员开通</div>'
        + '<input id="au" placeholder="账号" autocomplete="username"' + (rem && rem.u ? ' value="' + esc(rem.u) + '"' : '') + '>'
        + '<input id="ap" type="password" placeholder="密码" autocomplete="current-password"' + (rem && rem.p ? ' value="' + esc(rem.p) + '"' : '') + '>'
        + '<label class="arem"><input type="checkbox" id="arem"' + (rem ? ' checked' : '') + '> 记住账号和密码</label>'
        + '<button class="go" id="ago">登 录</button>'
        + '<div class="aerr" id="aerr"></div></div>';
      document.body.appendChild(m);
      // 记住了密码只把账号密码填进框里，登录按钮仍要自己点（用户要求不自动登录）
      function submit(){
        var u = m.querySelector('#au').value.trim(), p = m.querySelector('#ap').value;
        if (!u || !p){ m.querySelector('#aerr').textContent = '账号和密码都要填'; return; }
        var go = m.querySelector('#ago');
        go.disabled = true; go.classList.add('loading'); go.textContent = '登录中…';
        m.querySelector('#aerr').textContent = '';
        var tried = 0;
        function doLogin(){
          return authFetch('/login', { method: 'POST', body: JSON.stringify({ u: u, p: p }) }, false)
            .then(function(j){
              if (j && j._st === 0 && !j.ok && tried < AUTH_HOSTS.length - 1){
                tried++;
                var alt = AUTH_HOSTS.filter(function(h){
                  return h !== (localStorage.getItem('ml_auth_host') || '');
                });
                if (alt.length){ localStorage.setItem('ml_auth_host', alt[0]); return doLogin(); }
              }
              return j;
            });
        }
        doLogin().then(function(j){
            if (j && j.ok){
              try {
                if (m.querySelector('#arem').checked) localStorage.setItem('ml_remember', JSON.stringify({ u: u, p: p }));
                else localStorage.removeItem('ml_remember');
              } catch(e){}
              AUTH = { u: j.u, token: j.token, role: j.role, perm: j.perm || {} };
              authSave();
              m.remove(); afterAuth(); finish();
            } else {
              go.disabled = false; go.classList.remove('loading'); go.textContent = '登 录';
              m.querySelector('#aerr').textContent = (j && j.msg) || '登录失败，请重试';
            }
          });
      }
      m.querySelector('#ago').addEventListener('click', submit);
      m.querySelector('#ap').addEventListener('keydown', function(e){ if (e.key === 'Enter') submit(); });
    }
    if (!AUTH){ showLogin(); return; }
    authFetch('/perm').then(function(j){
      if (j && j.ok){
        AUTH.role = j.role; AUTH.perm = j.perm || {}; authSave();
        afterAuth(); finish();
      } else if (j && j._st === 0){
        afterAuth(); finish();       // 云端连不上：先用缓存的权限顶着
      } else {                       // 401 / 停用
        AUTH = null; authSave(); showLogin();
      }
    });
  });
}
function afterAuth(){
  // 把权限表报给本地服务（exe 版原生菜单点按时校验用；单文件版没有本地服务，静默失败即可）
  try {
    fetch('/api/perm', { method: 'POST', body: JSON.stringify(
      { u: AUTH.u, role: AUTH.role, perm: AUTH.perm || {} }) });
  } catch(e){}
  syncMarks();   // 发布记录并到云端（本地旧记录也会被合并上去）
  var bar = document.getElementById('updbar');
  if (!bar) return;
  if (document.getElementById('whoami')) return;
  var chip = document.createElement('button');
  chip.className = 'chip'; chip.id = 'whoami';
  chip.textContent = '👤 ' + AUTH.u + (AUTH.role === 'admin' ? '（管理）' : '') + ' · 退出';
  chip.addEventListener('click', function(){
    AUTH = null; authSave(); localStorage.removeItem('ml_auth_host'); location.reload();
  });
  bar.appendChild(chip);
  // 账号管理：管理员开全量面板；子账号开「改自己密码」小面板（菜单栏里两个角色都有这项）
  var ab = document.createElement('button');
  ab.className = 'chip'; ab.id = 'admbtn'; ab.textContent = '👥 账号管理';
  ab.addEventListener('click', AUTH.role === 'admin' ? openAdmin : openSelf);
  bar.appendChild(ab);
  applyPermBar();
}
function applyPermBar(){
  var b = document.getElementById('updbtn'), s = document.getElementById('stkbtn');
  if (b) b.hidden = !pok('upd_kdocs');
  if (s) s.hidden = !pok('upd_yy');
}

function openAdmin(){
  var old = document.getElementById('adminmask'); if (old) old.remove();
  var m = document.createElement('div'); m.id = 'adminmask';
  m.innerHTML = '<div class="amodal"><h3>账号管理 <button class="achip" id="aclose" style="float:right">关闭</button></h3>'
    + '<div id="alist">加载中…</div>'

    + '<button class="achip" id="aadd">＋ 新增子账号</button>'
    + '<button class="achip" id="asave" style="background:#2e6be6;color:#fff;border-color:#2e6be6">保存全部</button>'
    + '<button class="achip" id="apubs" title="看每个账号发布过哪些型号（云端记录，跟账号走）">📋 发布记录</button>'
    + '</div></div>';
  document.body.appendChild(m);
  m.querySelector('#aclose').addEventListener('click', function(){ m.remove(); });
  m.querySelector('#apubs').addEventListener('click', function(){ openPubAll(m); });
  m.querySelector('#aadd').addEventListener('click', function(){
    m.querySelector('#alist').appendChild(userRow({ u: '', note: '', disabled: false, hasPw: false, perm: {} }, true));
  });
  m.querySelector('#asave').addEventListener('click', function(){
    var users = [];
    m.querySelectorAll('.auser').forEach(function(row){
      var perm = {};
      row.querySelectorAll('.pk.on').forEach(function(c){ perm[c.dataset.k] = true; });
      users.push({
        u: row.querySelector('.uname').value.trim(),
        note: row.querySelector('.unote').value.trim(),
        pw: row.querySelector('.upw').value,
        disabled: row.querySelector('.adis').checked,
        perm: perm
      });
    });
    m.querySelector('#asave').disabled = true; m.querySelector('#asave').textContent = '保存中…';
    authFetch('/admin/save', { method: 'POST', body: JSON.stringify({ users: users }) }).then(function(j){
      m.querySelector('#asave').disabled = false; m.querySelector('#asave').textContent = '保存全部';
      m.querySelector('#asave').textContent = (j && j.ok) ? '✅ 已保存' : ('❌ ' + ((j && j.msg) || '失败'));
      setTimeout(function(){ m.querySelector('#asave').textContent = '保存全部'; }, 1800);
      if (j && j.ok) loadAdminList(m);
    });
  });
  loadAdminList(m);
}
function userRow(x, isNew){
  var d = document.createElement('div'); d.className = 'auser';
  var chips = '', lastG = '';
  PERM_DEFS.forEach(function(p){
    if (p[2] && p[2] !== lastG){
      lastG = p[2];
      chips += '<span class="pgroup">' + esc(lastG) + '</span>';
    }
    var on = x.perm && x.perm[p[0]];
    chips += '<span class="pk' + (on ? ' on' : '') + '" data-k="' + p[0] + '" title="' + p[1] + '">' + p[1] + '</span>';
  });
  d.innerHTML = '<div class="arow">'
    + '<input type="text" class="uname" placeholder="账号" value="' + esc(x.u) + '"' + (isNew ? '' : ' readonly') + '>'
    + '<input type="text" class="unote" placeholder="备注（如：小王）" value="' + esc(x.note) + '">'
    + '<input type="password" class="upw" placeholder="' + (isNew || !x.hasPw ? '设密码' : '改密码（留空不动）') + '">'
    + '<label style="font-size:12.5px;color:#7b8494"><input type="checkbox" class="adis"' + (x.disabled ? ' checked' : '') + '> 停用</label>'
    + (x.hasPw && !isNew ? '' : '<span style="font-size:11.5px;color:#d92d20">新号</span>')
    + '</div><div class="permchips">' + chips + '</div>';
  d.querySelectorAll('.pk').forEach(function(c){
    c.addEventListener('click', function(){ c.classList.toggle('on'); });
  });
  return d;
}
function loadAdminList(m){
  authFetch('/admin/list').then(function(j){
    var box = m.querySelector('#alist');
    if (!j || !j.ok){
      box.innerHTML = '<div style="color:#d92d20;font-size:13px">' + ((j && j.msg) || '拉取失败') + '</div>';
      return;
    }
    box.innerHTML = '';
    (j.users || []).forEach(function(x){ box.appendChild(userRow(x, !x.hasPw)); });
    if (!(j.users || []).length){
      box.innerHTML = '<div style="color:#7b8494;font-size:13px">还没有子账号，点下面「＋ 新增子账号」。</div>';
    }
  });
}
/* 管理号看所有账号的发布记录（云端 /puball） */
function openPubAll(m){
  var box = m.querySelector('#alist');
  box.innerHTML = '<div style="color:#7b8494;font-size:13px">发布记录加载中…</div>';
  m.querySelector('#apubs').textContent = '← 返回账号列表';
  m.querySelector('#apubs').onclick = function(){ m.querySelector('#apubs').textContent = '📋 发布记录'; loadAdminList(m); };
  authFetch('/puball').then(function(j){
    if (!j || !j.ok){
      box.innerHTML = '<div style="color:#d92d20;font-size:13px">' + ((j && j.msg) || '拉取失败') + '</div>';
      return;
    }
    var html = '';
    Object.keys(j.all || {}).sort().forEach(function(u){
      var marks = j.all[u] || {}, ks = Object.keys(marks);
      ks.sort(function(a, b){ return marks[b] - marks[a]; });
      html += '<div class="auser"><div class="arow"><span class="uname">' + esc(u) + '</span>'
            + '<span style="font-size:12.5px;color:#7b8494">已发布 ' + ks.length + ' 个型号</span></div>';
      if (ks.length){
        html += '<div class="permchips">' + ks.map(function(k){
          var d = new Date(marks[k]);
          var t = d.getMonth() + 1 + '-' + d.getDate() + ' ' + ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
          return '<span class="pk on" title="标记于 ' + t + '">' + esc(k) + '</span>';
        }).join('') + '</div>';
      }
      html += '</div>';
    });
    box.innerHTML = html || '<div style="color:#7b8494;font-size:13px">还没有发布记录。</div>';
  });
}

/* ================= 卡片 ================= */
var PH_SVG = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none">'
  + '<rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor" stroke-width="1.4"/>'
  + '<path d="M5 9h14" stroke="currentColor" stroke-width="1.4"/>'
  + '<circle cx="8.2" cy="6" r="0.9" fill="currentColor"/></svg>';
/* 「全国可发」列怎么读（用户 2026-10 定稿的口径）：
   ⚠ 这一列回答的不是「能不能发」，而是「**能不能发到深惠广莞以外**」——
      所有型号都能发深圳/惠州/广州/东莞，所以卡片上那个绿色的「深惠广莞」永远在。
   · 空 / 不可以 / 进货小于3年不能发外区 / 进货大于3年可以发外区 → 只发深惠广莞（natk 3）
   · 可以 / 报备可发全国                                       → 报备后可发全国，看地址（natk 1）
   · 找品类报备确认 / 一单一询是否能发外地                       → 要问过才知道（natk 2）
   以后表里冒出没见过的写法 → 保守当「要问过才知道」，原文照显。 */
var NAT_EXTRA = {
  '可以': 'y', '报备可发全国': 'y',
  '找品类报备确认': 'q', '一单一询是否能发外地': 'q',
  '进货大于3年可以发外区': 's', '进货小于3年不能发外区': 's'
};
// 这些值本身就等于「只发深惠广莞」，再显示一个标签就是废话
var NAT_LOCAL = ['不可以', '不可', '否', 'N', 'n', '0', '0.0', '不', '×', 'x', '不支持'];

/* 「发货区域」列——只有这三种写法需要归一（用户 2026-10 定）：它们说的都是
   「外区能发，但要加 100 运费」，而包邮的只有深圳/惠州/广州/东莞。
   其它写法照显原文。 */
var SHIP_EXTRA = {
  '可发全国加运费100':        { t: '可发全国 · 加100运费', k: 'y' },
  '报备可发全国加运费100':     { t: '报备可发全国 · 加100运费', k: 'y' },
  '询问是否可发全国加运费100':  { t: '想问 · 加100运费可发全国', k: 'q' }
};

// 发货区域的展示文案（归一的用归一后的，其余照原文）
function shipTextOf(it){
  var raw = it.ship == null ? '' : String(it.ship).trim();
  if (!raw) return null;
  var m = SHIP_EXTRA[raw];
  return m ? m.t : raw;
}

function renderItem(it){
  var nm = nameOf(it);
  var marked = !!MARKED[it.c];
  var img = imgOf(it.c);
  var mine = !!MYIMGS[it.c];

  /* ---------- 报价（两套口径） ----------
       · 海尔 / 卡萨帝：滞销·样机清理价 + 出库奖励 + 清理数量，下面接一行全新机报价
       · 美的 / 容声（「美的」页）：拿货价·慧买卖 / 给二批 / 取整，下面接京东价 + 参考闲鱼价 */
  var g = [], pg = [];
  var hot = null;
  var live = stockOf(it.mo);   // 用友实时库存（提前取：清理数量和库存行都要用）
  if (it._md){
    if (pok('p_mh') && isNum(it.mh)) { g.push(prCell('拿货价 · 慧买卖', it.mh, 'hot')); hot = it.mh; }
    if (pok('p_m2') && isNum(it.m2)) g.push(prCell('价格 · 给二批', it.m2));
    if (pok('p_mr') && isNum(it.mr)) g.push(prCell('价格取整', it.mr));
    if (pok('p_lp') && isNum(it.lp) && it.lp > 0) g.push(prCell('零售指导价', it.lp, 'rp'));
    // 官网价：美的商城快照（mop = 商城划线原价，比现售价高才显示）
    if (pok('p_mp') && isNum(it.mp)){
      var mo = isNum(it.mop) && it.mop > it.mp ? '<i class="orig">' + esc(money(it.mop)) + '</i>' : '';
      g.push('<div class="pr rp"><span>官网价</span><b>' + esc(money(it.mp)) + mo + '</b></div>');
    }
    // 官方参考价（用来定价）：京东价 / 国补后（零售指导价、官网价在上一行里已有）
    if (pok('p_jd') && isNum(it.jd)) pg.push(prCell('京东价 / 国补后', it.jd));
  } else {
    if (pok('p_lpz') && isNum(it.lpz)) { g.push(prCell('滞销清理价', it.lpz, 'hot')); hot = it.lpz; }
    if (pok('p_spz') && isNum(it.spz)) { g.push(prCell('样机清理价', it.spz, hot == null ? 'hot' : '')); if (hot == null) hot = it.spz; }
    if (pok('p_lp') && isNum(it.lp) && it.lp > 0) g.push(prCell('零售指导价', it.lp, 'rp'));
    if (pok('p_lb') && isNum(it.lb)) g.push(prCell('滞销出库奖励', it.lb, 'bonus'));
    if (pok('p_sb') && isNum(it.sb)) g.push(prCell('样机出库奖励', it.sb, 'bonus'));
    /* 清理数量（2026-10 三次改版）：= 用友实时库存各仓数量加总；没拉过实时时退回金山表列 */
    var qn = (live && isNum(live.a)) ? Math.round(live.a)
           : (isNum(it.lq) ? it.lq : (isNum(it.sq) ? it.sq : null));

    ['京东价/国补后', money(it.jd)],
    ['物料编码', it.code]
  ];
  pairs.forEach(function(p){
    if (p[1] != null && p[1] !== '' && p[1] !== 0) L.push(p[0] + '：' + p[1]);
  });
  // 实时库存（用友 YonSuite，唯一库存来源）—— 只写「什么仓有几个」
  var lv = stockOf(it.mo);
  if (lv && ((lv.whs && lv.whs.length) || (lv.wt && Object.keys(lv.wt).length))){
    if (lv.whs && lv.whs.length){
      L.push('库存（' + ((STOCKDATA && STOCKDATA.ts) || '') + '）：' + lv.whs.map(function(x){
        return x.w + (x.t ? '（' + x.t + '）' : '') + ' ' + Math.round(x.n);
      }).join('；'));
    } else {
      var lvparts = [];
      for (var lkk in lv.wt){ lvparts.push(lkk + ' ' + Math.round(lv.wt[lkk])); }
      lvparts.sort(function(x, y){ return parseFloat(y.split(' ')[1]) - parseFloat(x.split(' ')[1]); });
      L.push('库存（' + ((STOCKDATA && STOCKDATA.ts) || '') + '）：' + lvparts.join(' / '));
    }
  }
  // 发往范围：所有海尔系型号都能发深惠广莞；表里另外写了口径的，连原文一起带上。
  // 美的 / 容声那张表没有「发货区域」列 → 不写，免得编
  if (!it._md){
    var lc = '深圳/惠州/广州/东莞';
    var nv = String(it.nat == null ? '' : it.nat).replace(/^[\s\-—－–]+/, '').trim();
    if (nv && NAT_LOCAL.indexOf(nv) < 0) lc += '；' + nv;
    L.push('可发范围：' + lc);
  }
  return L.join('\n');
}
function toast(btn, ok){
  var old = btn.textContent;
  btn.textContent = ok ? '已复制' : '复制失败';
  btn.classList.toggle('done', ok);
  setTimeout(function(){ btn.textContent = old; btn.classList.remove('done'); }, 1400);
}
function doCopy(text, btn){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast(btn, true); }, function(){ fb(text, btn); });
  } else { fb(text, btn); }
}
function fb(text, btn){
  try{
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-1000px';
    document.body.appendChild(ta); ta.select();
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    toast(btn, ok);
  }catch(e){ toast(btn, false); }
}

var pminV = null, pmaxV = null;
function readPrice(){
  pminV = parseFloat(pminEl.value); if (!isFinite(pminV)) pminV = null;
  pmaxV = parseFloat(pmaxEl.value); if (!isFinite(pmaxV)) pmaxV = null;
}
function pricePass(it){
  if (pminV == null && pmaxV == null) return true;
  var bp = lowPrice(it);
  if (bp == null) return false;
  if (pminV != null && bp < pminV) return false;
  if (pmaxV != null && bp > pmaxV) return false;
  return true;
}
function pass(it){
  if (curBrand && brandOf(it) !== curBrand) return false;
  if (curCat && it._cg !== curCat) return false;
  if (curKind && it.k.indexOf(curKind) < 0) return false;
  // 「只看有货」：优先用用友实时库存（2026-10 改版后唯一库存口径）；
  // 还没拉取过实时数据时，退回公布版清理明细里的「可用量 / 现存量」列，免得筛出空列表
  if (flagStock){
    var _lv = stockOf(it.mo);
    if (_lv){
      if (!((_lv.a || 0) > 0 || (_lv.q || 0) > 0)) return false;
    } else {
      var _gp = isNum(it.lav) ? it.lav : 0;
      var _sp = isNum(it.sav) ? it.sav : 0;
      if (!(_gp > 0) && !(_sp > 0)) return false;
    }
  }
  // 「只看能发外区」：排除掉 3 = 只发深惠广莞的（含空值 / 不可以 / 进货年限那两条）
  if (flagSend && (it.natk === 3 || it.natk == null)) return false;
  if (hideMarked && MARKED[it.c]) return false;
  return pricePass(it);
}

/* ================= 检索 ================= */
var QCAP = 500;
function search(qRaw){
  var q = norm(qRaw);
  if (!q) return null;
  var qc = coreOf(qRaw), qc2 = coreOf2(qRaw);
  var qCJK = /[\u4e00-\u9fff]/.test(q);
  var hit = [], i, it, sc, ix;
  for (i = 0; i < ALL.length; i++){
    it = ALL[i];
    if (!pass(it)) continue;
    sc = 0; ix = -1;
    if (it._n === q) sc = 6;
    else if (qc && it.c === qc) sc = 5;
    else if (qc2 && it._c2 === qc2) sc = 4;
    else if (qc && it.c.indexOf(qc) === 0) sc = 3;
    else if (qc && it.c.indexOf(qc) > 0) sc = 2;
    else if (qc2 && it._c2 && it._c2.indexOf(qc2) === 0) sc = 2;
    else if (it._n.indexOf(q) >= 0) sc = 1;
    else if (it._h.indexOf(q) >= 0){ sc = 1; ix = it._h.indexOf(q); }
    if (sc > 0) hit.push({ sc: sc, it: it, ix: ix });
  }
  hit.sort(function(a,b){
    if (b.sc !== a.sc) return b.sc - a.sc;
    if (qCJK && a.ix !== b.ix) return a.ix - b.ix;
    return a.it.c.length - b.it.c.length || (a.it._n < b.it._n ? -1 : a.it._n > b.it._n ? 1 : 0);
  });
  return hit.length > QCAP ? hit.slice(0, QCAP) : hit;
}
function allFiltered(){
  var hit = [], i;
  for (i = 0; i < ALL.length; i++) if (pass(ALL[i])) hit.push({ sc: 0, it: ALL[i], ix: -1 });
  hit.sort(function(a,b){ return a.it.c.length - b.it.c.length || (a.it._n < b.it._n ? -1 : a.it._n > b.it._n ? 1 : 0); });
  return hit.length > QCAP ? hit.slice(0, QCAP) : hit;
}

    + '<svg width="46" height="46" viewBox="0 0 24 24" fill="none">'
    + '<circle cx="11" cy="11" r="7" stroke="#98a2b3" stroke-width="1.5"/>'
    + '<path d="M16.2 16.2L21 21" stroke="#98a2b3" stroke-width="1.5" stroke-linecap="round"/></svg>'
    + '<h3>输入型号开始查</h3>'
    + '<p>敲型号片段 ' + code('BCD-501WGHTD14W9U1') + code('KFR-35GW') + code('MR-497WSPEA') + '，<br>'
    + '或直接搜品类 ' + code('冰箱') + code('洗衣机') + code('热水器') + '，也可以点上面的品牌 / 品类标签。</p>'
    + '<p class="dim">库里有 <b>' + ALL.length + '</b> 个型号'
    + (np ? ' · 全新机 <b>' + np + '</b> 个' : '')
    + (nc ? ' · 清理（滞销/样机）<b>' + nc + '</b> 个' : '')
    + '</p></div>';
}
function priceHint(){
  var a = parseFloat(pminEl.value), b = parseFloat(pmaxEl.value);
  if (isFinite(a) && isFinite(b)) return '清理价 ¥' + a + ' ~ ¥' + b;
  if (isFinite(a)) return '清理价 ≥ ¥' + a;
  if (isFinite(b)) return '清理价 ≤ ¥' + b;
  return '';
}

function run(){
  var q = input.value.trim();
  clrBtn.hidden = !q;
  readPrice();
  listEl.innerHTML = '';
  moreEl.hidden = true;
  shown = 0;
  var hasFilter = !!(curBrand || curCat || curKind || flagStock || flagSend || pminV != null || pmaxV != null);
  // 空搜索框 + 没点任何筛选 = 什么都不列。
  // （上一版是「打开就铺全部」，用户反馈又慢又没用 —— 这是查找工具，不是浏览工具）
  if (!q && !hasFilter){ cur = []; hintEl.innerHTML = ''; listEl.innerHTML = idleHTML(); return; }
  var res = q ? (search(q) || []) : allFiltered();
  cur = res;
  if (!res.length){ hintEl.innerHTML = '无匹配结果'; listEl.innerHTML = emptyHTML(q || '当前筛选'); return; }
  var ph = priceHint(), bits;
  if (q){
    var exact = 0, catm = 0;
    for (var i = 0; i < res.length; i++){
      if (res[i].sc >= 5) exact++;
      if (res[i].sc === 1) catm++;
    }
    bits = '找到 <b>' + res.length + '</b> 条'
      + (exact ? '（精确型号 <b>' + exact + '</b> 条）' : (catm === res.length ? '（按品类/名称匹配）' : '（模糊匹配）'));
  } else {
    bits = '筛选到 <b>' + res.length + '</b> 条';
  }
  hintEl.innerHTML = bits
    + (ph ? ' <span class="dot"></span> ' + esc(ph) : '')
    + (res.length >= QCAP ? ' <span class="dot"></span> 仅显示前 ' + QCAP + ' 条，请多输入几个字符' : '');
  renderBatch();
}

/* ================= 事件 ================= */
input.addEventListener('input', run);
input.addEventListener('keydown', function(e){ if (e.key === 'Escape'){ input.value = ''; run(); } });
clrBtn.addEventListener('click', function(){ input.value = ''; input.focus(); run(); });

chipsEl.addEventListener('click', function(e){
  var b = e.target.closest('.chip');
  if (!b) return;
  if (b.dataset.more){ toggleMore(chipsEl, b); return; }   // 「更多 ▾」只是展开，不筛选
  curBrand = b.dataset.brand || '';
  Array.prototype.forEach.call(chipsEl.querySelectorAll('.chip[data-brand]'), function(c){ c.classList.toggle('on', c === b); });
  run();
});
catchipsEl.addEventListener('click', function(e){
  var b = e.target.closest('.chip');
  if (!b) return;
  if (b.dataset.more){ toggleMore(catchipsEl, b); return; }
  curCat = b.dataset.cat || '';
  Array.prototype.forEach.call(catchipsEl.querySelectorAll('.chip[data-cat]'), function(c){ c.classList.toggle('on', c === b); });
  run();
});
toolsEl.addEventListener('click', function(e){
  var b = e.target.closest('.chip');
  if (!b) return;
  if (b.dataset.kind != null && b.dataset.flag == null){
    curKind = b.dataset.kind || '';
    Array.prototype.forEach.call(toolsEl.querySelectorAll('.chip[data-kind]'), function(c){ c.classList.toggle('on', c === b); });
  } else if (b.dataset.flag === 'stock'){
    flagStock = !flagStock; b.classList.toggle('on', flagStock);
  } else if (b.dataset.flag === 'send'){
    flagSend = !flagSend; b.classList.toggle('on', flagSend);
  } else if (b.dataset.flag === 'hide'){
    hideMarked = !hideMarked; b.classList.toggle('on', hideMarked);
    try { localStorage.setItem(HIDE_KEY, hideMarked ? '1' : '0'); } catch(e){}
  }
  run();
});

listEl.addEventListener('click', function(e){
  var mb = e.target.closest('[data-mark]');
  if (mb){
    var k = mb.dataset.mark;
    if (MARKED[k]) delete MARKED[k]; else MARKED[k] = Date.now();
    saveMarks();
    pubPush(k, !!MARKED[k]);
    var card = mb.closest('.card');
    if (card){
      var on = !!MARKED[k];
      card.classList.toggle('marked', on);
      var pub = card.querySelector('.pub');
      if (pub) pub.hidden = !on;
      mb.textContent = on ? '取消发布' : '标记已发布';
    }
    return;
  }
  var ai = e.target.closest('[data-addimg]');
  if (ai){ e.preventDefault(); pickImage(ai.dataset.addimg); return; }
  var di = e.target.closest('[data-delimg]');
  if (di){
    var dk = di.dataset.delimg;
    if (MYIMGS[dk] && confirm('删掉你给 ' + dk + ' 补的这张图？')){ delete MYIMGS[dk]; saveMyImgs(); run(); }
    return;
  }
  var c = e.target.closest('[data-copy]');
  if (c){ var item = UID[+c.dataset.copy]; if (item) doCopy(copyText(item), c); return; }
  var f = e.target.closest('[data-fill]');
  if (f){ input.value = f.dataset.fill; input.focus(); run(); }
});

listEl.addEventListener('input', function(e){
  var box = e.target.closest ? e.target.closest('.calc') : null;
  if (!box) return;
  calcUpdate(box);
  var k = box.dataset.key;
  if (!k) return;
  var v = parseFloat(e.target.value);
  if (isFinite(v) && v > 0) PRICES[k] = v; else delete PRICES[k];
  savePrices();
});
listEl.addEventListener('change', function(e){
  var sel = e.target.closest ? e.target.closest('.costsel') : null;
  if (!sel) return;
  var box = sel.closest('.calc');
  if (box) calcUpdate(box);
});

[pminEl, pmaxEl].forEach(function(el){
  el.addEventListener('input', function(){ pclearBtn.hidden = !(isFinite(parseFloat(pminEl.value)) || isFinite(parseFloat(pmaxEl.value))); run(); });
  el.addEventListener('keydown', function(e){ if (e.key === 'Escape'){ el.value = ''; pclearBtn.hidden = true; run(); } });
});
pclearBtn.addEventListener('click', function(){ pminEl.value = ''; pmaxEl.value = ''; pclearBtn.hidden = true; run(); });

document.getElementById('expimg').addEventListener('click', exportMyImgs);
document.getElementById('impimg').addEventListener('click', importMyImgs);

/* ================= 一键更新（跑在软件自带窗口里 / 走本地服务时才出现） ================= */
(function(){
  if (location.protocol !== 'http:') return;
  var bar   = document.getElementById('updbar');
  var btn   = document.getElementById('updbtn');
  var stk   = document.getElementById('stkbtn');
  var msg   = document.getElementById('updmsg');
  bar.hidden = false;

  function busy(on, label){
    btn.disabled = on; stk.disabled = on;
    btn.textContent = on ? (label || '正在更新…') : '↻ 从金山文档更新数据';
    stk.textContent = on ? (label || '正在更新…') : '⟳ 更新实时库存（用友）';
  }
  function reset(){ busy(false); }

  function poll(){
    fetch('/api/state', { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(s){
      if (s.status === 'running'){
        msg.innerHTML = '<span class="spin"></span>' + esc(s.msg || '正在更新…');
        busy(true, '正在更新…'); setTimeout(poll, 1200);
      } else if (s.status === 'login'){
        msg.innerHTML = '<span class="spin"></span>' + esc(s.msg || '等待扫码登录…');
        busy(true, '等待扫码…'); setTimeout(poll, 1500);
      } else if (s.status === 'done'){
        msg.innerHTML = '✅ 更新完成，正在刷新…';
        setTimeout(function(){ location.reload(); }, 700);
      } else if (s.status === 'error'){
        msg.innerHTML = '❌ 更新失败：' + esc(s.msg || '');
        reset();
      } else {
        reset();
      }
    }).catch(function(){ setTimeout(poll, 1500); });
  }

  btn.addEventListener('click', function(){
    if (btn.disabled) return;
    busy(true, '正在更新…');
    msg.innerHTML = '<span class="spin"></span>正在连接金山文档…';
    fetch('/api/update', { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(r){
      if (!r.ok){ msg.textContent = '更新失败：' + (r.msg || ''); reset(); return; }
      poll();
    }).catch(function(e){ msg.textContent = '请求失败：' + e; reset(); });
  });

  stk.addEventListener('click', function(){
    if (stk.disabled) return;
    busy(true, '正在更新库存…');
    msg.innerHTML = '<span class="spin"></span>正在连接用友 YonSuite…（如需登录会自动弹窗，登录一次即可）';
    fetch('/api/stock', { method: 'POST', cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(r){
      if (!r.ok){ msg.textContent = '更新失败：' + (r.msg || ''); reset(); return; }
      poll();
    }).catch(function(e){ msg.textContent = '请求失败：' + e; reset(); });
  });

  fetch('/api/state', { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(s){
    if (s.status === 'running' || s.status === 'login'){ busy(true); poll(); }
  }).catch(function(){});
})();

window.addEventListener('scroll', function(){
  if (moreEl.hidden) return;
  if (window.innerHeight + window.scrollY > document.body.offsetHeight - 320) renderBatch();
}, { passive: true });

/* ================= 初始化（数据到位后才跑） ================= */

/* 一行 chip（品牌 / 品类）。项目多了就只留前 cap 个，其余点「更多」展开 ——
   美的并进来后品类会更多，不收起来整条筛选栏就糊成一片了。 */
function chipRow(label, attr, items, cap){
  var html = '<span class="lbl">' + label + '</span>'
           + '<button class="chip on" data-' + attr + '="">全部</button>';
  items.forEach(function(x, i){
    var over = i >= cap;
    html += '<button class="chip' + (over ? ' extra' : '') + '" data-' + attr + '="' + esc(x.k) + '"'
          + (over ? ' hidden' : '') + '>' + esc(x.k) + '<i>' + x.n + '</i></button>';
  });
  if (items.length > cap){
    html += '<button class="chip mini" data-more="' + attr + '">更多 ' + (items.length - cap) + ' ▾</button>';
  }
  return html;
}
function toggleMore(box, btn){
  var extra = box.querySelectorAll('.chip.extra');
  if (!extra.length) return;
  var open = extra[0].hidden;
  Array.prototype.forEach.call(extra, function(c){ c.hidden = !open; });
  btn.textContent = open ? '收起 ▴' : ('更多 ' + extra.length + ' ▾');
}

function initUI(){
  document.getElementById('meta').innerHTML =
    '型号 <b>' + ALL.length.toLocaleString('zh-CN') + '</b> 个 · 数据 <b>' + esc(META.built || '') + '</b>';

  chipsEl.innerHTML    = chipRow('品牌', 'brand', BRANDS, 999);   // 用户要求品牌全部展示不收起
  catchipsEl.innerHTML = chipRow('品类', 'cat',   CATS,   9);
  (function(){
    var nl = 0, ns = 0;
    ALL.forEach(function(it){ if (it.k.indexOf('l') >= 0) nl++; if (it.k.indexOf('s') >= 0) ns++; });
    document.getElementById('kc-l').textContent = nl;
    document.getElementById('kc-s').textContent = ns;
    toolsEl.querySelector('.chip[data-kind=""]').classList.add('on');
    var hb = toolsEl.querySelector('.chip[data-flag="hide"]');
    if (hideMarked) hb.classList.add('on');
  })();

  /* footer 数据源说明块已按要求去掉（2026-10 六次改版）；型号数/数据时间在侧栏底部 */
  document.getElementById('foot').innerHTML = '';

  var boot = document.getElementById('boot');
  if (boot) boot.hidden = true;
  input.focus();
  run();
}

/* 数据到位 → 建索引 → 起界面 */
function start(d){
  META = (d && d.meta) || {};
  ALL  = (d && d.rows) || [];
  IMGS = (d && d.imgs) || {};
  IMGHAS = null;
  var keys = (d && d.imgkeys) || null;
  if (keys){
    IMGHAS = {};
    for (var i = 0; i < keys.length; i++) IMGHAS[keys[i]] = 1;
  }
  try { buildIndex(); }
  catch(e){
    document.getElementById('list').innerHTML =
      '<div class="empty"><h3>数据解析出错</h3><p>' + esc(String((e && e.message) || e)) + '</p></div>';
    return;
  }
  initUI();
}

ensureAuth().then(function(){
if (DATA){
  start(DATA);                      // 离线单文件版：数据本来就烤在页面里
} else {
  /* exe 版：页面秒开，数据随后到（实时库存一起取，接口在本地，秒回） */
  var pData = fetch(CFG.dataUrl || '/api/data', { cache: 'no-store' })
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  var pStock = fetch('/api/stock', { cache: 'no-store' })
    .then(function(r){ return r.ok ? r.json() : null; })
    .catch(function(){ return null; });
  pData.then(function(d){
    return pStock.then(function(s){
      if (s && s.stock && Object.keys(s.stock).length) STOCKDATA = s;
      start(d);
    });
  }).catch(function(e){
    var el = document.getElementById('list');
    if (el) el.innerHTML = '<div class="empty"><h3>数据没加载上来</h3><p>'
      + esc(String((e && e.message) || e)) + '</p>'
      + '<p>点菜单「数据 → 重新加载」，或者重启软件试试。</p></div>';
  });
}
});
})();
