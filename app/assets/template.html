<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>型号查询</title>
<style>
:root{
  --bg:#f4f6fa; --card:#fff; --line:#e6eaf2; --line2:#eef1f7;
  --ink:#1b2431; --ink2:#5b6577; --ink3:#98a2b3;
  --brand:#2e6be6; --brand-d:#1b47b8; --brand-l:#eaf1ff;
  --ok:#0f9d58; --ok-l:#e8f6ee; --warn:#c2760a; --warn-l:#fdf3e3;
  --neg:#d64545;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
/* 左侧筛选栏（2026-10 五次改版）：搜索 + 品牌/品类/方式 全部移到左边 */
.side .searchbar{box-shadow:none;padding:0 10px;border-radius:10px}
.side #q{font-size:14px;padding:11px 0}
.side .chips{margin:0}
.side .chips .lbl{display:block;width:100%;margin:0 0 2px}
.side .vsep{display:none}
.side .pricebar-in{width:70px}
.side .updbar{margin:12px 0 0}
/* 子用户发布记录块（侧栏，仅管理号）：占满一行，chip 可换行 */
#tools .subrec{width:100%;display:block;border-top:1px dashed var(--line2);margin-top:10px;padding-top:8px}
#tools .subrec .pk{cursor:pointer}
/* 库存提醒横幅：已发布的型号对应的仓没货了 → 提醒下架 */
.pubwarn{
  margin:0 0 10px;padding:9px 14px;border-radius:10px;font-size:13.5px;line-height:1.6;
  background:#fdf3e3;border:1px solid #f3ddb0;color:#a16207;
}
.pubwarn b{color:#7c4a03}
.pubwarn a{color:#a16207;text-decoration:underline;cursor:pointer}
/* 用友登录告警横幅（管理号）：别的机器用友密码不对 → 这里红色亮牌 */
.yyalert{
  margin:0 0 10px;padding:9px 14px;border-radius:10px;font-size:13.5px;line-height:1.6;
  background:#fdecec;border:1px solid #f5c2c2;color:#b42318;
  display:flex;gap:10px;align-items:center;
}
.yyalert b{color:#912018}
.yyalert .close{margin-left:auto;border:0;background:none;color:#b42318;font-size:16px;cursor:pointer;padding:0 4px;line-height:1}
.mains{flex:1;min-width:0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}

/* ---------- 布局（2026-10 六次改版）----------
   页头整个删掉；侧栏 position:fixed 钉死在最左边、自己滚，
   主区留出 280px 边距。 */
.bodywrap{max-width:none;display:block;padding:10px 16px 40px 276px}
.side{
  position:fixed;left:10px;top:10px;bottom:10px;z-index:30;
  width:250px;overflow-y:auto;overflow-x:hidden;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:12px 12px 14px;box-shadow:var(--shadow);
}
.mains{min-width:0}
/* 侧栏底部：更新状态 + 型号数 · 数据时间 */
.sidefoot{margin:14px 0 0;padding-top:10px;border-top:1px dashed var(--line)}
.sidefoot .upnote{font-size:11.5px;color:var(--ink3);display:block;line-height:1.6}
.sidefoot .upnote b{color:var(--ink2)}
.sidefoot .upnote .spin{display:inline-block;width:11px;height:11px;border:2px solid #cfdcf6;
  border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:4px}
.sidecount{font-size:11.5px;color:var(--ink3);margin-top:6px;line-height:1.7}
.sidecount .mt{display:block}
.sideall{display:block;width:100%;margin-top:10px;padding:9px 12px;border:0;border-radius:9px;
  background:var(--brand);color:#fff;font-size:13px;font-weight:600;cursor:pointer;text-align:center}
.sideall:hover{background:var(--brand-d)}
.sideall:disabled{opacity:.55;cursor:default}
.sidecount b{color:var(--ink2);font-weight:600}
/* 清理价区间：标签 + 最低 ~ 最高 一行。⚠ flex:1+min-width:0 ——
   之前 width:100% 叠在标签旁边直接把 fgroup 撑破，侧栏底部被顶出横向滚动条 */
.pricerow{display:flex;gap:6px;align-items:center;flex:1;min-width:0;margin-top:2px}
.pricerow .pricebar-in{flex:1;width:auto;min-width:0}
.pricerow .tilde{color:var(--ink3);font-size:12px;flex:none}

/* ---------- search ---------- */
main{padding:22px 0 60px}
.searchbar{
  display:flex;align-items:center;gap:10px;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:0 14px;
  box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s;
}
.searchbar:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px rgba(46,107,230,.12),var(--shadow)}
.searchbar .ic{flex:none;color:var(--ink3)}
#q{
  flex:1;border:0;outline:0;background:transparent;padding:16px 0;
  font-size:17px;color:var(--ink);font-family:inherit;letter-spacing:.3px;min-width:0;
}
#q::placeholder{color:#b7c0cf;letter-spacing:0;font-size:15px}
.clr{
  border:0;background:#eef1f7;color:var(--ink2);width:26px;height:26px;border-radius:50%;
  cursor:pointer;font-size:15px;line-height:1;flex:none;
}
.clr:hover{background:#e3e8f2}

/* ---------- 筛选条 ----------
   原来是「品牌 / 品类 / 清理方式 / 价格区间」四行 chip，每行还各挂一个蓝色的
   「全部 977」，又长又重复（用户反馈「太乱了」）。现在：
     · 品牌、品类各收成一行，超出 8 个的收进「更多」；
     · 「全部」不再重复挂总数；
     · 价格区间并进「清理方式」那一行；chip 也整体压小了一号。 */
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:0;align-items:center}
.chips+.chips{margin-top:7px}
.chips .lbl{font-size:11.5px;color:var(--ink3);flex:none;margin-right:3px;letter-spacing:.2px}
.chip{
  border:1px solid var(--line);background:#fff;color:var(--ink2);
  padding:3px 10px;border-radius:999px;font-size:12.5px;cursor:pointer;
  transition:.13s;font-family:inherit;line-height:1.55;
}
.chip:hover{border-color:#c9d6ef;color:var(--brand-d)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.chip.g.on{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
.chip.w.on{background:var(--warn);border-color:var(--warn);color:#fff;font-weight:600}
/* 软件更新按钮发现新版本时的高亮（点过/装完就恢复普通样式） */
.chip.hot{background:#fff7e8;border-color:#f0c36d;color:#9a6a00;font-weight:700}
.chip i{font-style:normal;opacity:.6;font-size:10.5px;margin-left:3px}
/* 「更多 ▾」这种次要按钮 */
.chip.mini{padding:4px 9px;font-size:12px;color:var(--ink3);border-style:dashed}
.chip.mini:hover{color:var(--brand-d);border-style:solid}
/* 筛选分组盒（2026-10-08）：品牌/品类/方式各装一盒，组名小字，选中品牌在盒头显示总数 */
.fgroup{background:#f5f6f8;border-radius:10px;padding:10px 12px;margin-top:10px}
.fhead{display:flex;align-items:center;margin:0 0 8px}
.flbl{font-size:12px;color:#7b8494;letter-spacing:.2px}
.fcount{margin-left:auto;font-size:12px;color:var(--brand-d);font-weight:600}
/* 品牌/品类 chip：每行自动铺满对齐（行内均分宽度），不再参差留白 */
#chips .chip,#catchips .chip{flex:1 1 auto;text-align:center;padding:3px 8px}
/* 方式胶囊（全部/滞销清理/样机清理）：三个强制一行放得下 */
.chips.kinds{display:flex;flex-wrap:nowrap}
.chips.kinds .chip{flex:1 1 0;min-width:0;text-align:center;padding:3px 6px;font-size:12px;white-space:nowrap}
/* 开关型筛选（只看有货/能发外区/未发布/已发布）：保留 .chip 类给事件委托，外观做成勾选框 */
.fchkrow{display:grid;grid-template-columns:1fr 1fr;gap:7px 10px;margin-top:9px}
.chip.fchk{display:flex;align-items:center;gap:6px;border:0;background:none;padding:0;border-radius:0;font-size:12.5px;color:var(--ink2);line-height:1.4}
.chip.fchk .box{width:14px;height:14px;border-radius:4px;border:1px solid #c9cfda;background:#fff;flex:none;position:relative;transition:.13s}
.chip.fchk:hover .box{border-color:#9fb6dd}
.chip.fchk:hover{color:var(--brand-d)}
.chip.fchk.on{background:none;border:0;color:var(--brand-d);font-weight:600}
.chip.fchk.on .box{background:var(--brand);border-color:var(--brand)}
.chip.fchk.on .box::after{content:'';position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.vsep{width:1px;height:16px;background:var(--line);flex:none;margin:0 3px}
.pricebar-in{
  width:84px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12.5px;
  font-variant-numeric:tabular-nums;outline:0;font-family:inherit;background:#fff;
}
.pricebar-in:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(46,107,230,.12)}
.pc{border:0;background:transparent;color:var(--brand);font-size:12.5px;cursor:pointer;
  font-family:inherit;padding:2px 4px}
.pc:hover{color:var(--brand-d);text-decoration:underline;text-underline-offset:3px}

.hint{font-size:12.5px;color:var(--ink3);margin:12px 2px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;line-height:1.9}
.hint b{color:var(--ink2)}
.hint .dot{width:4px;height:4px;border-radius:50%;background:#cfd7e4;flex:none}

/* ---------- 一键更新条（仅通过本地服务打开时显示） ---------- */
.updbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 0;
  background:#fff;border:1px solid #dfe9fb;border-radius:12px;padding:8px 12px;
  box-shadow:0 1px 2px rgba(16,24,40,.03);
}
.updbar .upnote{font-size:12.5px;color:var(--ink3)}
.updbar .upnote b{color:var(--ink2);font-weight:600}
.updbar .spin{display:inline-block;width:12px;height:12px;border:2px solid #cfdcf6;
  border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:5px}
@keyframes sp{to{transform:rotate(360deg)}}
/* 软件更新弹窗里的转圈（openAppUpdate，2026-10-09） */
.apspin{display:inline-block;width:12px;height:12px;border:2px solid #cfdcf6;
  border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:5px}
/* 云端更新进度条（2026-10-09）：GPU 合成动画保证丝滑，width 过渡让轮询间隙也平滑 */
.uprog{width:100%;margin-top:4px}
.uprog .bar{height:8px;border-radius:99px;background:#e8eef9;overflow:hidden}
.uprog .fill{height:100%;width:0%;border-radius:99px;
  background:linear-gradient(90deg,#4f8bf7,#2e6be6);
  transition:width 1.2s cubic-bezier(.4,0,.2,1)}
.uprog .fill .glow{height:100%;width:100%;border-radius:99px;
  background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.45) 50%,rgba(255,255,255,0) 100%);
  background-size:200% 100%;animation:uglow 1.6s linear infinite}
@keyframes uglow{from{background-position:100% 0}to{background-position:-100% 0}}
.uprog .meta{display:flex;justify-content:space-between;margin-top:5px;
  font-size:11.5px;color:var(--ink3)}
.uprog .meta b{color:var(--brand);font-variant-numeric:tabular-nums}

/* ---------- cards ---------- */
.list{display:flex;flex-direction:column;gap:12px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px 18px 14px;box-shadow:0 1px 2px rgba(16,24,40,.03);
  transition:border-color .15s,box-shadow .15s;
}
.card:hover{border-color:#d6e0f0;box-shadow:var(--shadow)}
.card.marked{border-color:#bfe3cd;background:#fcfffd}
.chead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.pimg{
  width:74px;height:74px;object-fit:contain;background:#fff;flex:none;
  border:1px solid var(--line2);border-radius:10px;
}
.pimg.ph{
  display:flex;align-items:center;justify-content:center;position:relative;
  color:#c2ccdc;background:#fafbfd;
}
.addimg{
  position:absolute;inset:auto 0 0 0;
  font:600 11px/1 inherit;color:#2e6be6;background:#eef4ff;
  border:0;border-top:1px solid #dbe6fb;border-radius:0 0 9px 9px;
  padding:5px 0;cursor:pointer;width:100%;
}
.addimg:hover{background:#e2ecff}
.kimgdel{
  position:absolute;top:2px;left:66px;z-index:2;   /* 贴在补图右上角（pimg 74px 宽），别再飘到按钮上 */
  width:16px;height:16px;line-height:14px;padding:0;border-radius:50%;
  font:700 11px/14px inherit;text-align:center;cursor:pointer;
  color:#8a93a5;background:rgba(255,255,255,.92);border:1px solid var(--line);
  opacity:0;                                       /* 平时完全看不见，鼠标扫到卡片才浮出来 */
  transition:opacity .15s;
}
.chead:hover .kimgdel{opacity:.6}
.kimgdel:hover{opacity:1;color:#fff;background:#d63838;border-color:#d63838}
.chead-main{flex:1;min-width:200px}
.moline{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.mo{
  font-size:18px;font-weight:650;letter-spacing:.4px;color:var(--ink);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all;
}
.card.marked .mo{color:#0f7a45}
.pub{
  display:inline-block;font-size:11px;font-weight:700;color:#0f7a45;background:var(--ok-l);
  border:1px solid #c9e8d6;border-radius:6px;padding:2px 8px;margin-top:2px;
}
/* 发布卡片小字「闲鱼定价 ¥x · 发布于 x-x x:x」：管理号默认显示（头部「定价/时间」可关），
   子账号默认不给，管理号在「账号管理」勾 pubmeta 才显示（2026-10-09） */
.pubmeta{
  display:inline-block;font-size:11.5px;color:#8a93a3;margin:2px 0 0 8px;vertical-align:middle;
  white-space:nowrap;
}
.acts{margin-left:auto;display:flex;gap:8px;flex:none}
.markbtn,.copy{
  border:1px solid var(--line);background:#fff;color:var(--ink2);
  border-radius:9px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;
  transition:.13s;white-space:nowrap;flex:none;
}
a.markbtn{text-decoration:none}
a.markbtn.web{color:var(--brand);border-color:#d5e2ff;background:var(--brand-l)}
a.markbtn.web:hover{border-color:var(--brand);background:#dde9ff}
.copy:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-l)}
.copy.done{border-color:#bfe3cd;color:var(--ok);background:var(--ok-l)}
.markbtn:hover{border-color:var(--ok);color:var(--ok);background:var(--ok-l)}
.card.marked .markbtn:not(.web){border-color:#c9e8d6;color:#0f7a45;background:var(--ok-l)}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
.tag{
  font-size:11.5px;padding:2px 9px;border-radius:6px;background:#f2f5fa;color:var(--ink2);border:1px solid var(--line2);
}
.tag.b{background:var(--brand-l);color:var(--brand-d);border-color:#d9e4ff;font-weight:600}
.tag.s{background:#f6f1ff;color:#6b46c1;border-color:#e8defc}
.tag.h{background:#fff5ec;color:#b45309;border-color:#fbe0c4;font-weight:600}
.tag.d{background:#f5f6f9;color:#8b95a6;border-color:#e9edf4}
.nm{font-size:13px;color:var(--ink2);margin:7px 0 0;line-height:1.5}

/* 发往范围（原「全国可发」列）——
   · loc   = 深圳/惠州/广州/东莞，**所有型号都能发**，所以它永远在
   · nat-y = 报备后可发全国 / 可发全国（要看地址）
   · nat-q = 要问过才知道（找品类报备确认 / 一单一询是否能发外地）
   · nat-s = 仍是本地口径，但表里写了进货年限之类的门槛备注 */
.pill.loc{background:var(--ok-l);color:#0f7d45;border-color:#c9e8d6}
.pill.nat-y{background:var(--brand-l);color:var(--brand-d);border-color:#d9e4ff}
.pill.nat-q{background:var(--warn-l);color:#a16207;border-color:#f0dcbb}
.pill.nat-s{background:#f5f6f9;color:#7c8698;border-color:#e9edf4}

/* 价格格 */
.prices{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;margin-top:13px}
.pr{background:#fafbfd;border:1px solid var(--line2);border-radius:10px;padding:8px 11px}
.pr span{display:block;font-size:11.5px;color:var(--ink3);margin-bottom:2px}
.pr b{font-size:15.5px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.2px}
.pr.hot{background:var(--brand-l);border-color:#d9e4ff}
.pr.hot b{color:var(--brand-d);font-size:17px}
/* 零售指导价只是「参考原价」，压低一档即可 —— ⚠ 不要加删除线，用户明确要求正常显示 */
.pr.rp{background:#fbfbfc}
.pr.rp b{color:var(--ink2);font-size:15px;font-weight:600}
.pr b i.orig{font-style:normal;font-size:11.5px;font-weight:400;color:var(--ink3);margin-left:3px;text-decoration:line-through}
.pr.bonus b{color:#b45309;font-size:15px}
.pr.qty b{font-size:15px}

.row{display:flex;gap:9px;align-items:baseline;margin-top:9px;font-size:13px;flex-wrap:wrap}
.row>label{flex:none;width:66px;color:var(--ink3);font-size:12px;letter-spacing:.2px}
.row .v{color:var(--ink);font-variant-numeric:tabular-nums}
.pill{
  display:inline-block;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;
  background:#f2f5fa;color:var(--ink2);border:1px solid var(--line2);font-variant-numeric:tabular-nums;
}
.pill.ok{background:var(--ok-l);color:var(--ok);border-color:#c9e8d6}
.pill.no{background:#f5f6f9;color:var(--ink3)}
.pill.mute{background:#f5f6f9;color:var(--ink3)}
.pill.sum{background:#eef4ff;color:#1d4fb8;font-weight:600}
.lnk{
  border:0;background:transparent;color:var(--brand);font-size:12.5px;cursor:pointer;
  padding:2px 4px;font-family:inherit;text-decoration:underline;text-underline-offset:3px;
  text-decoration-color:#bcd0f7;
}
.lnk:hover{color:var(--brand-d)}
/* 仓库明细（现存量10.6）—— 回答「这几台在哪个仓」。
   颜色按仓库类型分：正品仓绿 / 样机仓蓝 / 次品仓红 / 特价·待送橙 / 机壳·虚拟灰。
   仓多了只列前 4 个，鼠标停上去出完整列表（title 里有全部）。 */
.pill.wh{background:#f4f7fc;color:var(--ink2);border-color:#e2e9f4;font-weight:500;font-size:12px;padding:2px 9px}
.pill.wh em{font-style:normal;font-size:10.5px;color:var(--ink3);margin-left:4px}
.pill.wh b{margin-left:5px;font-weight:700;color:var(--ink)}
.pill.wh.ok{background:var(--ok-l);border-color:#c9e8d6}
.pill.wh.ok b{color:#0f7d45}
.pill.wh.sky{background:var(--brand-l);border-color:#d9e4ff}
.pill.wh.sky b{color:var(--brand-d)}
.pill.wh.bad{background:#fef2f2;border-color:#fbd5d5}
.pill.wh.bad b{color:#b42318}
.pill.wh.warn{background:var(--warn-l);border-color:#f0dcbb}
.pill.wh.warn b{color:#a16207}
.pill.wh.mute{background:#f5f6f9;border-color:#e9edf4;color:var(--ink3)}
.pill.whmore{background:#fff;border-style:dashed;color:var(--ink3);font-weight:500;font-size:12px}

/* ---------- 闲鱼定价计算器 ---------- */
.calc{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin-top:12px;background:#f7faff;border:1px solid #dfe9fb;border-radius:10px;padding:9px 12px;
}
.calc .cl{font-size:12px;color:var(--ink3);flex:none}
.calc input{
  width:128px;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:14px;
  font-variant-numeric:tabular-nums;outline:0;font-family:inherit;background:#fff;
}
.calc input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(46,107,230,.12)}
.calc select{
  border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;
  font-family:inherit;background:#fff;color:var(--ink2);outline:0;max-width:190px;
}
.calc .ci{font-size:12px;color:var(--ink3)}
.calc .ci b{color:var(--ink2);font-weight:600;font-variant-numeric:tabular-nums}
.calc .cfr{font-size:11.5px;color:var(--ink3);display:inline-flex;align-items:center;gap:4px;cursor:pointer;flex:none;white-space:nowrap}
.calc .cfr:hover{color:var(--ink2)}
.calc .cfr input{width:auto;margin:0;accent-color:var(--brand);cursor:pointer}
.calc .p-out{font-size:14.5px}
.calc .p-out.pos{color:var(--ok)}
.calc .p-out.neg{color:var(--neg)}

.empty{text-align:center;padding:56px 20px;color:var(--ink3)}
.empty svg{opacity:.35;margin-bottom:12px}
.empty h3{margin:0 0 6px;color:var(--ink2);font-size:15px;font-weight:600}
.empty p{margin:0;font-size:13px;line-height:2.1}
.empty code{
  background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px 7px;
  font-size:12.5px;color:var(--brand-d);cursor:pointer;font-family:inherit;
}
.empty code:hover{border-color:var(--brand);background:var(--brand-l)}
.more{text-align:center;padding:22px;color:var(--ink3);font-size:13px}
footer{
  border-top:1px solid var(--line);margin-top:28px;padding:18px 0 0;
  font-size:12px;color:var(--ink3);line-height:1.8;
}
footer a{color:var(--brand);text-decoration:none}
footer a:hover{text-decoration:underline}
@media (max-width:560px){
  .top .wrap{height:auto;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
  .top .meta{margin-left:0;text-align:left;width:100%}
  .mo{font-size:16px}
  .pimg{width:58px;height:58px}
  .kimgdel{left:50px}
  .prices{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
  .row>label{width:58px}
  .acts{margin-left:0;width:100%}
}
/* ---- 启动骨架（exe 版先出这个，数据到了再换成界面） ---- */
.boot{text-align:center;padding:72px 20px;color:var(--ink3);font-size:13px}
.boot .spin{width:26px;height:26px;margin:0 auto 14px;border:2.5px solid #e6eaf2;border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty .dim{color:var(--ink3);font-size:12.5px;margin-top:8px}
.empty.idle{padding:64px 20px}
/* ---- 全新机报价那一排（和清理价区分开） ---- */
.prices.newp{margin-top:9px}
.prices.newp .pr{background:#f7faff;border-color:#e3ecfb}
.pr.hot2 b{color:#1d4ed8}
.pr.tax b{font-size:15.5px}
/* 可点击价格格（点=填定价/算奖励）：悬浮描边 + 右上角小圆点提示可点 */
.pr.prpick{cursor:pointer;position:relative;transition:border-color .12s,box-shadow .12s}
.pr.prpick::after{content:'';position:absolute;top:7px;right:7px;width:5px;height:5px;border-radius:50%;
  background:#c3cddd;transition:.12s}
.pr.prpick:hover{border-color:var(--brand);box-shadow:0 0 0 2px rgba(46,107,230,.12)}
.pr.prpick:hover::after{background:var(--brand)}
.pr.prpick.on{border-color:var(--ok);background:#f2fbf6;box-shadow:inset 0 0 0 1px var(--ok)}
.pr.prpick.on::after{background:var(--ok)}
.pr.prpick.on b{color:#15803d}
.tag.np{background:#eef6ff;color:#1d4ed8;border-color:#d8e7fd;font-weight:600}
/* ---- 新字段的标签 ---- */
.row .vs{display:flex;flex-wrap:wrap;gap:6px}
.pill.ship{background:#f0fbf4;color:#1c7a45;border-color:#cdeedb;font-weight:600}
/* 「外区加100运费」的两种口径 */
.pill.ship-y{background:var(--brand-l);color:var(--brand-d);border-color:#d9e4ff}
.pill.ship-q{background:var(--warn-l);color:#a16207;border-color:#f0dcbb}
.pill.src{background:#f7f8fb;color:var(--ink2)}
.pill.s69{background:#fff8ec;color:#a16207;border-color:#f6e3bd}
.pill.sub{background:#fff3f3;color:#c2410c;border-color:#fbd9cf}
.pill.mono{font-variant-numeric:tabular-nums}
</style>

<body>

<main>
  <div class="wrap bodywrap">
    <aside class="side" id="side">
      <div class="searchbar">
        <svg class="ic" width="17" height="17" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/>
          <path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <input id="q" placeholder="型号 / 品类：BCD-501… / 冰箱" autocomplete="off" spellcheck="false">
        <button class="clr" id="clr" hidden title="清空">×</button>
      </div>
      <div class="fgroup" id="brandbox">
        <div class="fhead"><span class="flbl">品牌</span><span class="fcount" id="brandcount"></span></div>

      </div>
      <div class="fgroup" id="catbox">
        <div class="fhead"><span class="flbl">品类</span><span class="fcount" id="catcount"></span></div>
        <div class="chips" id="catchips"></div>
      </div>
      <div class="fgroup" id="tools">
        <div class="fhead"><span class="flbl">方式</span><span class="fcount" id="kindcount"></span></div>
        <div class="chips kinds">
          <button class="chip" data-kind="">全部</button>
          <button class="chip" data-kind="l" title="滞销清理型号总数">滞销</button>
          <button class="chip" data-kind="s" title="样机清理型号总数">样机</button>
        </div>
        <div class="fchkrow">
          <button class="chip fchk" data-flag="stock" title="只列出当前有现货的型号"><span class="box"></span>有现货</button>
          <button class="chip fchk" data-flag="send" title="只列出能发往外区（全国）的型号"><span class="box"></span>发全国</button>
          <button class="chip fchk" data-flag="hide" title="隐藏你已标记发布的型号"><span class="box"></span>未发布</button>
          <button class="chip fchk" data-flag="pub" title="看自己的发布记录（顶栏可筛正品/样机、开关定价时间；各账号各看各的）"><span class="box"></span>已发布</button>
          <button class="chip fchk" data-flag="nostock" title="已发布但没库存的（正品看正品仓、样机看样机仓）；看发布记录时筛当前这份的"><span class="box"></span>没库存</button>
        </div>
        <!-- 子用户发布（管理号=看每个子账号；子账号=看自己的）。下拉选中主区直接列出 TA 发布的卡片 -->
        <div class="subrec" id="subrec" hidden>
          <span class="lbl" id="subreclbl">子用户发布</span>
          <select id="subrecsel" style="width:100%;margin-top:6px;padding:8px 10px;border:1px solid #d7dce6;border-radius:9px;font-size:13px;background:#fff;outline:0;color:#333;cursor:pointer"></select>
        </div>
        <div style="display:flex;align-items:center;gap:6px;margin-top:10px;min-width:0">
          <span class="lbl" style="font-size:11.5px;color:#7b8494;white-space:nowrap;flex:none" title="按该型号最低清理价（美的系按拿货价）筛选">清理价</span>
          <div class="pricerow">
            <input class="pricebar-in" id="pmin" type="number" min="0" step="1" inputmode="decimal" placeholder="最低">
            <span class="tilde">~</span>
            <input class="pricebar-in" id="pmax" type="number" min="0" step="1" inputmode="decimal" placeholder="最高">
            <button class="pc" id="pclear" hidden>清除</button>
          </div>
        </div>
      </div>
      <div class="updbar" id="updbar" hidden style="display:none">
        <!-- 四个操作按钮已移到窗口顶部菜单栏（帮助前）；这里只留隐藏按钮给菜单触发用。
             「全部更新」2026-10-09 按用户要求挪到侧栏底部常显（见 .sidefoot） -->
        <button class="chip" id="updbtn">↻ 从金山文档更新数据</button>
        <button class="chip" id="stkbtn" title="管理号：从用友 YonSuite 拉实时现存量，拉完自动共享给所有子账号；子账号：直接从云端同步管理号共享的库存（不用登用友）">⟳ 更新实时库存</button>
        <button class="chip" id="appupd" title="检查并安装新版本：下载后在软件里直接静默覆盖安装，不用自己去下">⬆ 软件更新</button>
        <button class="chip" id="expimg" title="把你自己补的图导出成一个 json 文件（发给我，下次重建直接烤进页面）">导出我补的图</button>
        <button class="chip" id="impimg" title="导入之前导出的 补图.json">导入补图</button>
      </div>
      <input type="file" id="imgfile" accept="image/*" style="display:none">
      <input type="file" id="jsonfile" accept=".json,application/json" style="display:none">
      <div class="sidefoot">
        <span class="upnote" id="updmsg"></span>
        <div class="sidecount" id="meta"></div>
        <button class="sideall" id="allbtn" title="一键全量：金山表格（型号/价格/补贴）→ 用友实时库存，一条龙跑完">全部更新</button>
      </div>
    </aside>

    <div class="mains">
      <div class="pubwarn" id="pubwarn" hidden></div>
      <div class="yyalert" id="yyalert" hidden></div>
      <div class="hint" id="hint"></div>
      <div class="boot" id="boot" hidden><div class="spin"></div><p>正在读取数据…</p></div>
      <div class="list" id="list"></div>
      <div class="more" id="more" hidden></div>
      <footer id="foot"></footer>
    </div>
  </div>
</main>

<script>
(function(){
"use strict";
/* 数据怎么来，有两种：
   ① 离线单文件版：数据直接烤死在 <script id="payload"> 里（DATA 有值），双击即用；
   ② exe 版：页面自己只有几十 KB —— 先秒开窗口显示骨架，再去 /api/data 取数据。
      图片也不塞进页面，改成按需向 /img/<型号> 要（真正懒加载，用得着才解码）。
   DATA / CFG 都是构建时注入的。 */
var DATA = /*__DATA__*/null;
/* CFG 不用注入，按「数据有没有内联」自己判断：
   内联 = 离线单文件版（图片也是 dataURL）；
   没内联 = exe 版，数据和图片都走本地 HTTP（页面才几十 KB，窗口秒开）。 */
var CFG  = DATA
  ? { fetch: false, imgBase: '',      dataUrl: '' }
  : { fetch: true,  imgBase: '/img/', dataUrl: '/api/data' };
var META = {}, ALL = [], IMGS = {}, IMGHAS = null;
var WEB = null;                  /* 型号 → 官网产品详情页直链（catalog 命中的才有；没有就退回官网搜索页） */
var FEE  = 0.016;                // 闲鱼平台费率 1.6%
/* exe 版后台更新状态：price_at/stock_at = 最近一次金山/用友更新时间（侧栏显示）；
   rev = 后端数据版本号，变了就静默重拉数据，界面无感跟上 */
var UPSTATE = { price_at: "", stock_at: "", rev: null, fetching: false, alert_ts: null };
/* 用友告警横幅：/api/state 里 alert_ts 变了就亮牌（管理号才显示） */
function showYyAlert(msg){
  var el = document.getElementById('yyalert');
  if (!el || !msg) return;
  el.innerHTML = '<b>🔔 用友告警</b><span>' + esc(msg) + '</span>'
    + '<button class="close" title="知道了">×</button>';
  el.hidden = false;
  el.querySelector('.close').addEventListener('click', function(){ el.hidden = true; });
}
/* 实时库存（exe 版从用友 YonSuite 拉的现存量，点「更新实时库存」刷新）：
   STOCK = { 型号norm: { q:现存量, a:可用量, wt:{仓库类型:可用量} } }，键与 norm() 同一套归一 */
var STOCKDATA = null;
/* 库存匹配（2026-10-10 用户二次定稿，**只认一字不差**）：发布型号必须和用友型号
   完全一致才算有货——用友里多一个字（星河U1 这类描述尾）也= 不是同一个型号 = 没货。
   （归一只归写法：全半角/空格/大小写；内容多一个字少一个字都不算） */
function stockOf(mo){
  var s = STOCKDATA && STOCKDATA.stock;
  if (!s) return null;
  return s[norm(mo)] || null;                 // 一字不差精确，没有其他宽容
}
/* 已发布型号按发布类型的剩余可售（2026-10-09 从 pubStockWarn 抽出来，筛选「没库存」也要用）：
   正品发布看非样机/非次品仓的可用量，样机发布看样机仓；库存里查不到返回 -1（也当没库存提醒） */
function pubLeftOf(mo, kind){
  /* 2026-10-09 晚再定稿（用户：库存对不对是重中之重）：用友实时库存是唯一准绳——
     · 用友能查到这台 → 用可用量（0 就是真的没货，要报）；
     · 用友现存量报表里连这一行都没有 → 就是没有现存 = 没货（之前回退清理数量 1，
       导致卖光/清完的型号永远「有货」不报警，CXW-358-C3Q90FGUD 实锤）；
     · 只有实时库存还没拉过时才回退金山表清理数量兜底（此时横幅整体隐藏，仅筛选用）。
     （更早的误报反例 JSQ25：型号在用友有货但躺在别的仓——那会儿只数非样机非次品仓
       才漏的，现在直接用全仓可用量，不会重蹈） */
  var live = stockOf(mo);
  if (live) return isNum(live.a) ? Math.round(live.a) : 0;
  if (STOCKDATA && STOCKDATA.stock && Object.keys(STOCKDATA.stock).length) return 0;
  var it = null;
  for (var i = 0; i < ALL.length; i++){ if (ALL[i].mo === mo){ it = ALL[i]; break; } }
  var q = it ? (isNum(it.lq) ? it.lq : (isNum(it.sq) ? it.sq : null)) : null;
  return isNum(q) ? q : 0;
}
/* 按卡片键找型号条目（告警/筛选要用 it.mo 查库存——发布记录的键可能是变体码，
   直接拿去查库存会把有货的误报成「查不到」，2026-10-09 实锤 JSQ22 就是这么误报的） */
function itemOf(c){
  for (var i = 0; i < ALL.length; i++){ if (ALL[i].c === c) return ALL[i]; }
  return null;
}

/* ================= 本地存储 ================= */
/* 发布缓存按账号隔离（2026-10-09 修「已发布串号」）：旧版 xy2-* 键不分账号，
   同一台电脑换账号登录后，上一个账号的发布记录会残留给下一个账号看，
   甚至被 /pubsync 整包推上别人的云端。检测「上次账号 ≠ 本次账号」
   → 旧全局键按无主残留清掉（不迁移，避免把别人的搬进来），reload 一次吃干净状态 */
(function(){
  var lu = null; try { lu = localStorage.getItem('ml_lastuser'); } catch(e){}
  var au = ''; try { var a = JSON.parse(localStorage.getItem('ml_auth') || 'null'); au = (a && a.u) || ''; } catch(e){}
  if (lu !== au){
    try {
      ['xy2-published', 'xy2-prices', 'xy2-imgs', 'xy-published-v1', 'xy-prices-v1', 'xy-imgs-v1']
        .forEach(function(k){ localStorage.removeItem(k); });
      localStorage.setItem('ml_lastuser', au);
    } catch(e){ return; }              // 写不进（隐私模式等）就不 reload，防死循环
    if (lu !== null) location.reload(); // 首次部署只写标记不刷；真换了账号才刷
  }
})();
var MARK_KEY = 'xy2-published';
var HIDE_KEY = 'xy2-hidemarked';
var PRICE_KEY = 'xy2-prices';
var IMG_KEY = 'xy2-imgs';
function load(k, d){ try { var v = JSON.parse(localStorage.getItem(k)); return v && typeof v === 'object' ? v : d; } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
var MARKED = load(MARK_KEY, {});
/* 旧记录兼容：以前的值是时间戳数字，现在是 {t: 标记时间, k: 'l'|'s'（正品/样机）}——读入时统一包一层 */
(function(){
  var ch = false;
  Object.keys(MARKED).forEach(function(c){
    var v = MARKED[c];
    if (typeof v !== 'object' || v === null){ MARKED[c] = { t: +v || Date.now() }; ch = true; }
  });
  if (ch) saveMarks();
})();
var PRICES = load(PRICE_KEY, {});
var MYIMGS = load(IMG_KEY, {});
/* 换数据源（本地价格表 → 金山文档在线表）之前的旧记录也认：新版 key 还空着就搬过来 */
(function(){
  var pairs = [[MARK_KEY, 'xy-published-v1', function(v){ MARKED = v; save(MARK_KEY, v); }],
               [PRICE_KEY, 'xy-prices-v1',    function(v){ PRICES = v; save(PRICE_KEY, v); }],
               [IMG_KEY,   'xy-imgs-v1',      function(v){ MYIMGS = v; save(IMG_KEY, v); }]];
  for (var i = 0; i < pairs.length; i++){
    var cur = load(pairs[i][0], {});
    if (Object.keys(cur).length) continue;
    var old = load(pairs[i][1], {});
    if (Object.keys(old).length) pairs[i][2](old);
  }
})();
function saveMarks(){ save(MARK_KEY, MARKED); }
/* ---------- 发布记录云端化（跟账号走，换电脑登录也在） ----------
   KV 存 pub_<账号>；登录后整包合并一次，之后每标记/取消一条即时推一条。 */
function pubPush(c, on){
  if (!AUTH || !AUTH.token) return;
  /* ⚠ 必须显式带 Content-Type: application/json —— WebView2 里 string body 缺它时
     预检 OPTIONS 发得出去、实际 POST 却不跟，记录就静默丢了（实测踩坑）。
     k = 发布的是正品('l')还是样机('s')；p = 当时的闲鱼定价（没填就是 null） */
  authFetch('/pub', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({ c: c, on: on,
                                             k: (on && MARKED[c] && MARKED[c].k) || null,
                                             p: (on && isNum(PRICES[c])) ? PRICES[c] : null }) }, true);
}
function syncMarks(){
  if (!AUTH || !AUTH.token) return;
  /* 2026-10-10 修「串号阴魂不散」：登录合并原来是本地整包推 + 云端按时间戳只增不删，
     串号时代推进 pub_B 的 TB 记录躺在本地 MARK_KEY 里，每次登录都会被原样推回去，
     云端清了也白清。改定：**云端为准**——登录只上推定价（全量收价不变），
     发布标记一律以云端返回覆盖本地（标记/取消本来就是即时单条推 /pub，本地只是缓存） */
  authFetch('/pubsync', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                          body: JSON.stringify({ prices: PRICES }) }, true)
    .then(function(j){
      if (j && j.ok && j.marks){
        var changed = JSON.stringify(MARKED) !== JSON.stringify(j.marks);
        MARKED = j.marks; saveMarks();
        /* 云端定价拉回来补缺（2026-10-08 用户要求：没点标记发布的价格也要保存）——
           本机没有的型号用云上的（换电脑/清缓存场景）；本机已有的不动，以本地为准 */
        var pr = j.prices || {}, filled = false;
        Object.keys(pr).forEach(function(c){
          if (!(c in PRICES) && isFinite(+pr[c])){ PRICES[c] = +pr[c]; filled = true; }
        });
        if (filled) savePrices();
        if (changed || filled) run();
      }
    });
}
function savePrices(){ save(PRICE_KEY, PRICES); priceSyncSoon(); }
/* 定价上云不再挑「已标记发布」的型号 —— 本地一变就整包推 /pubsync；
   防抖 2.5s，打字/连续点击不会一格一包（worker 端已改成全量收） */
var _priceSyncT = null;
function priceSyncSoon(){
  if (!AUTH || !AUTH.token) return;
  clearTimeout(_priceSyncT);
  _priceSyncT = setTimeout(function(){
    authFetch('/pubsync', { method: 'POST', headers: { 'Content-Type': 'application/json' },

/* ================= 归一化（与 build.py 严格一致） ================= */
function half(s){
  return String(s == null ? '' : s)
    .replace(/[\uFF01-\uFF5E]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
    .replace(/\u3000/g, ' ');
}
function norm(s){ return half(s).replace(/\s+/g, '').toUpperCase(); }
function coreOf(s){
  var n = norm(s);
  var m = n.match(/[\u4e00-\u9fff]/);
  if (m && m.index >= 3) return n.slice(0, m.index).replace(/[()\-_/+.,、，]+$/, '');
  return n;
}
function coreOf2(s){
  var parts = norm(s).split(/[^0-9A-Z\/*\-+.]+/).filter(function(x){ return x.length >= 3; });
  if (!parts.length) return '';
  parts.sort(function(a,b){ return b.length - a.length; });
  return parts[0];
}

/* ================= 品类归一化 ================= */
var RE_KITCHEN = /油烟|燃气灶|煤气灶|灶具|洗碗|消毒柜|蒸箱|蒸烤|烤箱|小厨宝|电磁灶|电磁炉|微波炉|集成灶|厨房|厨电/;
var RE_SMALL = /电饭煲|压力锅|破壁机|空气炸|电水壶|电火锅|电饼铛|绞肉|料理机|榨汁|豆浆|风扇|吸尘|洗地|生活家电|小家电|除湿|加湿|暖风|电暖|门锁|晾衣|晾晒/;
function catGroup(v){
  var t = norm(v);
  if (!t) return '其他';
  if (t.indexOf('空调') >= 0 || t === '风管机' || t === '小风管' || t === '柜嵌' || t.indexOf('热泵') >= 0 || t.indexOf('家中机') >= 0) return '空调';
  if (t.indexOf('冰箱') >= 0) return '冰箱';
  if (t.indexOf('冷柜') >= 0 || t.indexOf('冰柜') >= 0) return '冷柜';
  if (t.indexOf('洗衣') >= 0) return '洗衣机';
  if (t.indexOf('热水') >= 0) return '热水器';
  if (t.indexOf('净水') >= 0 || t.indexOf('净饮') >= 0 || t.indexOf('饮水') >= 0) return '净水';
  if (t.indexOf('电视') >= 0 || t.indexOf('彩电') >= 0) return '电视';
  if (RE_KITCHEN.test(t)) return '厨电';
  if (RE_SMALL.test(t)) return '小家电';
  return '其他';
}

/* ================= 建索引（数据到位后才跑） ================= */
var UID = {}, BRANDS = [], CATS = [];
function buildIndex(){
  var i, r;
  UID = {};
  for (i = 0; i < ALL.length; i++){
    r = ALL[i];
    r._n  = norm(r.mo);
    r._c2 = coreOf2(r.mo);
    r._cg = catGroup(r.cat);
    r._h  = norm([r.cat, r.b, r.n, r.code, r.st, r.note].join(' '));
    // 美的 / 容声那张表是另一套报价（拿货价·慧买卖 / 给二批 / 价格取整），
    // 卡片和计算器要跟着换口径 —— 用这三个字段当标记
    r._md = isNum(r.mh) || isNum(r.m2) || isNum(r.mr);
    r._uid = i;
    UID[i] = r;
  }
  var mb = {}, mc = {};
  ALL.forEach(function(it){
    if (it.b) mb[it.b] = (mb[it.b] || 0) + 1;
    if (it._cg) mc[it._cg] = (mc[it._cg] || 0) + 1;
  });
  BRANDS = Object.keys(mb).map(function(k){ return { k: k, n: mb[k] }; })
    .sort(function(a,b){ return b.n - a.n; });
  /* 品类顺序用户拍板（2026-10-08）：固定业务排序，不按数量排；
     表里冒出来的新品类排在最后（数量降序） */
  var CAT_ORDER = ['冰箱','空调','洗衣机','净水','厨电','电视','热水器','冷柜','其他','小家电'];
  CATS = Object.keys(mc).map(function(k){ return { k: k, n: mc[k] }; })
    .sort(function(a,b){
      var ia = CAT_ORDER.indexOf(a.k), ib = CAT_ORDER.indexOf(b.k);
      if (ia < 0 && ib < 0) return b.n - a.n;
      if (ia < 0) return 1;
      if (ib < 0) return -1;
      return ia - ib;
    });
}

/* ================= 闲鱼定价计算器 =================
   成本下拉逐项受权限控制（p_lpz/p_spz/p_np/p_ny/p_pt）—— 管理号决定子账号能拿哪个价当成本 */
function costOptions(it){
  var o = [];
  // 美的 / 容声那张表是另一套报价：没有清理价，只有拿货价 / 给二批 / 取整
  if (it._md){
    if (pok('p_mh') && isNum(it.mh)) o.push({ v: it.mh, l: '拿货价·慧买卖' });
    if (pok('p_m2') && isNum(it.m2)) o.push({ v: it.m2, l: '给二批价' });
    if (pok('p_mr') && isNum(it.mr)) o.push({ v: it.mr, l: '价格取整' });
    return o;
  }
  // 成本口径：表里同一个型号可能有好几个价，按「清理价 → 全新机价」排，
  // 清理价排前面当默认（卖家多半是按清理价拿的货）。
  // 出库奖励（2026-10-08 二次改版）：**只由点击「出库奖励格」决定** —— 用户拍板
  // 「点了才算，没点不算」，选滞销/样机清理价口径不再自动把奖励算进去。
  if (pok('p_lpz') && isNum(it.lpz)) o.push({ v: it.lpz, l: '滞销清理价' });
  if (pok('p_spz') && isNum(it.spz)) o.push({ v: it.spz, l: '样机清理价' });

  if (pok('p_pt')  && isNum(it.pt))  o.push({ v: it.pt,  l: '价格含税' });

function calcUpdate(box){
  var inp = box.querySelector('input[type=number]');

  var feeEl = box.querySelector('.p-fee'), outEl = box.querySelector('.p-out');
  if (!isFinite(price) || price <= 0 || !isFinite(cost)){
    feeEl.textContent = '—'; outEl.textContent = '—'; outEl.className = 'p-out'; return;
  }
  // 出库奖励**只由点击奖励格**决定（calc 元素 data-bnlb / data-bnsb，金额在点击时存进去）。
  // 选「滞销/样机清理价」口径不再自动带奖 —— 用户拍板：点了才算，没点不算。
  var bn = (parseFloat(box.getAttribute('data-bnlb')) || 0)
         + (parseFloat(box.getAttribute('data-bnsb')) || 0);
  // 发全国运费 100（卖家承担）：勾上就扣；只发深惠广莞的本地单取消勾选
  var cfr = box.querySelector('.cfrbox');
  var freight = (cfr && cfr.checked) ? 100 : 0;
  var fee = round2(price * FEE), profit = round2(price - price * FEE - cost + bn - freight);
  var tags = [];
  if (bn > 0) tags.push('含奖' + money(bn));
  if (freight) tags.push('已扣运费100');
  feeEl.textContent = money(fee);
  outEl.textContent = (profit >= 0 ? '+' : '−') + money(Math.abs(profit)) + (tags.length ? '（' + tags.join(' · ') + '）' : '');
  outEl.className = 'p-out ' + (profit >= 0 ? 'pos' : 'neg');
}

   存本机 localStorage（ml_adminhide），换电脑各自独立 */
var ADMIN_HIDE = (function(){
  try { var v = JSON.parse(localStorage.getItem('ml_adminhide') || '{}'); return (v && typeof v === 'object') ? v : {}; } catch(e){ return {}; }
})();
function adminHideSave(){
  try { localStorage.setItem('ml_adminhide', JSON.stringify(ADMIN_HIDE)); } catch(e){}
  /* 同时上云（2026-10-09 用户要求：设置跟账号走，换电脑不用重弄）。防抖 600ms，
     云端 KV 最终一致 ~25s（另一台机器要等一会才见）；失败静默，下次改动再推 */
  if (!AUTH || AUTH.role !== 'admin' || !AUTH.token) return;
  clearTimeout(_shPushT);
  _shPushT = setTimeout(function(){
    authFetch('/selfhide', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ hide: ADMIN_HIDE }) }, true);
  }, 600);
}
var _shPushT = null;

  if (!AUTH) return false;

/* 带 X-Token 的云端请求；网络不通时 _st=0，会自动换备用域名试一轮 */
function authFetch(path, opts, withRetry){
  opts = opts || {};
  opts.headers = opts.headers || {};
  if (AUTH && AUTH.token) opts.headers['X-Token'] = AUTH.token;
  var hosts = [localStorage.getItem('ml_auth_host') || AUTH_HOSTS[0]];
  if (withRetry !== false) AUTH_HOSTS.forEach(function(h){ if (hosts.indexOf(h) < 0) hosts.push(h); });
  function tryOne(i){
    if (i >= hosts.length){
      return Promise.resolve({ ok: false, _st: 0, msg: '网络不通' });
    }
    return fetch(hosts[i] + path, opts).then(function(r){
      localStorage.setItem('ml_auth_host', hosts[i]);
      return r.json().then(function(j){ j._st = r.status; return j; });
    }).catch(function(){ return tryOne(i + 1); });
  }
  return tryOne(0);
}

        + '<button class="go" id="ago">登 录</button>'

      document.body.appendChild(m);

      function submit(){
        var u = m.querySelector('#au').value.trim(), p = m.querySelector('#ap').value;
        if (!u || !p){ m.querySelector('#aerr').textContent = '账号和密码都要填'; return; }
        var go = m.querySelector('#ago');
        go.disabled = true; go.classList.add('loading'); go.textContent = '登录中…';
        m.querySelector('#aerr').textContent = '';
        var tried = 0;
        function doLogin(){
          return authFetch('/login', { method: 'POST', body: JSON.stringify({ u: u, p: p }) }, false)
            .then(function(j){
              if (j && j._st === 0 && !j.ok && tried < AUTH_HOSTS.length - 1){
                tried++;
                var alt = AUTH_HOSTS.filter(function(h){
                  return h !== (localStorage.getItem('ml_auth_host') || '');
                });
                if (alt.length){ localStorage.setItem('ml_auth_host', alt[0]); return doLogin(); }
              }
              return j;
            });
        }
        doLogin().then(function(j){
            if (j && j.ok){
              try {
                if (m.querySelector('#arem').checked) localStorage.setItem('ml_remember', JSON.stringify({ u: u, p: p }));
                else localStorage.removeItem('ml_remember');
              } catch(e){}
              AUTH = { u: j.u, token: j.token, role: j.role, perm: j.perm || {} };
              authSave();
              m.remove(); afterAuth(); finish();
            } else {
              go.disabled = false; go.classList.remove('loading'); go.textContent = '登 录';
              m.querySelector('#aerr').textContent = (j && j.msg) || '登录失败，请重试';
            }
          });
      }
      m.querySelector('#ago').addEventListener('click', submit);
      m.querySelector('#ap').addEventListener('keydown', function(e){ if (e.key === 'Enter') submit(); });
    }
    function proceedAuth(){
      if (!AUTH){ showLogin(); return; }
      authFetch('/perm').then(function(j){
        if (j && j.ok){
          AUTH.role = j.role; AUTH.perm = j.perm || {}; authSave();
          afterAuth(); finish();
        } else if (j && j._st === 0){
          afterAuth(); finish();       // 云端连不上：先用缓存的权限顶着
        } else {                       // 401 / 停用

    /* localStorage 里没有登录态（硬退出没落盘 / 换了缓存目录）→ 从本地服务镜像恢复 */
    try {
      fetch('/api/token').then(function(r){ return r.ok ? r.json() : null; }).then(function(j){
        if (j && j.token){
          try { AUTH = JSON.parse(j.token); } catch(e){ AUTH = null; }
          if (AUTH) authSave();
        }
      }).catch(function(){}).then(function(){ proceedAuth(); });
    } catch(e){ proceedAuth(); }
  });
}

function copyText(it){
  var L = [it.mo];
  if (it.n) L.push(it.n);
  var pairs = [
    ['品牌', it.b], ['品类', it.cat], ['产品状态', it.st],
    ['零售指导价', it.lp > 0 ? money(it.lp) : null],
    ['滞销清理价', money(it.lpz)], ['滞销出库奖励', money(it.lb)], ['滞销清理数量', it.lq],
    ['样机清理价', money(it.spz)], ['样机出库奖励', money(it.sb)], ['样机清理数量', it.sq],
    ['发货区域', shipTextOf(it)], ['货来源', it.sfrom],
    ['价格含税', money(it.pt)], ['滞销价格', money(it.npz)], ['样机价格', money(it.nyz)],
    ['补贴69码', (it.sub2 && it.sub2.c) ? it.sub2.c : it.s69],
    ['补贴售价', it.sub2 && isNum(it.sub2.p) ? money(it.sub2.p) : null],
    ['闲鱼商品ID', it.xyid], ['闲鱼价格', money(it.xyp)],
    ['利润', it._md ? null : money(it.profit)],
    // 美的 / 容声那张表的报价口径
    ['拿货价·慧买卖', money(it.mh)], ['价格·给二批', money(it.m2)],
    ['价格取整', money(it.mr)],
    ['官网价', money(it.mp) + (isNum(it.mop) && it.mop > it.mp ? '（原价 ' + money(it.mop) + '）' : '')],
    ['京东价/国补后', money(it.jd)],
    ['物料编码', it.code]
  ];
  pairs.forEach(function(p){
    if (p[1] != null && p[1] !== '' && p[1] !== 0) L.push(p[0] + '：' + p[1]);
  });
  // 实时库存（用友 YonSuite，唯一库存来源）—— 只写「什么仓有几个」
  var lv = stockOf(it.mo);
  if (lv && ((lv.whs && lv.whs.length) || (lv.wt && Object.keys(lv.wt).length))){
    if (lv.whs && lv.whs.length){
      L.push('库存（' + ((STOCKDATA && STOCKDATA.ts) || '') + '）：' + lv.whs.map(function(x){
        return x.w + (x.t ? '（' + x.t + '）' : '') + ' ' + Math.round(x.n);
      }).join('；'));
    } else {
      var lvparts = [];
      for (var lkk in lv.wt){ lvparts.push(lkk + ' ' + Math.round(lv.wt[lkk])); }
      lvparts.sort(function(x, y){ return parseFloat(y.split(' ')[1]) - parseFloat(x.split(' ')[1]); });
      L.push('库存（' + ((STOCKDATA && STOCKDATA.ts) || '') + '）：' + lvparts.join(' / '));
    }
  }
  // 发往范围：所有海尔系型号都能发深惠广莞；表里另外写了口径的，连原文一起带上。
  // 美的 / 容声那张表没有「发货区域」列 → 不写，免得编
  if (!it._md){
    var lc = '深圳/惠州/广州/东莞';
    var nv = String(it.nat == null ? '' : it.nat).replace(/^[\s\-—－–]+/, '').trim();
    if (nv && NAT_LOCAL.indexOf(nv) < 0) lc += '；' + nv;
    L.push('可发范围：' + lc);
  }
  return L.join('\n');
}
function toast(btn, ok){
  var old = btn.textContent;
  btn.textContent = ok ? '已复制' : '复制失败';
  btn.classList.toggle('done', ok);
  setTimeout(function(){ btn.textContent = old; btn.classList.remove('done'); }, 1400);
}
function doCopy(text, btn){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast(btn, true); }, function(){ fb(text, btn); });
  } else { fb(text, btn); }
}
function fb(text, btn){
  try{
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-1000px';
    document.body.appendChild(ta); ta.select();
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    toast(btn, ok);
  }catch(e){ toast(btn, false); }
}

  var bp = lowPrice(it);
  if (bp == null) return false;
  if (pminV != null && bp < pminV) return false;
  if (pmaxV != null && bp > pmaxV) return false;
  return true;
}

  if (flagStock){
    var _lv = stockOf(it.mo);
    if (_lv){
      if (!((_lv.a || 0) > 0 || (_lv.q || 0) > 0)) return false;
    } else {
      var _gp = isNum(it.lav) ? it.lav : 0;
      var _sp = isNum(it.sav) ? it.sav : 0;
      if (!(_gp > 0) && !(_sp > 0)) return false;
    }
  }
  // 「只看能发外区」：排除掉 3 = 只发深惠广莞的（含空值 / 不可以 / 进货年限那两条）
  if (flagSend && (it.natk === 3 || it.natk == null)) return false;
  if (hideMarked && MARKED[it.c]) return false;
  if (flagPub && !MARKED[it.c]) return false;   // 只看已发布（跟 hide 互斥）
  /* 「没库存」：已发布但剩余可售 ≤0（或库存里查不到）；在看子用户发布时筛 TA 的 */
  if (flagNoStock){
    var _nm = SUBVIEW ? SUBVIEW.info[it.c] : MARKED[it.c];
    if (!_nm) return false;
    var _nk = (typeof _nm === 'object' && _nm && _nm.k) ? _nm.k : (it.k === 's' ? 's' : 'l');
    if (pubLeftOf(it.mo || it.c, _nk) > 0) return false;
  }
  if (SUBVIEW && !SUBVIEW.set[it.c]) return false;   // 只看某子用户发布的
  if (SUBVIEW && SUBVIEW.fk){                         // 正品/样机筛选（按发布时标的，老记录按型号兜底）
    var _pv = SUBVIEW.info[it.c];
    var _pk = _pv ? (_pv.k || (it.k === 'l' ? 'l' : (it.k === 's' ? 's' : ''))) : '';
    if (_pk !== SUBVIEW.fk) return false;
  }
  return pricePass(it);
}

/* ================= 检索 ================= */
var QCAP = 500;
function search(qRaw){
  var q = norm(qRaw);
  if (!q) return null;
  var qc = coreOf(qRaw), qc2 = coreOf2(qRaw);
  var qCJK = /[\u4e00-\u9fff]/.test(q);
  var hit = [], i, it, sc, ix;
  for (i = 0; i < ALL.length; i++){
    it = ALL[i];
    if (!pass(it)) continue;
    sc = 0; ix = -1;
    if (it._n === q) sc = 6;
    else if (qc && it.c === qc) sc = 5;
    else if (qc2 && it._c2 === qc2) sc = 4;
    else if (qc && it.c.indexOf(qc) === 0) sc = 3;
    else if (qc && it.c.indexOf(qc) > 0) sc = 2;
    else if (qc2 && it._c2 && it._c2.indexOf(qc2) === 0) sc = 2;
    else if (it._n.indexOf(q) >= 0) sc = 1;
    else if (it._h.indexOf(q) >= 0){ sc = 1; ix = it._h.indexOf(q); }
    if (sc > 0) hit.push({ sc: sc, it: it, ix: ix });
  }
  hit.sort(function(a,b){
    if (b.sc !== a.sc) return b.sc - a.sc;
    if (qCJK && a.ix !== b.ix) return a.ix - b.ix;
    return a.it.c.length - b.it.c.length || (a.it._n < b.it._n ? -1 : a.it._n > b.it._n ? 1 : 0);
  });
  return hit.length > QCAP ? hit.slice(0, QCAP) : hit;
}
function allFiltered(){
  var hit = [], i;
  for (i = 0; i < ALL.length; i++) if (pass(ALL[i])) hit.push({ sc: 0, it: ALL[i], ix: -1 });
  hit.sort(function(a,b){ return a.it.c.length - b.it.c.length || (a.it._n < b.it._n ? -1 : a.it._n > b.it._n ? 1 : 0); });
  return hit.length > QCAP ? hit.slice(0, QCAP) : hit;
}

function renderBatch(){
  var n = Math.min(shown + BATCH, cur.length), html = '';
  for (var i = shown; i < n; i++) html += renderItem(cur[i].it);
  if (html) listEl.insertAdjacentHTML('beforeend', html);
  shown = n;
  if (shown < cur.length){ moreEl.hidden = false; moreEl.textContent = '向下滚动加载更多（已显示 ' + shown + ' / ' + cur.length + '）'; }
  else moreEl.hidden = true;

function priceHint(){
  var a = parseFloat(pminEl.value), b = parseFloat(pmaxEl.value);
  if (isFinite(a) && isFinite(b)) return '清理价 ¥' + a + ' ~ ¥' + b;
  if (isFinite(a)) return '清理价 ≥ ¥' + a;
  if (isFinite(b)) return '清理价 ≤ ¥' + b;
  return '';
}

function run(){
  var q = input.value.trim();
  clrBtn.hidden = !q;
  readPrice();
  listEl.innerHTML = '';
  moreEl.hidden = true;
  shown = 0;
  var hasFilter = !!(curBrand || curCat || curKind || flagStock || flagSend || flagPub || flagNoStock || pminV != null || pmaxV != null || SUBVIEW);
  // 空搜索框 + 没点任何筛选 = 什么都不列。
  // （上一版是「打开就铺全部」，用户反馈又慢又没用 —— 这是查找工具，不是浏览工具）
  if (!q && !hasFilter){ cur = []; hintEl.innerHTML = ''; listEl.innerHTML = idleHTML(); return; }
  var res = q ? (search(q) || []) : allFiltered();
  cur = res;
  if (!res.length){
    hintEl.innerHTML = (SUBVIEW ? subHeaderHTML() + ' <span class="dot"></span> ' : '') + '无匹配结果';
    listEl.innerHTML = emptyHTML(q || '当前筛选'); return; }
  var ph = priceHint(), bits;
  if (q){
    var exact = 0, catm = 0;
    for (var i = 0; i < res.length; i++){
      if (res[i].sc >= 5) exact++;
      if (res[i].sc === 1) catm++;
    }
    bits = '找到 <b>' + res.length + '</b> 条'
      + (exact ? '（精确型号 <b>' + exact + '</b> 条）' : (catm === res.length ? '（按品类/名称匹配）' : '（模糊匹配）'));
  } else {
    bits = '筛选到 <b>' + res.length + '</b> 条';
  }
  hintEl.innerHTML = (SUBVIEW ? subHeaderHTML() + ' <span class="dot"></span> ' : '')
    + bits
    + (ph ? ' <span class="dot"></span> ' + esc(ph) : '')
    + (res.length >= QCAP ? ' <span class="dot"></span> 仅显示前 ' + QCAP + ' 条，请多输入几个字符' : '');
  renderBatch();
}

/* ---------- 点击价格格：填定价 + 切成本口径 / 开关奖励（2026-10-08 用户方案） ----------
   · 点「滞销价格 / 样机价格 / 价格含税 / 滞销清理价 / 样机清理价 / 拿货价·慧买卖…」：
     闲鱼定价框自动填这个价，成本下拉切到同口径 —— 之后手改定价框，挣仍按这个口径算；
   · 点「滞销/样机出库奖励」：把这笔奖励算进「挣」，再点一次取消（不填定价）；
   · 成本口径已经是「xx清理价」时（奖励已含在 data-bn 里），对应奖励格点了不重复加。 */
function normBasis(s){ return String(s || '').replace(/[\s·]/g, ''); }
function pickCell(cell){
  var card = cell.closest('.card');
  var box = card && card.querySelector('.calc');
  if (!box) return;
  var sel = box.querySelector('.costsel');
  var inp = box.querySelector('input[type=number]');
  /* --- 奖励格：只切「算不算这笔奖励」，不动定价框。点了才算，没点不算；
         再点一次取消。任何口径下都可点（不再有「口径已含」限制）。 --- */
  if (cell.dataset.bonus){
    var isLb = cell.dataset.bonus === 'lb';
    var k = isLb ? 'data-bnlb' : 'data-bnsb';
    if (box.getAttribute(k)){ box.removeAttribute(k); cell.classList.remove('on'); }
    else { box.setAttribute(k, cell.dataset.v || '0'); cell.classList.add('on'); }
    calcUpdate(box);
    return;
  }
  /* --- 价格格：成本切到同口径 + 定价框填这个价 --- */
  if (sel){
    var want = normBasis(cell.dataset.basis);
    for (var i = 0; i < sel.options.length; i++){
      if (normBasis(sel.options[i].getAttribute('data-l')) === want){ sel.selectedIndex = i; break; }
    }
  }
  if (inp && isFinite(parseFloat(cell.dataset.v))) inp.value = cell.dataset.v;
  /* 走一遍 input 事件：calcUpdate + PRICES 持久化都挂在那儿，别抄第二份 */
  if (inp) inp.dispatchEvent(new Event('input', { bubbles: true }));
}

    if (all){ all.disabled = on; all.textContent = on ? (label || '正在更新…') : '全部更新'; }
  }
  function reset(){ busy(false); }

  function poll(){
    fetch('/api/state', { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(s){
      if (s.status === 'running'){
        msg.innerHTML = '<span class="spin"></span>' + esc(s.msg || '正在更新…');

        msg.innerHTML = '<span class="spin"></span>' + esc(s.msg || '等待扫码登录…');
        busy(true, '等待扫码…'); setTimeout(poll, 1500);
      } else if (s.status === 'done'){
        msg.innerHTML = '✅ 更新完成，正在刷新…';
        setTimeout(function(){ location.reload(); }, 700);
      } else if (s.status === 'error'){
        msg.innerHTML = '❌ 更新失败：' + esc(s.msg || '');
        reset();
      } else {
        reset();
      }
    }).catch(function(){ setTimeout(poll, 1500); });
  }

  btn.addEventListener('click', function(){
    if (btn.disabled) return;
    busy(true, '正在更新…');
    msg.innerHTML = '<span class="spin"></span>正在连接金山文档…';
    fetch('/api/update', { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(r){
      if (!r.ok){ msg.textContent = '更新失败：' + (r.msg || ''); reset(); return; }
      poll();
    }).catch(function(e){ msg.textContent = '请求失败：' + e; reset(); });
  });

  stk.addEventListener('click', function(){
    if (stk.disabled) return;
    busy(true, '正在更新库存…');
    var isAdmin = AUTH && AUTH.role === 'admin';
    msg.innerHTML = '<span class="spin"></span>' + (isAdmin
      ? '正在连接用友 YonSuite…（拉完自动共享给所有子账号；如需登录会先尝试自动登录）'
      : '正在从云端同步库存（管理号共享的用友实时数据）…');
    fetch('/api/stock', { method: 'POST', cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(r){
      if (!r.ok){ msg.textContent = '更新失败：' + (r.msg || ''); reset(); return; }
      poll();
    }).catch(function(e){ msg.textContent = '请求失败：' + e; reset(); });
  });

  /* ---- 全部更新：触发云端（GitHub Actions）→ 跑完自动同步（2026-10-09 v2.8）----
     wf = all（表格+库存）/ kd（只表格）/ yy（只库存）；原生菜单的「从金山文档更新数据」
     和「更新实时库存」也走这里（startCloud），只是 wf 不同。 */
  function startCloud(wf){
    if (all && all.disabled) return;
    busy(true, '正在云端更新…');
    msg.innerHTML =
      '<div class="uprog"><div class="meta"><span>正在触发云端更新（GitHub Actions）…</span><b>刚点击</b></div>'
      + '<div class="bar"><div class="fill" style="width:3%"><div class="glow"></div></div></div></div>';
    fetch('/api/updateall', { method: 'POST', cache: 'no-store',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ wf: wf || 'all' })
    }).then(function(r){ return r.json(); }).then(function(r){
      if (!r.ok){
        if (r.running){ pollAll(); return; }   // 已经在跑（比如定时跟随先动了）：直接接管显示进度
        msg.textContent = '更新失败：' + (r.msg || ''); busy(false); return;
      }
      pollAll();
    }).catch(function(e){ msg.textContent = '请求失败：' + e; busy(false); });
  }
  window.startCloud = startCloud;              // 原生菜单经 pywebview evaluate_js 调
  if (all){
    all.addEventListener('click', function(){ startCloud('all'); });
  }
  function pollAll(){
    fetch('/api/updateall', { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(s){
      if (s.running){
        var pct = Math.min(99, Math.max(3, s.pct || 5));
        var stage = esc(s.stage || '正在更新…');
        /* 2026-10-10 用户定稿：时间不要（删「已用/已等」），改回显示百分比（后端按阶段平滑推进） */
        msg.innerHTML =
          '<div class="uprog">'
          + '<div class="meta"><span>' + stage + '</span><b>' + pct + '%</b></div>'
          + '<div class="bar"><div class="fill" style="width:' + pct + '%"><div class="glow"></div></div></div>'
          + '</div>';
        all.textContent = '正在云端更新（' + pct + '%）';
        setTimeout(pollAll, 1500);
        return;
      }
      all.textContent = '全部更新';
      if (s.had_err){
        var bad = esc(s.msg || '');
        msg.innerHTML = '⚠ 更新完成，部分环节失败<br>' + esc(s.summary || '').replace(/\u3000\|\u3000/g, '<br>')
          + (bad ? '<br>失败：' + bad : '');
      } else {
        msg.innerHTML = '✅ 全部更新完成<br>' + esc(s.summary || '').replace(/\u3000\|\u3000/g, '<br>') + '<br>正在刷新…';
      }
      setTimeout(function(){ location.reload(); }, s.had_err ? 6000 : 3500);
    }).catch(function(){ setTimeout(pollAll, 1500); });
  }

  /* ---- 软件自更新：查新版 → 一键下载静默覆盖安装（2026-10-08） ---- */
  (function(){
    var au = document.getElementById('appupd');
    if (!au) return;
    au.addEventListener('click', function(){
      if (au.disabled) return;
      au.disabled = true; au.textContent = '检查中…';

        if (!r.ok){ msg.textContent = '检查失败：' + (r.msg || ''); au.disabled = false; au.textContent = '⬆ 软件更新'; return; }
        if (!r.newer){

        au.textContent = '正在下载…';
        fetch('/api/appinstall', { method: 'POST', cache: 'no-store' })

          .then(function(r2){
            if (!r2.ok){ msg.textContent = '更新失败：' + (r2.msg || ''); au.disabled = false; au.textContent = '⬆ 软件更新'; return; }
            poll();     // 下载进度走 /api/state（running 状态的 msg 里有百分比），装完软件自动重启
          })
          .catch(function(e){ msg.textContent = '请求失败：' + e; au.disabled = false; au.textContent = '⬆ 软件更新'; });
      }).catch(function(e){

    fetch('/api/appcheck', { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(r){
      if (r.ok && r.newer){ au.textContent = '⬆ 有新版本 v' + r.latest; au.classList.add('hot'); }
    }).catch(function(){});
  })();

  /* ---- 软件更新弹窗（2026-10-09）：菜单「帮助 → 软件更新」直接走这里 ----
     旧实现是 evaluate_js 去点 #appupd 隐藏按钮，反馈只有侧栏底部一行 12px 小字，
     已是最新版时几乎看不见 → 用户以为点了没反应「用不了」。
     现在开正经弹窗：检查结果 / 下载百分比 / 安装提示全程可见。 */
  window.openAppUpdate = function(){
    var oldm = document.getElementById('adminmask'); if (oldm) oldm.remove();
    var m = document.createElement('div'); m.id = 'adminmask';
    m.innerHTML = '<div class="amodal" style="width:min(460px,94vw)">'
      + '<h3>软件更新 <button class="achip" id="apx" style="float:right">关闭</button></h3>'
      + '<div id="apbody" style="font-size:13.5px;color:#3a4354;line-height:1.9;min-height:48px">'
      + '<i class="apspin"></i> 正在检查新版本…</div></div>';
    document.body.appendChild(m);
    m.querySelector('#apx').addEventListener('click', function(){ m.remove(); });
    var body = m.querySelector('#apbody');
    var SPIN = '<i class="apspin"></i> ';
    function say(html){ body.innerHTML = html; }
    function fail(html){
      say('❌ ' + html + '<br><span style="color:#98a2b3;font-size:12.5px">'
        + '如果开着 Clash 等代理，请给 kdns.fr 加直连规则或切直连后重试</span>');
    }
    fetch('/api/appcheck', { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(r){
      if (!r.ok){ fail('检查失败：' + esc(r.msg || '')); return; }
      if (!r.newer){
        say('✅ 已经是最新版 <b>v' + esc(r.cur) + '</b>（云端最新 v' + esc(r.latest) + '），不用更新');
        return;
      }
      say('🚀 发现新版本 <b>v' + esc(r.latest) + '</b>（当前 v' + esc(r.cur) + '，约 '
        + Math.round((r.size || 0) / 1048576) + ' MB）<br>' + SPIN + '正在下载，下载完自动安装，不用你操作…');
      fetch('/api/appinstall', { method: 'POST', cache: 'no-store' })
        .then(function(r2){ return r2.json(); })
        .then(function(r2){
          if (!r2.ok){ fail('更新失败：' + esc(r2.msg || '')); return; }
          var tick = function(){
            fetch('/api/state', { cache: 'no-store' }).then(function(r3){ return r3.json(); }).then(function(s){
              if (!m.isConnected) return;                 // 弹窗已关就不再刷
              if (s.status === 'error'){ fail(esc(s.msg || '更新失败')); return; }
              say('🚀 更新到 <b>v' + esc(r.latest) + '</b><br>' + SPIN + esc(s.msg || '处理中…'));
              setTimeout(tick, 1200);
            }).catch(function(){ setTimeout(tick, 1500); }); // 装新版时本地服务会断，静默重试
          };
          tick();
        })
        .catch(function(e){ fail('请求失败：' + esc(String(e))); });
    }).catch(function(e){
      fail('检查失败：' + esc(String(e)));
    });
  };

  fetch('/api/state', { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(s){
    if (s.status === 'running' || s.status === 'login'){ busy(true); poll(); }
  }).catch(function(){});

  /* ---- 后台状态轮询（30 秒）----
     ① 侧栏「价格 xx · 库存 xx」跟着最近一次更新时间走；
     ② rev 变了（后台每小时自动更新成功）→ 静默重拉数据重渲染，界面无感跟上，不用重开软件。
     保护：更新进行中不重拉；有输入框在打字就下轮再说。 */
  var metaEl = document.getElementById('meta');
  function applyState(s){
    UPSTATE.price_at = s.price_at || '';
    UPSTATE.stock_at = s.stock_at || '';
    if (metaEl) metaEl.innerHTML = metaHTML();
  }
  function reloadAll(){
    if (UPSTATE.fetching) return;
    UPSTATE.fetching = true;
    var pD = fetch(CFG.dataUrl || '/api/data', { cache: 'no-store' })
      .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
    var pS = fetch('/api/stock', { cache: 'no-store' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .catch(function(){ return null; });
    Promise.all([pD, pS]).then(function(a){
      var d = a[0], s = a[1];
      if (s && s.stock && Object.keys(s.stock).length) STOCKDATA = s;
      start(d);
    }).catch(function(){}).then(function(){ UPSTATE.fetching = false; });
  }
  setInterval(function(){
    if (UPSTATE.fetching) return;
    fetch('/api/state', { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(s){
      applyState(s);
      /* 用友告警（管理号）：后端轮询云端拿到了新告警 → 顶部亮红横幅 */
      if (s.alert_ts && UPSTATE.alert_ts === null){ UPSTATE.alert_ts = s.alert_ts;
        if (s.alert_msg) showYyAlert(s.alert_msg); }               // 首轮基线+历史告警也显示
      else if (s.alert_ts && s.alert_ts !== UPSTATE.alert_ts){ UPSTATE.alert_ts = s.alert_ts;
        showYyAlert(s.alert_msg || '用友登录失败，请检查密码'); }
      if (s.status === 'running' || s.status === 'login') return;
      if (UPSTATE.rev === null){ UPSTATE.rev = s.rev; return; }   // 首轮只记基线
      if (s.rev !== UPSTATE.rev){
        var f = document.activeElement;
        if (f && f.tagName === 'INPUT') return;                    // 正在打字，下轮再说
        UPSTATE.rev = s.rev;
        reloadAll();
      }
    }).catch(function(){});
  }, 30000);
})();

/* ESC 关掉当前弹着的小窗（账号管理 / 我的账号 / 发布记录 / 正品·样机选择）；没有弹窗时不动。
   Ctrl+W 收进托盘：WinForms 层的 KeyPreview 拦不到 WebView2 里的按键（键盘消息直达 Chromium 子窗口），
   所以必须在页面里监听，经 pywebview js_api 调 Python 的 hide_main()（exe 版才挂了这个桥）。 */
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){
    var mk = document.getElementById('kindmask');
    if (mk){ mk.remove(); return; }
    var adm = document.getElementById('adminmask');
    if (adm){ adm.remove(); }
    return;
  }
  if (e.ctrlKey && !e.shiftKey && !e.altKey && (e.key === 'w' || e.key === 'W')){
    e.preventDefault();
    try { if (window.pywebview && window.pywebview.api) window.pywebview.api.hide_main(); } catch(err){}
  }
});

/* 一行 chip（品牌 / 品类）。2026-10-08 改版：数字从 chip 上拿掉（悬停 title 里看），
   视觉降噪；品类 cap=999 全展示（用户要求不折叠）。组名移到分组盒盒头。 */
function chipRow(label, attr, items, cap){
  var html = '<button class="chip on" data-' + attr + '="">全部</button>';
  items.forEach(function(x, i){
    var over = i >= cap;
    html += '<button class="chip' + (over ? ' extra' : '') + '" data-' + attr + '="' + esc(x.k) + '"'
          + (over ? ' hidden' : '') + ' title="' + esc(x.k) + '：' + x.n + ' 个型号">' + esc(x.k) + '</button>';
  });
  if (items.length > cap){
    html += '<button class="chip mini" data-more="' + attr + '">更多 ' + (items.length - cap) + ' ▾</button>';
  }
  return html;
}
function toggleMore(box, btn){
  var extra = box.querySelectorAll('.chip.extra');
  if (!extra.length) return;
  var open = extra[0].hidden;
  Array.prototype.forEach.call(extra, function(c){ c.hidden = !open; });
  btn.textContent = open ? '收起 ▴' : ('更多 ' + extra.length + ' ▾');
}

/* 侧栏底部一行：exe 版显示最近一次价格/库存更新时间（后台静默更新后自动跟着变）；
   单文件公布版没有本地服务，显示数据构建时间。 */
function metaHTML(){
  var n = ALL.length.toLocaleString('zh-CN');
  if (location.protocol === 'http:' && (UPSTATE.price_at || UPSTATE.stock_at)){
    /* 2026-10-09 用户定稿：三行 —— 型号个数 / 数据：时间 / 库存：时间，
       谁更新了显示谁的最近更新时间，没更新过的显示「—」 */
    var pa = UPSTATE.price_at ? '<b>' + esc(UPSTATE.price_at) + '</b>' : '—';
    var sa = UPSTATE.stock_at ? '<b>' + esc(UPSTATE.stock_at) + '</b>' : '—';
    return '型号 <b>' + n + '</b> 个'
         + '<span class="mt">数据：' + pa + '</span>'
         + '<span class="mt">库存：' + sa + '</span>';
  }
  return '型号 <b>' + n + '</b> 个'
       + '<span class="mt">数据：<b>' + esc(META.built || '—') + '</b></span>'
       + '<span class="mt">库存：—</span>';
}
function initUI(){
  /* 无感重载会重跑 initUI：chips 重画前记住当前选中，重画后恢复（后台刷数据不能把筛选归零） */
  function snapOn(el, attr){
    var out = [];
    Array.prototype.forEach.call(el.querySelectorAll('.chip.on'), function(c){
      out.push(c.getAttribute(attr));
    });
    return out;
  }
  var keepB = snapOn(chipsEl, 'data-brand'), keepC = snapOn(catchipsEl, 'data-cat');
  var keepT = [];
  Array.prototype.forEach.call(toolsEl.querySelectorAll('.chip.on'), function(c){
    keepT.push([c.getAttribute('data-kind'), c.getAttribute('data-flag')]);
  });

  document.getElementById('meta').innerHTML = metaHTML();

  chipsEl.innerHTML    = chipRow('品牌', 'brand', BRANDS, 999);   // 品牌全展示
  catchipsEl.innerHTML = chipRow('品类', 'cat',   CATS,   999);   // 品类也全展示（2026-10-08 用户要求）
  Array.prototype.forEach.call(chipsEl.querySelectorAll('.chip'), function(c){
    if (keepB.indexOf(c.getAttribute('data-brand')) >= 0) c.classList.add('on');
  });
  Array.prototype.forEach.call(catchipsEl.querySelectorAll('.chip'), function(c){
    if (keepC.indexOf(c.getAttribute('data-cat')) >= 0) c.classList.add('on');
  });
  updateCounts();
  (function(){
    toolsEl.querySelector('.chip[data-kind=""]').classList.add('on');
    var hb = toolsEl.querySelector('.chip[data-flag="hide"]');
    if (hideMarked) hb.classList.add('on');
    var pb = toolsEl.querySelector('.chip[data-flag="pub"]');
    if (pb && flagPub) pb.classList.add('on');
    /* 恢复「方式」区选中（无感重载场景）：先清默认再按快照加回 */
    if (keepT.length){
      Array.prototype.forEach.call(toolsEl.querySelectorAll('.chip'), function(c){ c.classList.remove('on'); });
      Array.prototype.forEach.call(toolsEl.querySelectorAll('.chip'), function(c){
        for (var i = 0; i < keepT.length; i++){
          if (c.getAttribute('data-kind') === keepT[i][0] && c.getAttribute('data-flag') === keepT[i][1]) c.classList.add('on');
        }
      });
    }
  })();

  /* footer 数据源说明块已按要求去掉（2026-10 六次改版）；型号数/数据时间在侧栏底部 */
  document.getElementById('foot').innerHTML = '';

  var boot = document.getElementById('boot');
  if (boot) boot.hidden = true;
  input.focus();
  run();
}

/* 库存提醒：每次拿到实时库存就核对一遍已发布型号——
   正品发布看「非样机/非次品」仓的可用量，样机发布看样机仓；为 0 就提醒下架。
   平时盯自己标记的；在看某子用户发布时改成盯 TA 的（2026-10-09）。
   型号可能一大串：逐个红色小牌排列，带总数 */
function pubStockWarn(){
  var box = document.getElementById('pubwarn');
  if (!box) return;
  /* 2026-10-10 用户定稿：这个提醒是给「发布这条商品的人」的——管理号查看别人的发布
     时不弹（不是管理号要下架）；发布者本人（自看 or 主列表盯自己的 MARKED）照常提醒 */
  if (SUBVIEW && SUBVIEW.u !== '0' && AUTH && AUTH.role === 'admin'){ box.hidden = true; return; }
  if (!STOCKDATA || !STOCKDATA.stock || !Object.keys(STOCKDATA.stock).length){ box.hidden = true; return; }
  var marks = MARKED, who = '';
  if (SUBVIEW && SUBVIEW.info && Object.keys(SUBVIEW.info).length){
    who = SUBVIEW.disp || SUBVIEW.u;
    marks = {};
    Object.keys(SUBVIEW.info).forEach(function(c){
      var v = SUBVIEW.info[c];
      marks[c] = { k: (v && v.k) ? v.k : 'l' };
    });
  }
  var lost = [];
  Object.keys(marks).forEach(function(c){
    var m = marks[c]; if (!m) return;
    var it = itemOf(c);
    var kind = m.k || (it && it.k === 's' ? 's' : 'l');
    var left = pubLeftOf((it && it.mo) || c, kind);   // 用型号查库存，别用记录键（变体码查不到）
    if (left <= 0) lost.push(c + '（' + (kind === 's' ? '样机' : '正品') + '）');
  });
  if (!lost.length){ box.hidden = true; box.innerHTML = ''; return; }
  box.hidden = false;
  box.innerHTML = '⚠ ' + (who ? '「' + esc(who) + '」已发布的型号' : '这些你已发布的型号') + '已经没库存了，记得下架（<b>共 ' + lost.length + ' 个</b>）：'
    + lost.map(function(s){
      return '<span style="display:inline-block;margin:2px 4px 2px 0;padding:2px 8px;border-radius:8px;background:#fdecec;color:#b42318;font-weight:600;font-size:12px">' + esc(s) + '</span>';
    }).join('')
    + '<a id="pubwarnx">知道了</a>';
  var x = box.querySelector('#pubwarnx');
  if (x) x.onclick = function(){ box.hidden = true; };
}
/* 数据到位 → 建索引 → 起界面 */
function start(d){
  META = (d && d.meta) || {};
  ALL  = (d && d.rows) || [];
  IMGS = (d && d.imgs) || {};
  WEB  = (d && d.web) || null;
  IMGHAS = null;
  var keys = (d && d.imgkeys) || null;
  if (keys){
    IMGHAS = {};
    for (var i = 0; i < keys.length; i++) IMGHAS[keys[i]] = 1;
  }
  try { buildIndex(); }
  catch(e){
    document.getElementById('list').innerHTML =
      '<div class="empty"><h3>数据解析出错</h3><p>' + esc(String((e && e.message) || e)) + '</p></div>';
    return;
  }
  initUI();
  pubStockWarn();                      // 库存到了就核对一遍已发布的（哪种没货提醒下架）
}

/* 调试/自动化验证挂钩（只读函数引用，无副作用）：CDP 验证脚本从 window.__ML 取主脚本内部状态 */
window.__ML = {
  get ALL(){ return ALL; },
  get WEB(){ return WEB; },
  get MARKED(){ return MARKED; },
  get SUBVIEW(){ return SUBVIEW; },
  get UPSTATE(){ return UPSTATE; },
  get hideMarked(){ return hideMarked; },
  get flagSend(){ return flagSend; },
  get flagStock(){ return flagStock; },
  get flagPub(){ return flagPub; },
  get curKind(){ return curKind; },
  pass: pass,
  costOptions: costOptions,
  run: run
};
ensureAuth().then(function(){
if (DATA){
  start(DATA);                      // 离线单文件版：数据本来就烤在页面里
} else {
  /* exe 版：页面秒开，数据随后到（实时库存一起取，接口在本地，秒回） */
  var pData = fetch(CFG.dataUrl || '/api/data', { cache: 'no-store' })
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  var pStock = fetch('/api/stock', { cache: 'no-store' })
    .then(function(r){ return r.ok ? r.json() : null; })
    .catch(function(){ return null; });
  pData.then(function(d){
    return pStock.then(function(s){
      if (s && s.stock && Object.keys(s.stock).length) STOCKDATA = s;
      start(d);
    });
  }).catch(function(e){
    var el = document.getElementById('list');
    if (el) el.innerHTML = '<div class="empty"><h3>数据没加载上来</h3><p>'
      + esc(String((e && e.message) || e)) + '</p>'
      + '<p>点菜单「数据 → 重新加载」，或者重启软件试试。</p></div>';
  });
}
});
})();
</script>
</body>
</html>
